<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Crush</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* Prevent the whole page from shifting sideways: the giant-head explosion
   (head scales to 4.6x, giant BÙM! text, rainbow glow) can extend past the
   board edge when a 4+ match sits near the left/right side. Two layers of
   defence: (1) #boardWrap clips every effect to the board, so nothing can
   reach past the frame; (2) overflow-x:clip on html/body stops any horizontal
   scroll or shift at the page level. (clip is stronger than hidden: it
   removes the scrollable overflow entirely instead of just hiding the bar.) */
html { overflow-x: clip; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* v27: stop iOS Safari inflating small HUD text */
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #ff2d78, #ff9500, #ffe600, #2ed573, #00d2ff, #7c4dff, #ff2d78, #ff6b9d);
  background-size: 400% 400%;
  animation: bgShift 8s ease infinite;
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center;
  color:#3a2b1f; overflow-x:clip; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
}
@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
/* ---------- Lively background decor (behind everything, never blocks taps) ---------- */
#bgDecor { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.screen { position:relative; z-index:1; }
.bg-float {
  position:absolute; bottom:-12vh; display:block; pointer-events:none;
  will-change: transform, opacity;
  animation: floatUpBg var(--rise, 18s) linear infinite;
}
.bg-float.twinkle { animation: floatUpBg var(--rise, 18s) linear infinite, twinkle 1.6s ease-in-out infinite alternate; }
@keyframes floatUpBg {
  0% { transform: translateY(0) rotate(0deg); opacity:0; }
  8% { opacity:.9; }
  85% { opacity:.9; }
  100% { transform: translateY(-125vh) rotate(300deg); opacity:0; }
}
@keyframes twinkle { from { opacity:.35; } to { opacity:1; } }
h1 { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size: clamp(34px, 9vw, 50px); font-weight:800; line-height:1.1; letter-spacing:1px; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff, #ff2d78); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.8px #000; filter: drop-shadow(0 3px 0 rgba(255,255,255,.85)) drop-shadow(0 6px 10px rgba(0,0,0,.25)); animation: titleBounce 2.4s ease-in-out infinite; }
@keyframes titleBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.rainbow-arc { display:block; margin: 2px auto 0; }
h2 { font-size: clamp(20px, 5.5vw, 28px); color:#7c4dff; }
button {
  font-family: inherit; cursor:pointer; border:none; border-radius: 999px;
  padding: 12px 26px; font-size: 18px; font-weight: bold; color:#fff;
  background: linear-gradient(180deg, #ff8fb3, #ff5c8a);
  box-shadow: 0 4px 0 #d63d68, 0 6px 12px rgba(0,0,0,.18);
  transition: transform .08s ease, box-shadow .08s ease;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d63d68; }
button.small { padding: 8px 16px; font-size: 15px; }
button.green { background: linear-gradient(180deg, #7ee081, #43b581); box-shadow: 0 4px 0 #2e8b57, 0 6px 12px rgba(0,0,0,.18); }
button.rainbow { position:relative; overflow:hidden; font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:22px; padding: 14px 42px; background: linear-gradient(135deg, rgba(255,255,255,.85) 0%, rgba(170,215,255,.75) 30%, rgba(255,170,225,.75) 60%, rgba(200,180,255,.75) 85%, rgba(255,255,255,.85) 100%); border: 2px solid rgba(255,255,255,.95); text-shadow: 0 2px 4px rgba(80,120,180,.6); box-shadow: inset 0 0 22px rgba(255,255,255,.9), 0 8px 20px rgba(0,0,0,.18), 0 0 24px rgba(170,215,255,.6); animation: bubbleWobble 2.2s ease-in-out infinite; }
button.rainbow::before { content:''; position:absolute; left:12px; top:5px; width:46px; height:22px; border-radius:50%; background:rgba(255,255,255,.9); filter: blur(1px); transform: rotate(-12deg); pointer-events:none; }
button.rainbow .mini-bubble { position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,.9); background:rgba(255,255,255,.35); animation: bubbleFloat 2s ease-in-out infinite; pointer-events:none; }
button.rainbow .mini-bubble.b1 { right:14px; top:6px; width:12px; height:12px; }
button.rainbow .mini-bubble.b2 { left:16px; bottom:5px; width:8px; height:8px; animation-delay:.7s; }
button.rainbow:active { transform: translateY(2px) scale(.98); box-shadow: inset 0 0 22px rgba(255,255,255,.9), 0 4px 12px rgba(0,0,0,.18), 0 0 24px rgba(170,215,255,.6); }
@keyframes bubbleWobble { 0%, 100% { transform: scale(1, 1) rotate(0deg); } 50% { transform: scale(1.04, .97) rotate(.6deg); } }
@keyframes bubbleFloat { 0%, 100% { transform: translateY(0); opacity:.6; } 50% { transform: translateY(-5px); opacity:1; } }
button.green:active { box-shadow: 0 1px 0 #2e8b57; }
button.blue { background: linear-gradient(180deg, #7cc4ff, #3f8cff); box-shadow: 0 4px 0 #2b62b8, 0 6px 12px rgba(0,0,0,.18); }
button.blue:active { box-shadow: 0 1px 0 #2b62b8; }
button.ghost { background:#fff; color:#7c4dff; box-shadow: 0 4px 0 #d9d2ff; }
button:disabled { opacity:.55; cursor:default; }
.screen { width:100%; max-width:520px; padding: 14px 12px 28px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.hidden { display:none !important; }

/* ---------- Start screen ---------- */
#startScreen { text-align:center; }
/* v31.39: bé cá mập BƠI SẢI thật — sprite sheet trong suốt (video Dreamina BƠI SẢI đã tách nền; sprite 30 khung, hiển thị 200x99; bé nằm sấp bơi ngang qua làn, tay quạt BƠI SẢI, chân đạp nhẹ, nhún nhẹ trên mặt nước + bong bóng bay lên.
   CSS-only cho bơi ngang + bob; JS nhỏ đổi khung hình sprite.
   Lane nằm trong #startScreen nên tự ẩn khi vào game. */
#swimLane { position:relative; width:100%; height:118px; overflow:hidden; perspective:700px; border-radius:14px; background: linear-gradient(180deg, #a5dcf0 0%, #69bce3 38%, #3f9cd4 68%, #2c88c3 100%); box-shadow: inset 0 2px 10px rgba(255,255,255,.45), inset 0 -8px 14px rgba(0,60,110,.35); }
#swimLane::before { content:""; position:absolute; left:0; right:0; top:6px; height:10px; z-index:1; background: radial-gradient(ellipse 26px 7px at 18px 5px, rgba(255,255,255,.75), rgba(255,255,255,0) 70%), radial-gradient(ellipse 34px 8px at 58px 6px, rgba(255,255,255,.55), rgba(255,255,255,0) 70%); background-size: 88px 12px; background-repeat: repeat-x; animation: waveMove 4s linear infinite; opacity:.8; }
#swimLane::after { content:""; position:absolute; left:0; right:0; bottom:8px; height:10px; z-index:1; background: radial-gradient(ellipse 30px 7px at 30px 5px, rgba(255,255,255,.35), rgba(255,255,255,0) 70%), radial-gradient(ellipse 38px 8px at 74px 6px, rgba(255,255,255,.28), rgba(255,255,255,0) 70%); background-size: 88px 12px; background-repeat: repeat-x; animation: waveMove 5.5s linear infinite reverse; opacity:.6; }
@keyframes waveMove { from { background-position: 0 0; } to { background-position: 88px 0; } }
#swimShark { position:absolute; top:8px; left:8px; width:200px; z-index:2; animation: swimX 11s linear infinite; will-change:left, transform; transform-style: preserve-3d; }
.swimChar { position:relative; width:200px; height:99px; animation: swimBob3D 2.4s ease-in-out infinite alternate; }
.swimSprite { position:absolute; left:0; top:0; width:200px; height:99px; display:block; transform: translateZ(0); will-change: transform; filter: drop-shadow(4px 6px 8px rgba(0, 30, 80, 0.35)); }
@keyframes swimX { 0% { left:8px; transform: rotateY(0deg); } 40% { left:calc(100% - 208px); transform: rotateY(0deg); } 50% { left:calc(100% - 208px); transform: rotateY(180deg); } 90% { left:8px; transform: rotateY(180deg); } 100% { left:8px; transform: rotateY(360deg); } }
@keyframes swimBob3D { from { transform: translateY(-2px) rotate(-1deg) rotateX(3deg) scale(1); } to { transform: translateY(3px) rotate(1deg) rotateX(-3deg) scale(1.03); } }
.swim-bubble { position:absolute; bottom:4px; z-index:3; width:12px; height:12px; border-radius:50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(170,215,255,.55)); border:1px solid rgba(255,255,255,.8); opacity:0; animation: bubbleRise 3.4s ease-in infinite; }
.sb1 { left:24%; animation-delay:0s; }
.sb2 { left:50%; width:9px; height:9px; animation-delay:1.2s; }
.sb3 { left:76%; width:14px; height:14px; animation-delay:2.3s; }
@keyframes bubbleRise { 0% { transform:translateY(0); opacity:0; } 15% { opacity:1; } 100% { transform:translateY(-56px); opacity:0; } }
@media (prefers-reduced-motion: reduce) { #swimShark, #swimShark .swimSprite, .swim-bubble, #swimLane::before, #swimLane::after { animation:none; } #swimShark { left:50%; transform:translateX(-50%); } }

.logo-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin: 6px 0; }
.logo-row img { width:56px; height:56px; border-radius:16px; box-shadow: 0 4px 10px rgba(0,0,0,.2); animation: logoBob 2s ease-in-out infinite; }
@keyframes logoBob { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-5px) rotate(var(--rot, 0deg)); } }
.tagline { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:17px; font-weight:700; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,.35); }
.tagline b { color:#ffe600; }
.card {

}

.howto-head { display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; }
.howto-head .howto-title { margin-bottom:0; }
.howto-toggle { display:none; flex:0 0 auto; font-size:13px; font-weight:800; color:#7c4dff; background:#efe9ff; border:2px solid #d9d2ff; border-radius:999px; padding:3px 10px; white-space:nowrap; }
.howto-title { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:20px; font-weight:800; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.5px #000; margin-bottom: 8px; }
.rule { display:flex; gap:10px; align-items:flex-start; font-size:16px; font-weight:600; color:#4a3527; line-height:1.5; margin-top:6px; }
.rule .num { flex: 0 0 26px; width:26px; height:26px; border-radius:50%; color:#fff; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); margin-top:1px; }
.rule b { color:#ff2d55; }
.visit-count { display:inline-block; background: rgba(255,255,255,.92); border-radius:999px; padding:4px 14px; font-size:15px; font-weight:700; color:#6b5a4a; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.best-line { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:17px; font-weight:800; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
.level-info { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:16px; font-weight:800; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
.rb { background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff, #ff2d78); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.6px #000; font-size:1.15em; }

/* v27 compact HUD + board (2026-11-13): top panel too tall + board spilled at the
   bottom — smaller back button (was the tallest row), tighter
   padding/gaps/fonts on every size, square board centered (no more
   stretch-to-fill), svh sizing so it fits with Safari toolbar up,
   text-size-adjust + 100vh fallbacks for older phones/browsers. */
/* ---------- HUD ---------- */
#hud {
  width:100%; background-color: #fffdf5;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%20viewBox%3D%220%200%20120%20120%22%3E%0A%3Cg%20opacity%3D%220.55%22%3E%0A%20%20%3Cg%20fill%3D%22%23ff9ecf%22%3E%3Cellipse%20cx%3D%2216%22%20cy%3D%2224%22%20rx%3D%224%22%20ry%3D%223.2%22%2F%3E%3Ccircle%20cx%3D%2210.5%22%20cy%3D%2218.5%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2216.5%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2217.5%22%20cy%3D%2216.5%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2218.5%22%20r%3D%221.8%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%234db8ff%22%3E%3Cpath%20d%3D%22M66%2014%20Q74%208%2082%2014%20Q74%2020%2066%2014%20Z%22%2F%3E%3Cpath%20d%3D%22M82%2014%20L88%2010%20L88%2018%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23ffb347%22%3E%3Cpath%20d%3D%22M102%2046%20L104%2051%20L109%2051.5%20L105%2055%20L106.5%2060%20L102%2057.5%20L97.5%2060%20L99%2055%20L95%2051.5%20L100%2051%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23ff9ecf%22%3E%3Cellipse%20cx%3D%2226%22%20cy%3D%2272%22%20rx%3D%222.6%22%20ry%3D%225.5%22%2F%3E%3Cellipse%20cx%3D%2233%22%20cy%3D%2272%22%20rx%3D%222.6%22%20ry%3D%225.5%22%2F%3E%3Ccircle%20cx%3D%2229.5%22%20cy%3D%2282%22%20r%3D%225%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%234db8ff%22%3E%3Cpath%20d%3D%22M62%2092%20Q70%2078%2078%2090%20Q70%2094%2062%2092%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23ff5c8a%22%3E%3Cpath%20d%3D%22M104%20100%20C100%2096%2098%2093.5%2098%2091.5%20C98%2089.5%2099.5%2088%20101.5%2088%20C102.8%2088%20103.8%2088.8%20104%2090%20C104.2%2088.8%20105.2%2088%20106.5%2088%20C108.5%2088%20110%2089.5%20110%2091.5%20C110%2093.5%20108%2096%20104%20100%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23b06bff%22%3E%3Cpath%20d%3D%22M46%2044%20A7%207%200%200%201%2060%2044%20Z%22%2F%3E%3Cpath%20d%3D%22M49%2044%20Q49%2049%2048%2051%20M53%2044%20Q53%2049%2053%2051%20M57%2044%20Q57%2049%2058%2051%22%20stroke%3D%22%23b06bff%22%20stroke-width%3D%221.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E");
  background-size: 120px 120px;
  border-radius: 24px; position:relative;
  padding: 5px 8px 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
  display:flex; flex-direction:column; gap:2px; touch-action:none;
}
.hud-doodle { position:absolute; pointer-events:none; line-height:0; z-index:1; }
.hud-row { display:flex; justify-content:space-between; align-items:center; gap:4px; flex-wrap:wrap; }
.hud-stat { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:12px; font-weight:700; line-height:1.25; color:#4a3527; }
.hud-stat b { font-size:16px; font-weight:800; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff, #ff2d78); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.7px #000; }
.hud-btns { display:flex; gap:3px; }
.icon-btn {
  padding:2px 5px; font-size:11px; border-radius:12px; min-width:26px;
  background:#fff; color:#5a4632; box-shadow: 0 3px 0 #e0d8d0;
}
#hud .icon-btn { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-weight:700; border: 2px solid #ff5c8a; }
/* v17: big back button, top-left corner of the start screen — easy to tap */
.back-btn-big { position:absolute; top:12px; left:12px; width:52px; height:52px; font-size:30px; line-height:1; display:flex; align-items:center; justify-content:center; background:#fff; color:#5a4632; border:none; border-radius:16px; box-shadow: 0 4px 0 #e0d8d0, 0 6px 16px rgba(0,0,0,.18); cursor:pointer; z-index:5; font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-weight:700; }
.back-btn-big:active { transform: translateY(2px); box-shadow: 0 2px 0 #e0d8d0, 0 3px 10px rgba(0,0,0,.15); }
/* v17: game-HUD back button made bigger — easier to tap while playing */
#hubBtn { padding:4px 9px; font-size:16px; min-width:38px; } /* v27: was the tallest row */
#hud .icon-btn.blue { border-color: #00b4ff; }

.hud-perk-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.hud-perk-row .progress { flex:1; min-width:0; }
#progressFill { height:100%; width:0%; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff); border-radius:999px; transition: width .3s ease; }

/* ---------- Board ---------- */
#boardWrap { width:calc(100% + 24px); max-width:none; margin-left:-12px; margin-right:-12px; position:relative; overflow:hidden; border-radius:18px; touch-action:none; }

/* Small-screen fix (mom's iPhone 16 Pro): the game page is taller than the
   viewport there, so a drag starting on a gap could still slide the whole
   page up/down. Lock the entire game screen against page scroll. The board
   stays FULL width (big tiles for mom) — instead the HUD is made compact on
   narrow screens (below), which frees the vertical room the page needs.
   v13 (An's call 2026-11-12): the leaderboard moved OUT of the game screen
   to the start screen — the game screen is just HUD + board now. */
#gameScreen { touch-action:none; width:100%; min-height:100vh; min-height:100dvh; min-height:100svh; justify-content:center; justify-content:safe center; gap:4px; padding-top:4px; padding-bottom:64px; } /* v27: svh last = fits even with Safari toolbar up */

/* Compact HUD on narrow phones (iPhone 16 Pro): smaller padding/fonts/buttons
   so the HUD fits fully and leaves room for the full-size board. */
@media (max-width:430px) {
  #hud { padding:3px 6px 5px; gap:2px; border-radius:16px; }
  .hud-stat { font-size:11px; }
  .hud-stat b { font-size:15px; }
  .hud-row { gap:3px; }
  .icon-btn { padding:2px 4px; font-size:10px; min-width:24px; }
  .progress { height:6px; }
  .perk-line { font-size:.7rem; padding:2px 6px; margin-top:0; }
}
#board {
  position:relative; width:100%; aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, rgba(255,107,157,.85), rgba(255,165,2,.85), rgba(46,213,115,.85), rgba(30,144,255,.85));
  border-radius:18px;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
  overflow:hidden; touch-action:none;
}
.tile {
  position:absolute; left:0; top:0; width:12.5%; height:12.5%; padding:0;
  transition: transform .22s ease;
  will-change: transform;
  touch-action:none;
}
.tile .inner {
  width:100%; height:100%; border-radius:14%; overflow:hidden; position:relative;
  transition: transform .15s ease, opacity .18s ease;
}
/* High-visibility tiles for An's mom (blurry eyes): each animal gets its own
   light tinted background, so tiles read apart by color even at a glance.
   NO border/frame on any tile (An 2026-11-12: only the character + the coloured
   tile behind it; the old 3px outer frame extended into neighbours and covered
   their edges). Placed before .selected/.hint so those still override. */
.tile.t-shark .inner { background:#d6ecff; }
.tile.t-otter .inner { background:#f0e0cc; }
.tile.t-rabbit .inner { background:#fff8ec; }
.tile.t-mouse .inner { background:#e8eaec; }
.tile.t-jellyfish .inner { background:#e9defc; }
.tile.t-fox .inner { background:#ffe8cc; }
.tile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
/* Glitter sparkle on every tile: three tiny gold stars that twinkle.
   Small and soft (9-11px, peak opacity .85, edge-biased spots so they never
   cover the face) - no fast flashing, no screen shake. */
.tile .sparkle { position:absolute; line-height:1; color:#ffd700; pointer-events:none; z-index:3; animation:sparkleTwinkle 2.4s ease-in-out infinite; opacity:0; }
.tile .sparkle.s1 { font-size:11px; }
.tile .sparkle.s2 { font-size:9px; color:#ffe27a; }
.tile .sparkle.s3 { font-size:10px; }
@keyframes sparkleTwinkle { 0%,100% { opacity:0; transform:scale(.5) rotate(0deg); } 50% { opacity:.85; transform:scale(1.05) rotate(20deg); } }
.tile.selected .inner { outline:3px solid #ffcf3f; outline-offset:-1px; z-index:5; }
.tile.pop .inner { transform: scale(.1); opacity:0; }
/* match bounce: matched tiles hop up and down happily before they pop.
   Runs on the outer .tile via the `translate`/`scale` properties, so it
   composes with the inline grid-position transform (no layout shift). */
.tile.match-bounce { animation: matchBounce .21s ease-out; }
@keyframes matchBounce {
  0% { translate: 0 0; scale: 1 1; }
  30% { translate: 0 -32%; scale: .94 1.08; }
  55% { translate: 0 0; scale: 1.09 .85; }
  75% { translate: 0 -12%; scale: .97 1.04; }
  100% { translate: 0 0; scale: 1 1; }
}
.tile.new .inner { animation: dropIn .25s ease; }
@keyframes dropIn { from { transform: translateY(-30%) scale(.8); } to { transform: none; } }
/* Level-start ice pour (approved mockup v4 + sound Mẫu A): tiles drop one by
   one like ice cubes into a glass, each with a splash ring + flash when it
   lands. --d staggers the fall (45ms per cube, reading order), --rot gives
   each cube its own tumble angle. Runs on .inner (and .tile pseudos) so it
   composes with the outer tile's grid-position transform; #board clips the
   fall at the frame edge, so cubes appear to pour into the frame. */
.tile.ice-drop .inner { animation: iceDropIn .45s backwards; animation-delay: var(--d, 0ms); }
.tile.ice-drop::after { content:""; position:absolute; inset:8%; border-radius:50%; border:3px solid rgba(255,255,255,.95); box-shadow:0 0 10px rgba(255,255,255,.9), inset 0 0 8px rgba(255,255,255,.6); opacity:0; pointer-events:none; z-index:3; animation: iceSplash .55s ease-out both; animation-delay: calc(var(--d, 0ms) + 300ms); }
.tile.ice-drop .inner::before { content:""; position:absolute; inset:20%; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%); opacity:0; pointer-events:none; z-index:2; animation: iceFlash .28s ease-out both; animation-delay: calc(var(--d, 0ms) + 300ms); }
@keyframes iceDropIn {
  0% { transform: translateY(-340px) rotate(var(--rot, 0deg)) scale(1); opacity: 0; animation-timing-function: cubic-bezier(.55,.06,.68,.19); }
  18% { opacity: 1; }
  72% { transform: translateY(0) rotate(0deg) scale(1.08); opacity: 1; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  80% { transform: translateY(5px) scale(1.12, 0.88); }
  90% { transform: translateY(-7px) scale(0.97, 1.03); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes iceSplash {
  0% { transform: scale(.3); opacity: .95; }
  100% { transform: scale(1.5); opacity: 0; }
}
@keyframes iceFlash {
  0% { transform: scale(.2); opacity: .8; }
  100% { transform: scale(1); opacity: 0; }
}
/* hint: pulsing yellow outline on the two swappable tiles */
.tile.hint .inner { outline:3px solid #ffe45e; outline-offset:-1px; animation: hintPulse .7s ease-in-out infinite; z-index:4; }
@keyframes hintPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
/* water ripple on tile touch (about 2s) */
.tile .ripple { position:absolute; inset:0; pointer-events:none; z-index:4; overflow:hidden; border-radius:14%; }
.tile .ripple::before { content:""; position:absolute; left:50%; top:50%; width:18%; height:18%; border:3px solid rgba(140,210,255,.95); border-radius:50%; transform: translate(-50%,-50%); animation: rippleRing 2s ease-out forwards; }
.tile .ripple::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 50% 50%, rgba(120,200,255,.45), rgba(120,200,255,0) 65%); animation: rippleWash 2s ease-out forwards; }
@keyframes rippleRing { 0% { width:18%; height:18%; opacity:.95; } 100% { width:150%; height:150%; opacity:0; } }
@keyframes rippleWash { 0% { opacity:1; } 100% { opacity:0; } }
/* bomb tile: colorful midnight-blue wolf head, clearly a special tile, not an animal */
.tile.bomb .inner { background: radial-gradient(circle at 35% 30%, #1e3a8a, #0f1f4d 70%); box-shadow: 0 0 0 2px #7dd3fc, 0 0 16px #38bdf8, 0 2px 5px rgba(0,0,0,.22); animation: bombPulse 1s ease-in-out infinite; }
@keyframes bombPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
#bombDragEl { position:fixed; z-index:100; pointer-events:none; width:64px; height:64px; transform: translate(-50%,-50%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
#bombDragEl img { width:100%; height:100%; display:block; }
.tile.bomb-target .inner { outline:3px solid #ff5c5c; outline-offset:-1px; }
/* low time warning */
.hud-stat.low b { color:#ff2d55; animation: timeBlink 1s ease-in-out infinite; }
@keyframes timeBlink { 0%,100% { opacity:1; } 50% { opacity:.45; } }
/* level transition screen with the bouncing animal train over a doodle sky.
   The 6 heads travel left to right like a train (6s loop) while each head hops
   high like a ball (0.9s per head, neighbours offset 0.15s so the wave rolls
   across the train). Each hop squashes on landing, stretches on takeoff, and
   leaves a glowing light trail in its own color under it. --ths is the head
   size, sized to the 440px card so the train fits on desktop and phone. */
#transitionScreen { position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, rgba(255,45,120,.88), rgba(255,149,0,.88), rgba(0,210,255,.88)); padding:16px; --ths: clamp(40px, 12.5vw, 64px); }
#transitionScreen.hidden { display:none !important; }
.trans-card { background: rgba(255,255,255,.94); border-radius:24px; padding:22px 18px; width:100%; max-width:440px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; box-shadow: 0 12px 40px rgba(0,0,0,.3); }

.trans-card p { font-size:17px; }

.trans-row { position:absolute; left:0; right:0; bottom:26px; z-index:2; display:flex; justify-content:space-evenly; align-items:flex-end; padding:0 6px; animation: transTrain 6s linear infinite; }
@keyframes transTrain { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.trans-spot { position:relative; width:var(--ths); height:calc(var(--ths) * 2.15); flex:0 1 auto; }
.trans-shadow { position:absolute; left:12%; bottom:0; width:76%; height:10px; background:rgba(46,90,40,.28); border-radius:50%; animation: transShadow 0.9s linear infinite; animation-delay: var(--d); }

  background: repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.wrapped .inner { box-shadow: inset 0 0 0 2px #ffd23f; animation: wrapPulse .8s ease-in-out infinite; }
@keyframes wrapPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.tile.rainbow .inner {
  box-shadow: inset 0 0 0 2px #fff;
  animation: rainbowSpin 2s linear infinite;
}
@keyframes rainbowSpin {
  0% { filter: hue-rotate(0deg) brightness(1.15); }
  100% { filter: hue-rotate(360deg) brightness(1.15); }
}
.float-score {
  position:absolute; z-index:20; font-weight:bold; font-size:20px; color:#ff5c8a;
  text-shadow: 1px 1px 0 #fff; pointer-events:none;
  animation: floatUp 0.9s ease-out forwards;
}
@keyframes floatUp { from { opacity:1; transform: translate(-50%,0); } to { opacity:0; transform: translate(-50%,-46px); } }

/* ---------- Explosion & lightning FX ---------- */
/* Screen shake animations removed: they gave An eye strain and headaches. */
/* ---------- Win celebration ---------- */
#celebrate { position:fixed; inset:0; z-index:60; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; overflow:hidden; }
#celebrate.hidden { display:none !important; }
.celeb-shark { width: min(260px, 58vw); height: auto; animation: sharkJump .55s ease-in-out infinite alternate; filter: drop-shadow(0 8px 16px rgba(0,0,0,.3)); }
@keyframes sharkJump { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-20px) rotate(4deg) scale(1.04); } }
.celeb-text { font-size: clamp(38px, 11vw, 64px); font-weight:900; color:#ffcf3f; text-shadow: 3px 3px 0 #fff, 0 0 24px #ff9d00, 0 6px 14px rgba(0,0,0,.35); animation: celebPop .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes celebPop { 0% { transform: scale(.2) rotate(-8deg); opacity:0; } 60% { transform: scale(1.15) rotate(2deg); opacity:1; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.celeb-stars { display:flex; gap:10px; }
.celeb-stars .star { font-size: clamp(40px, 12vw, 64px); color:#ffd23f; text-shadow: 0 0 16px #ff9d00, 2px 2px 0 #fff; animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes starPop { 0% { transform: scale(0) rotate(-30deg); opacity:0; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.confetti-piece { position:absolute; top:-14px; pointer-events:none; will-change: transform; }
.tile.dance .inner { animation: tileDance .5s ease-in-out infinite alternate; }
@keyframes tileDance { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-6px) rotate(4deg) scale(1.08); } }
#fxLayer { position:absolute; inset:0; z-index:25; pointer-events:none; border-radius:18px; }
/* #boardWrap now clips the effects to the board (overflow:hidden), so debris
   and the giant head can no longer push the page sideways; the layer itself
   stays unclipped so particles can still fly freely inside the frame */
.particle { position:absolute; border-radius:50%; pointer-events:none; will-change: transform, opacity; }
.particle.confetti { border-radius:2px; }
.particle.droplet { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
/* water-bubble burst: translucent shiny bubble + ripple ring over matched tiles */
.fx-bubble { position:absolute; width:12.5%; aspect-ratio:1/1; transform: translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:23;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.28) 20%, rgba(165,220,255,0.18) 55%, rgba(125,211,252,0.4) 100%);
  border: 2px solid rgba(255,255,255,0.75);
  box-shadow: inset 0 0 8px rgba(255,255,255,0.6), 0 0 10px rgba(125,211,252,0.5); }
.fx-bubble::after { content:""; position:absolute; left:16%; top:10%; width:36%; height:24%; border-radius:50%; border-top:3px solid rgba(255,255,255,0.95); transform: rotate(-25deg); }
.fx-ripple { position:absolute; width:12.5%; aspect-ratio:1/1; transform: translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:23;
  border: 2px solid rgba(186,230,253,0.9); box-shadow: 0 0 8px rgba(125,211,252,0.6); }
.fx-flash-screen { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:45; }
.boom-text {
  position:absolute; z-index:26; font-weight:900; font-size: clamp(48px, 12vw, 64px); color:#ffcf3f;
  text-shadow: 3px 3px 0 #fff, 0 0 26px #ff9d00, 0 6px 12px rgba(0,0,0,.35);
  pointer-events:none; white-space:nowrap; transform: translate(-50%,-50%);
}
.fx-flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
.fx-bolt { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #ffe45e); }
/* striped-candy beam: white-hot core with a warm gold glow, sweeping out from the candy.
   Thunder version: much stronger glow so the beam blazes across the row/column. */
.fx-beam { position:absolute; z-index:24; pointer-events:none; }
.fx-beam.h { left:0; width:100%; height:12.5%; background: linear-gradient(180deg, rgba(255,190,0,0) 0%, rgba(255,210,60,.8) 16%, #fffbe8 40%, #ffffff 50%, #fffbe8 60%, rgba(255,210,60,.8) 84%, rgba(255,190,0,0) 100%); box-shadow: 0 0 10px 2px rgba(255,200,40,.55); animation: beamSweepX .34s ease-out forwards; }
.fx-beam.v { top:0; height:100%; width:12.5%; background: linear-gradient(90deg, rgba(255,190,0,0) 0%, rgba(255,210,60,.8) 16%, #fffbe8 40%, #ffffff 50%, #fffbe8 60%, rgba(255,210,60,.8) 84%, rgba(255,190,0,0) 100%); box-shadow: 0 0 10px 2px rgba(255,200,40,.55); animation: beamSweepY .34s ease-out forwards; }
/* big bright beam for many-tile clears (8+): a white-pink cross of light through
   the cleared area, much wider and brighter than the striped beam */
.fx-bigbeam { position:absolute; z-index:24; pointer-events:none; }
.fx-bigbeam.v { top:0; height:100%; width:16%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(255,180,240,0) 0%, rgba(255,150,230,.75) 18%, #fff0fb 38%, #ffffff 50%, #fff0fb 62%, rgba(255,150,230,.75) 82%, rgba(255,180,240,0) 100%); box-shadow: 0 0 30px 12px rgba(255,170,235,.8), 0 0 70px 26px rgba(255,120,220,.45); animation: bigBeamIn .55s ease-out forwards; }
.fx-bigbeam.h { left:0; width:100%; height:16%; transform: translateY(-50%); background: linear-gradient(180deg, rgba(255,180,240,0) 0%, rgba(255,150,230,.75) 18%, #fff0fb 38%, #ffffff 50%, #fff0fb 62%, rgba(255,150,230,.75) 82%, rgba(255,180,240,0) 100%); box-shadow: 0 0 30px 12px rgba(255,170,235,.8), 0 0 70px 26px rgba(255,120,220,.45); animation: bigBeamIn .55s ease-out forwards; }
@keyframes bigBeamIn { 0% { opacity:0; } 25% { opacity:1; } 100% { opacity:0; } }
@keyframes beamSweepX { 0% { transform: scaleX(0); opacity:.55; } 45% { transform: scaleX(1); opacity:1; } 100% { transform: scaleX(1); opacity:0; } }
@keyframes beamSweepY { 0% { transform: scaleY(0); opacity:.55; } 45% { transform: scaleY(1); opacity:1; } 100% { transform: scaleY(1); opacity:0; } }
/* rainbow lightning: blue-white electric bolts, clearly different from the warm gold beam.
   Thunder version: much thicker glow so the bolts blaze across the board. */
.fx-bolt-blue { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; filter: drop-shadow(0 0 10px #bae6fd) drop-shadow(0 0 26px #38bdf8) drop-shadow(0 0 44px #0ea5e9); }
/* thunder flash: icy blue full-screen flash for lightning strikes */
.fx-flash-thunder { background: #cfeeff; }
/* giant head zoom: one tile image swelling up and flying out at the player */
.fx-giant-head { position:absolute; width:12.5%; aspect-ratio:1/1; z-index:30; pointer-events:none; transform: translate(-50%,-50%); filter: drop-shadow(0 8px 14px rgba(0,0,0,.35)); will-change: transform, opacity; }
/* RGB rainbow light stream behind the giant head: rotating rainbow rays + soft rainbow
   glow + twinkling rainbow sparkles. Sits behind the head (z-index 29 vs head 30). */
.fx-giant-rgb { position:absolute; width:68%; aspect-ratio:1/1; z-index:29; pointer-events:none; transform: translate(-50%,-50%); will-change: transform, opacity; }
.fx-giant-rgb .rgb-glow { position:absolute; inset:0; border-radius:50%; background: conic-gradient(from 0deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff, #ff2d78, #ff2d55); filter: blur(10px); opacity:.85; }
.fx-giant-rgb .rgb-rays { position:absolute; inset:-6%; border-radius:50%; background: repeating-conic-gradient(from 0deg, #ff2d55 0deg 10deg, transparent 10deg 20deg, #ff9500 20deg 30deg, transparent 30deg 40deg, #ffe600 40deg 50deg, transparent 50deg 60deg, #2ed573 60deg 70deg, transparent 70deg 80deg, #00d2ff 80deg 90deg, transparent 90deg 100deg, #7b5cff 100deg 110deg, transparent 110deg 120deg); -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 45%, transparent 72%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 45%, transparent 72%); animation: rgbRaysSpin 1.1s linear infinite; opacity:.95; }
@keyframes rgbRaysSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.fx-giant-rgb .rgb-spark { position:absolute; line-height:1; pointer-events:none; animation: rgbSparkTwinkle .5s ease-in-out infinite alternate; text-shadow: 0 0 8px currentColor, 0 0 16px currentColor; }
@keyframes rgbSparkTwinkle { from { opacity:.25; transform: scale(.6) rotate(0deg); } to { opacity:1; transform: scale(1.25) rotate(25deg); } }
/* giant BÙM! text for the giant-head explosion: much bigger than the normal one */
.boom-text-giant {
  position:absolute; z-index:31; font-weight:900; font-size: clamp(100px, 30vw, 160px); color:#ffcf3f;
  text-shadow: 4px 4px 0 #fff, 0 0 34px #ff9d00, 0 8px 18px rgba(0,0,0,.4);
  pointer-events:none; white-space:nowrap; transform: translate(-50%,-50%);
}

/* Candy Crush style combo praise text: big bouncy word in the board centre */
.praise-text {
  position:absolute; left:50%; top:42%; z-index:32; pointer-events:none;
  font-weight:900; font-size: clamp(44px, 13vw, 76px); white-space:nowrap;
  color:#ffcf3f; -webkit-text-stroke: 2px #fff;
  text-shadow: 2px 2px 0 #fff, 0 0 12px #ff9d00, 0 4px 8px rgba(0,0,0,.4);
  transform: translate(-50%,-50%) scale(0); letter-spacing: 1px;
}
.praise-text.show { animation: praisePop 1.1s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes praisePop {
  0% { transform: translate(-50%,-50%) scale(.2) rotate(-10deg); opacity:0; }
  30% { transform: translate(-50%,-50%) scale(1.25) rotate(4deg); opacity:1; }
  55% { transform: translate(-50%,-50%) scale(1) rotate(-2deg); opacity:1; }
  75% { transform: translate(-50%,-50%) scale(1.08) rotate(1deg); opacity:1; }
  100% { transform: translate(-50%,-58%) scale(1) rotate(0deg); opacity:0; }
}
/* Expanding shockwave ring from a match (Candy Crush pop ring) */
.fx-ring {
  position:absolute; z-index:26; pointer-events:none; border-radius:50%;
  border: 3px solid rgba(255,255,255,.95); box-shadow: 0 0 8px rgba(255,255,255,.6);
  transform: translate(-50%,-50%);
}
/* tiles caught in a beam or a lightning zap flash bright white before they pop */
.tile.beam-flash .inner { animation: tileFlash .3s ease-out both; }
@keyframes tileFlash { 0% { filter: brightness(1); } 30% { filter: brightness(2.6) saturate(.3); } 100% { filter: brightness(2.2) saturate(.4); } }
/* bold gold per-tile score numbers, like the "60" in Candy Crush */
.fx-tile-score { position:absolute; z-index:27; font-weight:900; font-size: clamp(15px, 4.5vw, 24px); color:#ffb400; text-shadow: 0 0 4px #fff, 0 0 10px #ffd23f, 1px 2px 0 rgba(120,60,0,.55); pointer-events:none; transform: translate(-50%,-50%); animation: tileScorePop .7s ease-out forwards; }
@keyframes tileScorePop { 0% { opacity:0; transform: translate(-50%,-50%) scale(.5); } 25% { opacity:1; transform: translate(-50%,-60%) scale(1.2); } 100% { opacity:0; transform: translate(-50%,-160%) scale(1); } }
#toast {
  position:absolute; left:50%; top:38%; transform: translateX(-50%);
  background: rgba(60,30,60,.88); color:#fff; font-size:18px; font-weight:bold;
  padding: 10px 18px; border-radius: 999px; z-index:30; pointer-events:none;
  opacity:0; transition: opacity .25s ease; white-space:nowrap;
}
#toast.show { opacity:1; }

/* ---------- Bomb shark popup (bottom-left, shows when the wolf bomb explodes) ---------- */
#bombShark { position:fixed; left:50%; top:50%; transform: translate(-50%,-50%); z-index:46; width: min(170px, 38vw); pointer-events:none; }
#bombShark.hidden { display:none !important; }
#bombShark img { width:100%; height:auto; display:block; filter: drop-shadow(0 8px 16px rgba(0,0,0,.3)); transform-origin: 50% 90%; animation: bombSharkPop 2.2s ease-in-out both; }
@keyframes bombSharkPop { 0% { transform: translate(-30px, 10px) scale(.3) rotate(-16deg); opacity:0; } 15% { transform: translate(0, 0) scale(1.1) rotate(-3deg); opacity:1; } 25% { transform: translate(0, -8px) scale(1) rotate(-9deg); } 35% { transform: translate(0, 0) scale(1.04) rotate(-4deg); } 45% { transform: translate(0, -8px) scale(1) rotate(-8deg); } 55% { transform: translate(0, 0) scale(1) rotate(-6deg); } 80% { opacity:1; transform: translate(0, 0) scale(1) rotate(-6deg); } 100% { opacity:0; transform: translate(0, 0) scale(.9) rotate(-6deg); } }

/* v19 phones fill the screen: no dead space above/below the game (An
   2026-11-12). The board stretches to fill the height left by the HUD;
   tiles get taller and images use contain so animals are never cropped.
   v27 (An 2026-11-13): stretch REVERTED — the tall board spilled past
   the bottom (100dvh > visible area with Safari toolbar up). Board is
   square again, game centered, sized to svh so it always fits.
   v28 (An 2026-11-13): square board left TOO much empty space (~230px
   top/bottom). Stretch is BACK, but the game screen now has exactly
   1cm padding top + bottom, so the board fills the screen with only
   1cm margins and can never spill past the edge. Sizing stays svh.
   v29 (An 2026-11-13): developer credit at the very bottom of the
   game screen — floats in the 1cm bottom margin strip, board keeps
   its exact 1cm margins, no layout change. */
@media (max-width: 599px) {
  #gameScreen { justify-content:safe center; padding-top:1cm; padding-bottom:1cm; } /* v28: 1cm margins top + bottom */
  #boardWrap { flex:1 1 0; min-height:0; }
  #board { aspect-ratio:auto; height:100%; }
  .tile img { object-fit:contain; }
}

/* v29: dev credit — floats in the bottom margin strip (v28 1cm), so
   the board is untouched. 10px semibold white + shadow reads over
   the green background; pointer-events:none never blocks a tile tap. */
#devCredit { position:absolute; left:0; right:0; bottom:0.32cm; text-align:center; font-size:10px; font-weight:600; letter-spacing:.2px; color:rgba(255,255,255,.92); text-shadow:0 1px 3px rgba(0,0,0,.35); pointer-events:none; z-index:5; }
/* v31.35: bé cá mập vẫy tay — sprite sheet trong suốt (An duyệt 'Duyệt cái này đi bom iu' 2026-11-13) */
/* v30: story chapters — full-screen card before levels 1/3/5/8.
   z-index 60 sits above the transition overlay (55); the level timer
   only starts after the player taps Play, so reading costs no time. */
#storyScreen { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(20,10,40,.72); padding:16px; }
#storyScreen.hidden { display:none !important; }
.story-card { background:#fff; border-radius:20px; max-width:460px; width:100%; max-height:82vh; overflow:auto; padding:20px 18px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.35); }
.story-card img.story-img { width:96px; height:96px; object-fit:contain; }
.story-card h2 { font-size:20px; margin:6px 0 8px; color:#5b21b6; }
.story-card p { font-size:16px; line-height:1.55; color:#444; text-align:left; margin:0 0 14px; }
.story-card .green { font-size:18px; padding:12px 26px; }
.story-item { display:flex; gap:10px; text-align:left; margin:12px 0; align-items:flex-start; }
.story-item img { width:48px; height:48px; flex:0 0 auto; object-fit:contain; }
.story-item b { font-size:15px; color:#5b21b6; }
.story-item p { font-size:14px; margin:2px 0 0; }
/* v30.2: small replay-from-Level-1 button under the start-screen buttons. */
.reset-btn { background:none; border:none; color:#8a7a9e; font:inherit; font-size:.85rem; text-decoration:underline; cursor:pointer; margin-top:10px; opacity:.85; }
/* v30.3: in-page reset confirm card (native window.confirm is swallowed
   by automated browsers so it could never be verified — and the
   in-game card looks better). z-index 70 sits above the story card. */
#resetConfirm { position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; background:rgba(20,10,40,.72); padding:16px; }
#resetConfirm.hidden { display:none !important; }
#resetConfirmText { white-space:pre-line; }
.btn-row { display:flex; gap:10px; justify-content:center; margin-top:6px; }
.btn-row button { font-size:17px; padding:11px 22px; }


/* v21 tall phones get a bigger HUD to match the taller board (per-size
   tuning: big/tall phones scale up, small/short phones stay compact).
   v27: tall-phone HUD tightened back down — it was the tallest of all. */
@media (max-width: 599px) and (min-height: 800px) {
  #gameScreen { gap:10px; }
  #hud { padding:6px 8px 7px; gap:3px; border-radius:20px; }
  .hud-stat { font-size:12px; } .hud-stat b { font-size:17px; }

  (function () {

/* Giant head zoom: for a 4+ match (or L/T), that animal's head swells up and zooms
   straight out at the player, then explodes in a huge bang with confetti everywhere.

   matched tiles still happens underneath, right after. */
async function giantHeadBoom(type, cells) {
  var layer = fxLayer(); if (!layer || !cells || !cells.length) return;
  var src = IMG[type] || IMG.fox;
  var sr = 0, sc = 0;
  cells.forEach(function(cell) { sr += cell[0]; sc += cell[1]; });
  /* The giant head + BÙM! text sit at the board centre (50, 50), never at the
     match spot: a 4+ match at the board edge used to get half its face and
     half its BÙM! clipped by the frame. The confetti still bursts from the
     match itself (mcx, mcy). */
  var cx = 50, cy = 50;
  var mcx = (sc / cells.length + 0.5) * 12.5, mcy = (sr / cells.length + 0.5) * 12.5;
  /* RGB rainbow light stream behind the head: rotating rainbow rays + soft rainbow glow
     + twinkling rainbow sparkles. Created first so it sits behind the head (z-index 29
     vs head 30). Scales in together with the head during the zoom. */
  var rgb = document.createElement("div");
  rgb.className = "fx-giant-rgb";
  rgb.style.left = cx + "%"; rgb.style.top = cy + "%";
  var rgbGlow = document.createElement("div");
  rgbGlow.className = "rgb-glow";
  rgb.appendChild(rgbGlow);
  var rgbRays = document.createElement("div");
  rgbRays.className = "rgb-rays";
  rgb.appendChild(rgbRays);
  var RGB_SPARK_COLORS = ["#ff2d55", "#ff9500", "#ffe600", "#2ed573", "#00d2ff", "#7b5cff", "#ff2d78"];
  for (var s = 0; s < 12; s++) {
    var sp = document.createElement("span");
    sp.className = "rgb-spark";
    sp.textContent = Math.random() < 0.5 ? "✦" : "★";
    sp.style.color = RGB_SPARK_COLORS[s % RGB_SPARK_COLORS.length];
    sp.style.left = (8 + Math.random() * 84) + "%";
    sp.style.top = (8 + Math.random() * 84) + "%";
    sp.style.animationDelay = (Math.random() * 0.5) + "s";
    sp.style.fontSize = (12 + Math.random() * 10) + "px";
    rgb.appendChild(sp);
  }
  layer.appendChild(rgb);
  rgb.animate([
    { transform: "translate(-50%,-50%) scale(0.15)", opacity: 0 },
    { transform: "translate(-50%,-50%) scale(1.15)", opacity: 1, offset: 0.6 },
    { transform: "translate(-50%,-50%) scale(1)", opacity: 1 }
  ], { duration: 320, easing: "ease-out" });
  var img = document.createElement("img");
  img.className = "fx-giant-head";
  img.src = src;
  img.alt = "";
  img.style.left = cx + "%"; img.style.top = cy + "%";
  layer.appendChild(img);
  var zoom = img.animate([
    { transform: "translate(-50%,-50%) scale(0.9) rotate(0deg)", opacity: 1 },
    { transform: "translate(-50%,-50%) scale(4.6) rotate(-7deg)", opacity: 1, offset: 0.55 },
    { transform: "translate(-50%,-50%) scale(4.0) rotate(6deg)", opacity: 1, offset: 0.8 },
    { transform: "translate(-50%,-50%) scale(4.3) rotate(0deg)", opacity: 1 }
  ], { duration: 320, easing: "ease-out" });
  try { await zoom.finished; } catch (e) { await sleep(320); }
  if (img.parentNode) img.parentNode.removeChild(img);
  /* RGB light flares brighter at the explosion, then fades out with the head */
  var rgbOut = rgb.animate([
    { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
    { transform: "translate(-50%,-50%) scale(1.7)", opacity: 0 }
  ], { duration: 300, easing: "ease-out" });
  rgbOut.onfinish = function() { if (rgb.parentNode) rgb.parentNode.removeChild(rgb); };
  setTimeout(function() { if (rgb.parentNode) rgb.parentNode.removeChild(rgb); }, 450);
  /* huge confetti storm in the animal's own colors + gold, flying everywhere */
  var col = { fill: ANIMAL_COLORS[type] || "#ffd23f", edge: ANIMAL_EDGE[type] || "#d35400" };

    var roll = Math.random();

    else spawnStar(layer, mcx, mcy);
  }
  giantBoomText(cx, cy);
  flashScreen(); flashThunder();
  AudioEng.sfx("thunder");
  AudioEng.sfx("boom");
  await sleep(300);
}

var dragStart = null;
function tileFromEvent(e) {
  var rect = boardEl.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  var c = Math.floor(x / rect.width * COLS);
  var r = Math.floor(y / rect.height * ROWS);
  if (!inBoard(r, c)) return null;
  return [r, c];
}
function onTilePointerDown(e, tl) {
  if (state.busy || state.over) return;
  e.preventDefault();
  var pos = null;
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    if (state.board[r][c] === tl) pos = [r, c];
  }
  if (!pos) return;
  AudioEng.sfx("water");
  spawnRipple(pos[0], pos[1]);
  resetHintTimer();
  if (tl.type === "bomb") { startBombDrag(e, pos); return; } /* bomb: drag to detonate, never swap */
  dragStart = { pos: pos, x: e.clientX, y: e.clientY, moved: false };
  if (state.selected && state.selected[0] === pos[0] && state.selected[1] === pos[1]) {
    state.selected = null; renderSelection(); dragStart = null; return;
  }
  if (state.selected) {
    var s = state.selected;
    if (Math.abs(s[0] - pos[0]) + Math.abs(s[1] - pos[1]) === 1) {
      state.selected = null; renderSelection();
      trySwap(s[0], s[1], pos[0], pos[1]);
      dragStart = null; return;
    }
  }
  state.selected = pos; renderSelection();
}
boardEl.addEventListener("pointermove", function(e) {
  if (!dragStart || dragStart.moved) return;
  var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  dragStart.moved = true;
  var r = dragStart.pos[0], c = dragStart.pos[1];
  var r2 = r, c2 = c;
  if (Math.abs(dx) > Math.abs(dy)) c2 = c + (dx > 0 ? 1 : -1);
  else r2 = r + (dy > 0 ? 1 : -1);
  if (!inBoard(r2, c2)) { dragStart = null; return; }
  state.selected = null; renderSelection();
  trySwap(r, c, r2, c2);
  dragStart = null;
});
boardEl.addEventListener("pointerup", function() { dragStart = null; });
boardEl.addEventListener("pointercancel", function() { dragStart = null; });

function speakLetsGo() {
  try {
    if (!AudioEng.isMusicOn()) return; /* muted: no voice */
    if (!("speechSynthesis" in window) || !window.speechSynthesis) return;
    if (typeof SpeechSynthesisUtterance === "undefined") return;
    var u = new SpeechSynthesisUtterance("Let's go!");

/* v30.1: resume the 7-minute timer after reading the story mid-level.
   Unlike startTimer() (new level: resets to 7:00), this keeps the
   remaining time — reading the story must not cost play time. */
function resumeTimer() {
  stopTimer();
  updateTimerDisplay();
  timerId = setInterval(function() {
    if (state.over) return;
    if (document.getElementById("gameScreen").classList.contains("hidden")) return;
    if (state.timeLeft > 0) { state.timeLeft--; updateTimerDisplay(); }
    if (state.timeLeft <= 0 && !state.busy) endLevel(false);
  }, 1000);
}

function maybeShowStory(level, proceed) {

     Chapter 1 — no matter which level the player is on, so the story
     is never skipped by old save progress. After that, chapters show
     at their own levels; missed ones stay readable via the 📖 button. */
  if (!storySeenAny()) { showStoryCard(1, proceed); return; }
  if (!STORY[level] || storySeen(level)) { proceed(); return; }
  showStoryCard(level, proceed);
}

function startLevel(level) {
  stopBoings();
  AudioEng.fadeApplause(0.3); /* safety net: no applause bleeding into the new level */
  state.level = level;
  var cfg = levelConfig(level);
  state.target = cfg.target;
  var perks = levelPerks(level);
  state.moves = cfg.moves + perks.movesBonus; /* L3+: +10 moves */
  state.scoreMult = perks.scoreMult; /* L8+: 2x points */
  state.score = 0;
  state.over = false;
  state.busy = false;
  state.selected = null;
  state.board = createBoard();
  if (perks.freeBomb) { /* L5+: 1 free wolf bomb at level start */
    var br = Math.floor(Math.random() * ROWS), bc = Math.floor(Math.random() * COLS);
    state.board[br][bc] = makeTile("bomb");
  }
  boardEl.innerHTML = "";
  elsById = {};
  renderBoard(true);
  updateHUD();
  updatePerkLine();
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  stopBoings();
  document.getElementById("transitionScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  renderStartLb();
  lastBombTime = Date.now();
  resetHintTimer();
  AudioEng.unlock();
  AudioEng.startMusic();
  state.timeLeft = 420; /* show 7:00 while the ice pours in; the timer starts after the pour */
  updateTimerDisplay();
  playIceDrop();
}
/* Win drop: when a level is cleared, EVERY tile falls all the way down
   and out of the board (to row ROWS+2, fully below the frame, clipped away
   by overflow:hidden), so the board ends up empty. Delay grows upward
   (bottom row first, top last) plus a tiny random jitter, so it drains
   like a wave. Ease-in (accelerating, like real gravity). One Minecraft
   glass break shatter as everything falls. The next level rebuilds the
   board, so nothing persists. */
function dropTilesAtWin() {
  AudioEng.sfx("glass"); /* one shatter as the tiles fall out */
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var el = tileEl(r, c);
      if (!el) continue;
      var dist = (ROWS + 2) - r; /* fall all the way out below the board */
      var dur = 0.4 + dist * 0.05;
      var delay = (ROWS - 1 - r) * 0.06 + Math.random() * 0.05;
      el.style.transition = "transform " + dur + "s cubic-bezier(.45,.05,.75,.4) " + delay + "s";
      positionEl(el, ROWS + 2, c);
    }
  }
}
function endLevel(won) {
  state.over = true;
  stopTimer();
  stopHintTimer();
  var isBest = state.score > state.best;
  if (isBest) {
    state.best = state.score;
    __previewStore.setItem("animalCrushBest", String(state.best));
  }
  if (won) {
    dropTilesAtWin(); /* tiles fall all the way out + glass shatter */
    celebrateWin();
    AudioEng.sfx("applause"); /* clapping when a level is cleared */
    if (state.level >= state.maxLevel) {
      state.maxLevel = state.level + 1;
      __previewStore.setItem("animalCrushMaxLevel", String(state.maxLevel));
    }
    __previewStore.setItem("animalCrushLevel", String(state.level + 1));
    showToast(t("nice"));
  } else {
    AudioEng.sfx("lose");
  }
  updateHUD();
  if (won) {
    /* win: celebrate, then the bouncing train carries us to the next level, which opens by itself */
    setTimeout(function() { showTransition(state.level); }, 2700);
  } else {
    setTimeout(function() { showEnd(won, isBest); }, 700);
  }
}
function showEnd(won, isBest) {
  var end = document.getElementById("endScreen");
  document.getElementById("endTitle").textContent = won ? t("win") : t("lose");
  document.getElementById("endMsg").textContent = won ? t("winMsg") : t("loseMsg");
  document.getElementById("endScore").textContent = state.score;
  document.getElementById("endBest").textContent = t("best") + ": " + state.best + (isBest ? " - " + t("newBest") : "");
  document.getElementById("nextBtn").classList.toggle("hidden", !won);
  document.getElementById("retryBtn").classList.toggle("hidden", won);
  document.getElementById("saveMsg").textContent = "";
  document.getElementById("saveScoreBtn").disabled = false;
  var nameRow = document.getElementById("nameRow");
  /* show name entry only if the score can make the top 10 */
  getBoard().then(function(list) {
    var qualifies = list.length < 10 || state.score > list[list.length - 1].score;
    nameRow.classList.toggle("hidden", !qualifies);
    if (qualifies) document.getElementById("nameInput").focus();
  });
  renderEndLb();
  end.classList.remove("hidden");
}

/* ================= Leaderboard ================= */
var FB_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/animal-crush.json";
var LS_BOARD = "animalCrushBoardV1";
var cachedBoard = null;
function normalizeBoard(data) {
  if (!data) return [];
  var arr = Array.isArray(data) ? data : Object.keys(data).sort(function(a,b){ return a-b; }).map(function(k){ return data[k]; });
  return arr.filter(function(x){ return x && typeof x.score === "number"; })
    .sort(function(a,b){ return b.score - a.score; }).slice(0, 10);
}
function getBoard() {
  if (cachedBoard) return Promise.resolve(cachedBoard.slice());
  return fetch(FB_URL).then(function(r){ return r.json(); }).then(function(data) {
    cachedBoard = normalizeBoard(data);
    return cachedBoard.slice();
  }).catch(function() {
    try { cachedBoard = normalizeBoard(JSON.parse(__previewStore.getItem(LS_BOARD) || "[]")); }
    catch (e) { cachedBoard = []; }
    return cachedBoard.slice();
  });
}
function saveToBoard(entry) {
  var list = (cachedBoard || []).slice();
  list.push(entry);
  list.sort(function(a,b){ return b.score - a.score; });
  list = list.slice(0, 10);
  cachedBoard = list;
  try { __previewStore.setItem(LS_BOARD, JSON.stringify(list)); } catch (e) {}
  return fetch(FB_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(list) })
    .catch(function() { /* offline: local copy already saved */ });
}
function lbHtml(list) {
  var html = "<h2 style=\"font-size:20px; margin-bottom:6px;\">🏆 " + t("leaderboard") + " - " + t("top10") + "</h2>";
  if (!list.length) return html + "<p>" + t("noScores") + "</p>";
  list.forEach(function(e, i) {
    var crown = i === 0 ? "<span class=\"lb-crown\">👑</span> " : "";
    var title = i === 0 ? "<div class=\"lb-title\">" + t("champion") + "</div>" : "";
    html += "<div class=\"lb-row\"><span class=\"rank\">" + (i + 1) + ".</span><span>" + crown + escapeHtml(e.name) + "</span><span><b>" + e.score + "</b></span></div>" + title;
  });
  return html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* v13: the leaderboard lives on the start screen now (An's call) — the game
   screen is just HUD + board. This renders the start leaderboard. */
function renderStartLb() {
  getBoard().then(function(list) {
    document.getElementById("startLb").innerHTML = lbHtml(list);
  });
}
function renderEndLb() {
  getBoard().then(function(list) {
    document.getElementById("endLb").innerHTML = lbHtml(list);
  });
}

/* ================= Visit counter ================= */
var VISITS_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/visits/animal-crush.json";
function updateVisits() {
  var el = document.getElementById("visitCount");
  var today = new Date().toISOString().slice(0, 10);
  var lastDay = __previewStore.getItem("animalCrushVisitDay");
  var show = function(n) { el.textContent = "🐠 " + t("visits").replace("{n}", n); };
  var known = parseInt(__previewStore.getItem("animalCrushVisits") || "0", 10);
  if (known) show(known);
  if (lastDay === today) {
    /* already counted today: just read the latest number */
    fetch(VISITS_URL).then(function(r){ return r.json(); }).then(function(v) {
      var n = parseInt(v, 10); if (!isNaN(n) && n > 0) { __previewStore.setItem("animalCrushVisits", String(n)); show(n); }
    }).catch(function(){});
    return;
  }
  fetch(VISITS_URL).then(function(r){ return r.json(); }).then(function(v) {
    var n = parseInt(v, 10); if (isNaN(n)) n = 0;
    var next = n + 1;
    return fetch(VISITS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next) }).then(function() {
      __previewStore.setItem("animalCrushVisitDay", today);
      __previewStore.setItem("animalCrushVisits", String(next));
      show(next);
    });
  }).catch(function(){});
}

/* How-to rules with a colored number badge each (title in rainbow) */
function renderHowto() {
  var raw = t("howto");
  var parts = raw.split("<br>");
  var title = parts.shift().replace(/<\/?b>/g, "");
  var colors = ["#ff5c8a", "#ff9500", "#e6b800", "#2ed573", "#00b4ff", "#7b5cff", "#ff2d78"];
  var wasOpen = document.getElementById("howto").classList.contains("open");
  var out = '<div class="howto-head" onclick="toggleHowto()"><div class="howto-title">' + title + '</div><span class="howto-toggle" id="howtoToggle">' + t(wasOpen ? "howtoHide" : "howtoShow") + "</span></div>";
  out += '<div class="howto-rules">';
  parts.forEach(function(line, i) {
    var m = line.match(/^\s*(\d+)\.\s*([\s\S]*)$/);
    if (!m) { out += '<div class="rule"><span>' + line + "</span></div>"; return; }
    out += '<div class="rule"><span class="num" style="background:' + colors[i % colors.length] + ';">' + m[1] + "</span><span>" + m[2] + "</span></div>";
  });
  out += "</div>";
  document.getElementById("howto").innerHTML = out;
  if (wasOpen) document.getElementById("howto").classList.add("open");
}
function toggleHowto() {
  var card = document.getElementById("howto");
  var open = card.classList.toggle("open");
  var tog = document.getElementById("howtoToggle");
  if (tog) tog.textContent = t(open ? "howtoHide" : "howtoShow");
}

/* The speaker button should START the music when tapped on the start screen,
   not mute it: on a fresh page the first tap anywhere starts the music via the
   document pointerdown listener, so a plain toggle here would instantly mute
   the song An just started. Record whether music was already playing before
   this tap (the button's pointerdown fires before the document one). */
var musicWasStartedBeforeTap = false;
function recordMusicStateBeforeTap() { musicWasStartedBeforeTap = musicStarted; }
function speakerClick() {
  AudioEng.unlock();
  if (!musicWasStartedBeforeTap) {
    /* This tap just started the music: keep it ON. */
    if (!AudioEng.isMusicOn()) AudioEng.toggleMusic();
  } else {
    AudioEng.toggleMusic();
  }
  syncMusicBtns();
}
document.getElementById("musicBtn").addEventListener("pointerdown", recordMusicStateBeforeTap);

document.getElementById("musicBtnStart").addEventListener("pointerdown", recordMusicStateBeforeTap);
