* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #ff2d78, #ff9500, #ffe600, #2ed573, #00d2ff, #7c4dff);
  background-size: 400% 400%;
  animation: bgShift 8s ease infinite;
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#3a2b1f; padding:20px 14px; gap:16px;
}
@keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.card {
  background: rgba(255,255,255,.94); border-radius:24px; padding:22px 18px;
  width:100%; max-width:880px; text-align:center;
  display:flex; flex-direction:column; gap:12px; align-items:center;
  box-shadow: 0 12px 40px rgba(0,0,0,.3);
}
h1 { font-size: clamp(22px, 6vw, 32px); color:#7c4dff; }
p.en { font-size: clamp(16px, 4.5vw, 20px); color:#5a4632; }
.track {
  width:100%; height:calc(var(--hs) * 2.15 + 48px); position:relative; overflow:hidden; border-radius:16px;
  background: linear-gradient(180deg, #bfe9ff, #e8f9ff 60%, #cdeed9);
}
.ground {
  position:absolute; left:0; right:0; bottom:0; height:26px;
  background: linear-gradient(180deg, #9ed69e, #7cc47c);
  border-top: 3px solid #ffffff;
}
/* ---------- The 6 animal heads as a bouncing train.
   The row travels left to right like a train (8s loop) while each head
   hops high like a ball (1.2s per head, neighbours offset 0.2s so the
   wave rolls across the train). Each hop squashes on landing, stretches
   on takeoff, and leaves a glowing light trail in its own color under it.
   A soft shadow shrinks and fades as its head rises. ---------- */
:root { --hs: clamp(58px, 16vw, 138px); }
.row {
  position:absolute; left:0; right:0; bottom:26px; z-index:2;
  display:flex; justify-content:space-evenly; align-items:flex-end;
  padding: 0 6px;
  animation: trainMove 8s linear infinite;
}
@keyframes trainMove {
  from { transform: translateX(100%); }
  to { transform: translateX(-100%); }
}
.spot { position:relative; width:var(--hs); height:calc(var(--hs) * 2.15); flex:0 1 auto; }
.shadow {
  position:absolute; left:12%; bottom:0; width:76%; height:10px;
  background:rgba(46,90,40,.28); border-radius:50%;
  animation: shadowPulse 1.2s linear infinite; animation-delay: var(--d);
}
.trail {
  position:absolute; left:30%; bottom:0; width:40%; height:calc(var(--hs) * 1.05);
  border-radius:999px 999px 0 0;
  background: linear-gradient(180deg, var(--c2) 0%, var(--c) 45%, transparent 100%);
  box-shadow: 0 0 18px 4px var(--c);
  filter: blur(2px);
  opacity: 0; transform: scaleY(0.04); transform-origin: 50% 100%;
  animation: trailGlow 1.2s linear infinite; animation-delay: var(--d);
}
.head {
  position:absolute; left:0; bottom:0; width:100%; height:var(--hs);
  font-size:var(--hs);
  transform-origin:50% 100%;
  animation: hop 1.2s linear infinite; animation-delay: var(--d);
}
.head img { width:100%; height:100%; display:block; }
