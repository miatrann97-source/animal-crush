<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem truoc: Be ca di bo qua man moi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #ff2d78, #ff9500, #ffe600, #2ed573, #00d2ff, #7c4dff);
  background-size: 400% 400%;
  animation: bgShift 8s ease infinite;
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#3a2b1f; padding:20px 14px; gap:16px;
}
@keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.card {
  background: rgba(255,255,255,.94); border-radius:24px; padding:22px 18px;
  width:100%; max-width:760px; text-align:center;
  display:flex; flex-direction:column; gap:12px; align-items:center;
  box-shadow: 0 12px 40px rgba(0,0,0,.3);
}
h1 { font-size: clamp(22px, 6vw, 32px); color:#7c4dff; }
p.en { font-size: clamp(16px, 4.5vw, 20px); color:#5a4632; }
.track {
  width:100%; height:300px; position:relative; overflow:hidden; border-radius:16px;
  background: linear-gradient(180deg, #bfe9ff, #e8f9ff 60%, #cdeed9);
}
.ground {
  position:absolute; left:0; right:0; bottom:0; height:26px;
  background: linear-gradient(180deg, #9ed69e, #7cc47c);
  border-top: 3px solid #ffffff;
}
/* ---------- The walker: same parts and walk-cycle code as the game ---------- */
.walker { position:absolute; left:0; bottom:26px; height:260px; width:148px; animation: crossLoop 5.2s linear infinite; }
.walker .part { position:absolute; inset:0; }
.walker .part img, .walker .swing img { width:100%; height:100%; display:block; }
.part.body { z-index:1; animation: bodyBob .9s ease-in-out infinite; }
.part.leg { z-index:2; }
.part.leg-l { transform-origin: 37.9% 79.8%; animation: legL .9s ease-in-out infinite; }
.part.leg-r { transform-origin: 64.5% 79.8%; animation: legR .9s ease-in-out infinite; }
.part.arm { z-index:3; animation: bodyBob .9s ease-in-out infinite; }
.part.arm .swing { position:absolute; inset:0; }
.swing.arm-l { transform-origin: 23% 50.5%; animation: armL .9s ease-in-out infinite; }
.swing.arm-r { transform-origin: 77% 50.5%; animation: armR .9s ease-in-out infinite; }
@keyframes legL {
  0%, 100% { transform: rotate(16deg) translateY(0); }
  25% { transform: rotate(0deg) translateY(-8px); }
  50% { transform: rotate(-16deg) translateY(0); }
  75% { transform: rotate(0deg) translateY(0); }
}
@keyframes legR {
  0%, 100% { transform: rotate(-16deg) translateY(0); }
  25% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(16deg) translateY(0); }
  75% { transform: rotate(0deg) translateY(-8px); }
}
@keyframes armL {
  0%, 100% { transform: rotate(-12deg); }
  50% { transform: rotate(12deg); }
}
@keyframes armR {
  0%, 100% { transform: rotate(12deg); }
  50% { transform: rotate(-12deg); }
}
@keyframes bodyBob {
  0%, 50%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-7px) rotate(-1.5deg); }
  75% { transform: translateY(-7px) rotate(1.5deg); }
}
@keyframes crossLoop {
  0% { transform: translateX(-110%); opacity: 0; }
  6% { opacity: 1; }
  72% { transform: translateX(500%); opacity: 1; }
  80% { transform: translateX(540%); opacity: 0; }
  100% { transform: translateX(-110%); opacity: 0; }
}
</style>
</head>
