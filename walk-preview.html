<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem truoc: Be ca di bo qua man moi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #ff2d78, #ff9500, #ffe600, #2ed573, #00d2ff, #7c4dff);
  background-size: 400% 400%;
  animation: bgShift 8s ease infinite;
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#3a2b1f; padding:20px 14px; gap:16px;
}
@keyframes bgShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.card {
  background: rgba(255,255,255,.94); border-radius:24px; padding:22px 18px;
  width:100%; max-width:760px; text-align:center;
  display:flex; flex-direction:column; gap:12px; align-items:center;
  box-shadow: 0 12px 40px rgba(0,0,0,.3);
}
h1 { font-size: clamp(22px, 6vw, 32px); color:#7c4dff; }
p.en { font-size: clamp(16px, 4.5vw, 20px); color:#5a4632; }
.track {
  width:100%; height:300px; position:relative; overflow:hidden; border-radius:16px;
  background: linear-gradient(180deg, #bfe9ff, #e8f9ff 60%, #cdeed9);
}
.ground {
  position:absolute; left:0; right:0; bottom:0; height:26px;
  background: linear-gradient(180deg, #9ed69e, #7cc47c);
  border-top: 3px solid #ffffff;
}
/* ---------- The walker: 9 clean parts cut from the side-view shark girl, facing right. Each leg is thigh, calf and foot, so the knee bends like a real walk ---------- */
.walker { position:absolute; left:0; bottom:26px; height:clamp(170px, 42vw, 260px); aspect-ratio: 1446 / 1136; animation: crossLoop 7s linear infinite; }
.walker .sway { position:absolute; inset:0; animation: sway 1.2s ease-in-out infinite; }
.walker .part { position:absolute; inset:0; }
.walker .part img, .walker .swing img { width:100%; height:100%; display:block; }
.part.body { z-index:2; animation: bodyBob 1.2s ease-in-out infinite; }
.part.leg { z-index:1; }
.part.leg-l { transform-origin: 32.5% 78.3%; animation: thighL 1.2s linear infinite; }
.part.leg-r { transform-origin: 41.5% 82.3%; animation: thighR 1.2s linear infinite; }
.part.leg .swing { position:absolute; inset:0; }
.swing.calf-l { transform-origin: 27.7% 84.1%; animation: calfL 1.2s linear infinite; z-index:1; }
.swing.calf-r { transform-origin: 38.7% 83.6%; animation: calfR 1.2s linear infinite; z-index:1; }
.swing.foot-l { transform-origin: 20.7% 91.5%; animation: footL 1.2s linear infinite; z-index:1; }
.swing.foot-r { transform-origin: 41.5% 91.5%; animation: footR 1.2s linear infinite; z-index:1; }
img.thighimg { position:relative; z-index:2; }
img.calfimg { position:relative; z-index:2; }
.part.arm-l { z-index:1; animation: bodyBob 1.2s ease-in-out infinite; }
.part.arm-r { z-index:3; animation: bodyBob 1.2s ease-in-out infinite; }
.part.arm-l .swing { position:absolute; inset:0; }
.part.arm-r .swing { position:absolute; inset:0; }
.swing.arm-l { transform-origin: 27.0% 49.6%; animation: armL 1.2s linear infinite; }
.swing.arm-r { transform-origin: 38.1% 52.2%; animation: armR 1.2s linear infinite; }
@keyframes thighL {
  0%, 100% { transform: rotate(15deg) translateY(0); }
  12.5% { transform: rotate(11deg) translateY(0); }
  25% { transform: rotate(0deg) translateY(0); }
  37.5% { transform: rotate(-11deg) translateY(-2px); }
  50% { transform: rotate(-15deg) translateY(-4px); }
  62.5% { transform: rotate(-11deg) translateY(-7px); }
  75% { transform: rotate(0deg) translateY(-6px); }
  87.5% { transform: rotate(11deg) translateY(-3px); }
}
@keyframes thighR {
  0%, 100% { transform: rotate(-15deg) translateY(-4px); }
  12.5% { transform: rotate(-11deg) translateY(-7px); }
  25% { transform: rotate(0deg) translateY(-6px); }
  37.5% { transform: rotate(11deg) translateY(-3px); }
  50% { transform: rotate(15deg) translateY(0); }
  62.5% { transform: rotate(11deg) translateY(0); }
  75% { transform: rotate(0deg) translateY(0); }
  87.5% { transform: rotate(-11deg) translateY(-2px); }
}
@keyframes calfL {
  0%, 100% { transform: rotate(7deg); }
  12.5% { transform: rotate(2deg); }
  25% { transform: rotate(1deg); }
  37.5% { transform: rotate(-13deg); }
  50% { transform: rotate(-35deg); }
  62.5% { transform: rotate(-48deg); }
  75% { transform: rotate(-38deg); }
  87.5% { transform: rotate(-18deg); }
}
@keyframes calfR {
  0%, 100% { transform: rotate(-43deg); }
  12.5% { transform: rotate(-56deg); }
  25% { transform: rotate(-46deg); }
  37.5% { transform: rotate(-26deg); }
  50% { transform: rotate(-1deg); }
  62.5% { transform: rotate(-6deg); }
  75% { transform: rotate(-7deg); }
  87.5% { transform: rotate(-21deg); }
}
@keyframes footL {
  0%, 100% { transform: rotate(-17deg); }
  12.5% { transform: rotate(-10deg); }
  25% { transform: rotate(-10deg); }
  37.5% { transform: rotate(-4deg); }
  50% { transform: rotate(4deg); }
  62.5% { transform: rotate(-8deg); }
  75% { transform: rotate(-16deg); }
  87.5% { transform: rotate(-14deg); }
}
@keyframes footR {
  0%, 100% { transform: rotate(18deg); }
  12.5% { transform: rotate(6deg); }
  25% { transform: rotate(-2deg); }
  37.5% { transform: rotate(-4deg); }
  50% { transform: rotate(-9deg); }
  62.5% { transform: rotate(4deg); }
  75% { transform: rotate(5deg); }
  87.5% { transform: rotate(10deg); }
}
@keyframes armL {
  0%, 100% { transform: rotate(-7deg); }
  12.5% { transform: rotate(-5deg); }
  25% { transform: rotate(0deg); }
  37.5% { transform: rotate(5deg); }
  50% { transform: rotate(7deg); }
  62.5% { transform: rotate(5deg); }
  75% { transform: rotate(0deg); }
  87.5% { transform: rotate(-5deg); }
}
@keyframes armR {
  0%, 100% { transform: rotate(7deg); }
  12.5% { transform: rotate(5deg); }
  25% { transform: rotate(0deg); }
  37.5% { transform: rotate(-5deg); }
  50% { transform: rotate(-7deg); }
  62.5% { transform: rotate(-5deg); }
  75% { transform: rotate(0deg); }
  87.5% { transform: rotate(5deg); }
}
@keyframes bodyBob {
  0%, 50%, 100% { transform: translateY(0); }
  25% { transform: translateY(-4px); }
  75% { transform: translateY(-4px); }
}
@keyframes sway {
  0%, 100% { transform: translateX(-2px) rotate(-0.8deg); }
  50% { transform: translateX(2px) rotate(0.8deg); }
}
@keyframes crossLoop {
  0% { transform: translateX(-120%); opacity: 0; }
  4% { opacity: 1; }
  80% { transform: translateX(260%); opacity: 1; }
  88% { transform: translateX(280%); opacity: 0; }
  100% { transform: translateX(-120%); opacity: 0; }
}
</style>
