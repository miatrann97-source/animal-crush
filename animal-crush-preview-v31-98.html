<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Crush</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* Prevent the whole page from shifting sideways: the giant-head explosion
   (head scales to 4.6x, giant BÙM! text, rainbow glow) can extend past the
   board edge when a 4+ match sits near the left/right side. Two layers of
   defence: (1) #boardWrap clips every effect to the board, so nothing can
   reach past the frame; (2) overflow-x:clip on html/body stops any horizontal
   scroll or shift at the page level. (clip is stronger than hidden: it
   removes the scrollable overflow entirely instead of just hiding the bar.) */
html { overflow-x: hidden; overflow-x: clip; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* v31.67: hidden truoc clip — Safari <16 khong hieu clip */ /* v27: stop iOS Safari inflating small HUD text */
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #ff2d78, #ff9500, #ffe600, #2ed573, #00d2ff, #7c4dff, #ff2d78, #ff6b9d);
  background-size: 400% 400%;
  animation: bgShift 8s ease infinite;
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center;
  color:#3a2b1f; overflow-x:hidden; overflow-x:clip; overscroll-behavior:none;
  user-select:none; -webkit-user-select:none;
}
@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
/* ---------- Lively background decor (behind everything, never blocks taps) ---------- */
#bgDecor { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.screen { position:relative; z-index:1; }
.bg-float {
  position:absolute; bottom:-12vh; display:block; pointer-events:none;
  will-change: transform, opacity;
  animation: floatUpBg var(--rise, 18s) linear infinite;
}
.bg-float.twinkle { animation: floatUpBg var(--rise, 18s) linear infinite, twinkle 1.6s ease-in-out infinite alternate; }
@keyframes floatUpBg {
  0% { transform: translateY(0) rotate(0deg); opacity:0; }
  8% { opacity:.9; }
  85% { opacity:.9; }
  100% { transform: translateY(-125vh) rotate(300deg); opacity:0; }
}
@keyframes twinkle { from { opacity:.35; } to { opacity:1; } }
h1 { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size: clamp(34px, 9vw, 50px); font-weight:800; line-height:1.1; letter-spacing:1px; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff, #ff2d78); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.8px #000; filter: drop-shadow(0 3px 0 rgba(255,255,255,.85)) drop-shadow(0 6px 10px rgba(0,0,0,.25)); animation: titleBounce 2.4s ease-in-out infinite; }
@keyframes titleBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.rainbow-arc { display:block; margin: 2px auto 0; }
h2 { font-size: clamp(20px, 5.5vw, 28px); color:#7c4dff; }
button {
  font-family: inherit; cursor:pointer; border:none; border-radius: 999px;
  padding: 12px 26px; font-size: 18px; font-weight: bold; color:#fff;
  background: linear-gradient(180deg, #ff8fb3, #ff5c8a);
  box-shadow: 0 4px 0 #d63d68, 0 6px 12px rgba(0,0,0,.18);
  transition: transform .08s ease, box-shadow .08s ease;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d63d68; }
button.small { padding: 8px 16px; font-size: 15px; }
button.green { background: linear-gradient(180deg, #7ee081, #43b581); box-shadow: 0 4px 0 #2e8b57, 0 6px 12px rgba(0,0,0,.18); }
button.rainbow { position:relative; overflow:hidden; font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:22px; padding: 14px 42px; background: linear-gradient(135deg, rgba(255,255,255,.85) 0%, rgba(170,215,255,.75) 30%, rgba(255,170,225,.75) 60%, rgba(200,180,255,.75) 85%, rgba(255,255,255,.85) 100%); border: 2px solid rgba(255,255,255,.95); text-shadow: 0 2px 4px rgba(80,120,180,.6); box-shadow: inset 0 0 22px rgba(255,255,255,.9), 0 8px 20px rgba(0,0,0,.18), 0 0 24px rgba(170,215,255,.6); animation: bubbleWobble 2.2s ease-in-out infinite; }
button.rainbow::before { content:''; position:absolute; left:12px; top:5px; width:46px; height:22px; border-radius:50%; background:rgba(255,255,255,.9); filter: blur(1px); transform: rotate(-12deg); pointer-events:none; }
button.rainbow .mini-bubble { position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,.9); background:rgba(255,255,255,.35); animation: bubbleFloat 2s ease-in-out infinite; pointer-events:none; }
button.rainbow .mini-bubble.b1 { right:14px; top:6px; width:12px; height:12px; }
button.rainbow .mini-bubble.b2 { left:16px; bottom:5px; width:8px; height:8px; animation-delay:.7s; }
button.rainbow:active { transform: translateY(2px) scale(.98); box-shadow: inset 0 0 22px rgba(255,255,255,.9), 0 4px 12px rgba(0,0,0,.18), 0 0 24px rgba(170,215,255,.6); }
@keyframes bubbleWobble { 0%, 100% { transform: scale(1, 1) rotate(0deg); } 50% { transform: scale(1.04, .97) rotate(.6deg); } }
@keyframes bubbleFloat { 0%, 100% { transform: translateY(0); opacity:.6; } 50% { transform: translateY(-5px); opacity:1; } }
button.green:active { box-shadow: 0 1px 0 #2e8b57; }
button.blue { background: linear-gradient(180deg, #7cc4ff, #3f8cff); box-shadow: 0 4px 0 #2b62b8, 0 6px 12px rgba(0,0,0,.18); }
button.blue:active { box-shadow: 0 1px 0 #2b62b8; }
button.ghost { background:#fff; color:#7c4dff; box-shadow: 0 4px 0 #d9d2ff; }
button:disabled { opacity:.55; cursor:default; }
.screen { width:100%; max-width:520px; padding: 14px 12px 28px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.hidden { display:none !important; }

/* ---------- Start screen ---------- */
#startScreen { text-align:center; }
/* v31.34: cá heo video — sprite sheet trong suốt + đuôi vẫy (video Flow đã tách nền; sprite 30 khung, hiển thị 240px; đuôi vẫy + vây vẫy như cá heo thật; bơi 3D: xoay rotateY ở 2 đầu làn + nghiêng 3D, bong bóng bay lên.
   CSS-only cho bơi ngang + bob; JS nhỏ đổi khung hình sprite.
   Lane nằm trong #startScreen nên tự ẩn khi vào game. */
#swimLane { position:relative; width:100%; height:170px; overflow:hidden; perspective:700px; }
#swimShark { position:absolute; top:2px; left:8px; width:200px; animation: swimX 11s linear infinite; will-change:left, transform; transform-style: preserve-3d; }
.swimChar { position:relative; width:200px; height:135px; animation: swimBob3D 2.4s ease-in-out infinite alternate; }
.swimSprite { position:absolute; left:0; top:0; width:200px; height:135px; display:block; transform: translateZ(0); will-change: transform; filter: drop-shadow(4px 6px 8px rgba(0, 30, 80, 0.35)); }
@keyframes swimX { 0% { left:8px; transform: rotateY(0deg); } 40% { left:calc(100% - 208px); transform: rotateY(0deg); } 50% { left:calc(100% - 208px); transform: rotateY(180deg); } 90% { left:8px; transform: rotateY(180deg); } 100% { left:8px; transform: rotateY(360deg); } }
@keyframes swimBob3D { from { transform: translateY(-3px) rotate(-4deg) rotateX(6deg) rotateY(-8deg) scale(1); } to { transform: translateY(4px) rotate(4deg) rotateX(-6deg) rotateY(8deg) scale(1.05); } }
.swim-bubble { position:absolute; bottom:4px; width:12px; height:12px; border-radius:50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(170,215,255,.55)); border:1px solid rgba(255,255,255,.8); opacity:0; animation: bubbleRise 3.4s ease-in infinite; }
.sb1 { left:24%; animation-delay:0s; }
.sb2 { left:50%; width:9px; height:9px; animation-delay:1.2s; }
.sb3 { left:76%; width:14px; height:14px; animation-delay:2.3s; }
@keyframes bubbleRise { 0% { transform:translateY(0); opacity:0; } 15% { opacity:1; } 100% { transform:translateY(-56px); opacity:0; } }
@media (prefers-reduced-motion: reduce) { #swimShark, #swimShark .swimSprite, .swim-bubble { animation:none; } #swimShark { left:50%; transform:translateX(-50%); } }
/* v31.67: prefers-reduced-motion — tat ca animation nen (body bgShift, bg-float) + be ca map dung yen o khung 1. */
@media (prefers-reduced-motion: reduce) { body { animation:none; } .bg-float { animation:none; } #mapParty .map-walk-sprite { animation:none; } #mapParty::before { animation:none; } .tile img { animation:none; } .map-node .boss-crown, .map-node .crown { animation:none; } .map-scroll { scroll-behavior:auto; } } /* v31.98: tat nhip sang vuong mien (chi con anh sang tinh) + cuon ban do ngay lap tuc */ /* v31.69: tat luon nhip sang; v31.76: tat luon dong dua */

.logo-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin: 6px 0; }
.logo-row img { width:56px; height:56px; border-radius:16px; box-shadow: 0 4px 10px rgba(0,0,0,.2); animation: logoBob 2s ease-in-out infinite; }
@keyframes logoBob { 0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-5px) rotate(var(--rot, 0deg)); } }
.tagline { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:17px; font-weight:700; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,.35); }
.tagline b { color:#ffe600; }

.howto-head { display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; }
.howto-head .howto-title { margin-bottom:0; }
.howto-toggle { display:none; flex:0 0 auto; font-size:13px; font-weight:800; color:#7c4dff; background:#efe9ff; border:2px solid #d9d2ff; border-radius:999px; padding:3px 10px; white-space:nowrap; }
.howto-title { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:20px; font-weight:800; background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.5px #000; margin-bottom: 8px; }

.level-info { font-family: 'Baloo 2', "Comic Sans MS", "Chalkboard SE", sans-serif; font-size:16px; font-weight:800; color:#fff; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
.rb { background: linear-gradient(90deg, #ff2d55, #ff9500, #ffe600, #2ed573, #00d2ff, #7b5cff, #ff2d78); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0.6px #000; font-size:1.15em; }

/* v27 compact HUD + board (2026-11-13): top panel too tall + board spilled at the
   bottom — smaller back button (was the tallest row), tighter
   padding/gaps/fonts on every size, square board centered (no more
   stretch-to-fill), svh sizing so it fits with Safari toolbar up,
   text-size-adjust + 100vh fallbacks for older phones/browsers. */
/* ---------- HUD ---------- */
#hud {
  width:100%; background-color: #fffdf5;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22120%22%20height%3D%22120%22%20viewBox%3D%220%200%20120%20120%22%3E%0A%3Cg%20opacity%3D%220.55%22%3E%0A%20%20%3Cg%20fill%3D%22%23ff9ecf%22%3E%3Cellipse%20cx%3D%2216%22%20cy%3D%2224%22%20rx%3D%224%22%20ry%3D%223.2%22%2F%3E%3Ccircle%20cx%3D%2210.5%22%20cy%3D%2218.5%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2216.5%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2217.5%22%20cy%3D%2216.5%22%20r%3D%221.8%22%2F%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2218.5%22%20r%3D%221.8%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%234db8ff%22%3E%3Cpath%20d%3D%22M66%2014%20Q74%208%2082%2014%20Q74%2020%2066%2014%20Z%22%2F%3E%3Cpath%20d%3D%22M82%2014%20L88%2010%20L88%2018%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23ffb347%22%3E%3Cpath%20d%3D%22M102%2046%20L104%2051%20L109%2051.5%20L105%2055%20L106.5%2060%20L102%2057.5%20L97.5%2060%20L99%2055%20L95%2051.5%20L100%2051%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23ff9ecf%22%3E%3Cellipse%20cx%3D%2226%22%20cy%3D%2272%22%20rx%3D%222.6%22%20ry%3D%225.5%22%2F%3E%3Cellipse%20cx%3D%2233%22%20cy%3D%2272%22%20rx%3D%222.6%22%20ry%3D%225.5%22%2F%3E%3Ccircle%20cx%3D%2229.5%22%20cy%3D%2282%22%20r%3D%225%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%234db8ff%22%3E%3Cpath%20d%3D%22M62%2092%20Q70%2078%2078%2090%20Q70%2094%2062%2092%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23ff5c8a%22%3E%3Cpath%20d%3D%22M104%20100%20C100%2096%2098%2093.5%2098%2091.5%20C98%2089.5%2099.5%2088%20101.5%2088%20C102.8%2088%20103.8%2088.8%20104%2090%20C104.2%2088.8%20105.2%2088%20106.5%2088%20C108.5%2088%20110%2089.5%20110%2091.5%20C110%2093.5%20108%2096%20104%20100%20Z%22%2F%3E%3C%2Fg%3E%0A%20%20%3Cg%20fill%3D%22%23b06bff%22%3E%3Cpath%20d%3D%22M46%2044%20A7%207%200%200%201%2060%2044%20Z%22%2F%3E%3Cpath%20d%3D%22M49%2044%20Q49%2049%2048%2051%20M53%2044%20Q53%2049%2053%2051%20M57%2044%20Q57%2049%2058%2051%22%20stroke%3D%22%23b06bff%22%20stroke-width%3D%221.6%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fg%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E");
  background-size: 120px 120px;
  border-radius: 24px; position:relative;
  padding: 4px 8px 5px; box-shadow: 0 8px 24px rgba(0,0,0,.18);

/* ---------- Board ---------- */
#boardWrap { width:calc(100% + 24px); max-width:none; margin-left:-12px; margin-right:-12px; position:relative; overflow:hidden; border-radius:18px; touch-action:none; }

/* Small-screen fix (mom's iPhone 16 Pro): the game page is taller than the
   viewport there, so a drag starting on a gap could still slide the whole
   page up/down. Lock the entire game screen against page scroll. The board
   stays FULL width (big tiles for mom) — instead the HUD is made compact on
   narrow screens (below), which frees the vertical room the page needs.
   v13 (An's call 2026-11-12): the leaderboard moved OUT of the game screen
   to the start screen — the game screen is just HUD + board now. */
#gameScreen { touch-action:none; width:100%; min-height:100vh; min-height:100dvh; min-height:100svh; justify-content:center; justify-content:safe center; gap:4px; padding-top:4px; padding-bottom:64px; } /* v27: svh last = fits even with Safari toolbar up */

/* Compact HUD on narrow phones (iPhone 16 Pro): smaller padding/fonts/buttons
   so the HUD fits fully and leaves room for the full-size board. */
@media (max-width:430px) {
  #hud { padding:2px 6px 4px; gap:1px; border-radius:16px; }
  .hud-stat { font-size:11px; }
  .hud-stat b { font-size:15px; }
  .hud-row { gap:3px; }
  .icon-btn { padding:2px 4px; font-size:10px; min-width:24px; }
  .progress { height:6px; }
  .perk-line { font-size:.7rem; padding:2px 6px; margin-top:0; }
}
#board {
  position:relative; width:100%; aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, rgba(255,107,157,.85), rgba(255,165,2,.85), rgba(46,213,115,.85), rgba(30,144,255,.85));
  border-radius:18px;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
  overflow:hidden; touch-action:none;
}
.tile {
  position:absolute; left:0; top:0; width:12.5%; height:12.5%; padding:0;
  transition: transform .22s ease;
  will-change: transform;
  touch-action:none;
}
.tile .inner {
  width:100%; height:100%; border-radius:14%; overflow:visible; position:relative;
  background:transparent;
  transition: transform .15s ease, opacity .18s ease;
} /* v31.76: nen o VUONG trong suot (An 2026-11-14) — bo nen pastel + box-shadow o vuong, chi giu lai ban thu; overflow visible de vien sang khong bi cat o mep o */
/* High-visibility tiles for An's mom (blurry eyes): v31.76 An asked to REMOVE
   the tinted square backgrounds (transparent tiles). The per-type colour cue
   is now the bright head-glow (drop-shadow, each animal's own colour) so tiles
   still read apart by colour, and the animals' own colours differ strongly.
   NO border/frame on any tile (An 2026-11-12). Placed before .selected/.hint
   so those still override. */
/* v31.49: hieu ung SANG cho tung o — moi o co hao quang (glow) mau cua
   rieng ban thu do (dung ANIMAL_COLORS; tho dung hong vi trang khong thay).
   Glow TINH (khong nhap nhay/chop) nen khong dau mat. */
.tile.t-shark img { filter: drop-shadow(0 -3px 4px rgba(90,185,255,.95)) drop-shadow(0 0 7px rgba(30,144,255,.55)); }
.tile.t-otter img { filter: drop-shadow(0 -3px 4px rgba(165,115,65,.95)) drop-shadow(0 0 7px rgba(139,90,43,.55)); }
.tile.t-rabbit img { filter: drop-shadow(0 -3px 4px rgba(255,175,220,.95)) drop-shadow(0 0 7px rgba(255,158,207,.60)); }
.tile.t-mouse img { filter: drop-shadow(0 -3px 4px rgba(185,190,195,.95)) drop-shadow(0 0 7px rgba(154,160,166,.60)); }
.tile.t-jellyfish img { filter: drop-shadow(0 -3px 4px rgba(210,185,250,.95)) drop-shadow(0 0 7px rgba(193,166,237,.65)); }
.tile.t-fox img { filter: drop-shadow(0 -3px 4px rgba(255,170,65,.95)) drop-shadow(0 0 7px rgba(255,140,26,.60)); }
.tile.t-gift img { filter: drop-shadow(0 -3px 4px rgba(255,90,90,.95)) drop-shadow(0 0 7px rgba(255,190,60,.65)); } /* v31.96: hop qua — do + vang */
.tile img { width:105%; height:105%; margin:-2.5%; object-fit:cover; display:block; pointer-events:none; animation: tileSway 2.6s ease-in-out infinite; transform-origin: 50% 88%; } /* v31.76: dong dua/lac lu nhe (An 2026-11-14) — xoay ±2° quanh chan duoi, 2.6s, nhe nhang, khong chop/khong rung man hinh. v31.80: mat cac be TO HON NUA (An 2026-11-14, dong y cat vien trong suot) — phong to anh 120% trong o thay vi cat file goc (cat se cat mat tai/vay; phong to thi mat chiem ~91% o, vien trong suot hap thu phan tran nen khong de len o ke. v31.86: An gui anh iPad — dau to qua, de len dau ban ke — thu nho xuong 110% (mat ~0.81 o, van to hon v31.79) cho anh rong nhat (ca map/chuot) vua khit trong o, khong de. v31.87: An choi ban live — dau van hoi to — thu nho them xiu xuong 105% (mat ~0.77 o, van to hon v31.79), anh rong nhat gio nam 2.75%..97.25% trong o, co khoang ho ro rang. v31.88: tren iPad van to — do o iPad ~87px nen khe ho o 105% chi ~5px — rieng may tinh bang (600-1024px) xuong 100% (khe ho ~9px, mat ~64px van to ro), dien thoai giu 105%. */
/* v31.88: An — tren iPad dau van to sau khi refresh — thu nho rieng cho may tinh bang (600-1024px): dau 100% (mat ~0.73 o, khe ho giua cac dau ~9px tren o ~87px), dien thoai giu 105%. v31.92: An — tren PC/laptop dau van to de len nhau — mo rong 100% ra moi man hinh >=600px. */
@media (min-width: 600px) { .tile img { width:100%; height:100%; margin:0; } } /* v31.92: An — tren PC/laptop dau van to de len dau ban ke — mo rong luat 100% tu chi-may-tinh-bang (600-1024px) ra moi man hinh >=600px ke ca desktop: khe ho ~9.5px tren o ~95px hap thu duoc do lac tileSway, dien thoai (<600px) giu 105%. */
@keyframes tileSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.tile:nth-child(even) img { animation-delay: -1.3s; } /* xen ke chan/le cho song dong */
/* Glitter sparkle on every tile: three tiny gold stars that twinkle.
   Small and soft (9-11px, peak opacity .85, edge-biased spots so they never
   cover the face) - no fast flashing, no screen shake. */
.tile .sparkle { position:absolute; line-height:1; color:#ffd700; pointer-events:none; z-index:3; animation:sparkleTwinkle 2.4s ease-in-out infinite; opacity:0; }
.tile .sparkle.s1 { font-size:11px; }
.tile .sparkle.s2 { font-size:9px; color:#ffe27a; }
.tile .sparkle.s3 { font-size:10px; }
@keyframes sparkleTwinkle { 0%,100% { opacity:0; transform:scale(.5) rotate(0deg); } 50% { opacity:.85; transform:scale(1.05) rotate(20deg); } }
.tile.selected .inner { outline:3px solid #ffcf3f; outline-offset:-1px; z-index:5; }
.tile.pop .inner { transform: scale(.1); opacity:0; }
/* match bounce: matched tiles hop up and down happily before they pop.
   Runs on the outer .tile via the `translate`/`scale` properties, so it
   composes with the inline grid-position transform (no layout shift). */
.tile.match-bounce { animation: matchBounce .21s ease-out; }
@keyframes matchBounce {
  0% { translate: 0 0; scale: 1 1; }
  30% { translate: 0 -32%; scale: .94 1.08; }
  55% { translate: 0 0; scale: 1.09 .85; }
  75% { translate: 0 -12%; scale: .97 1.04; }
  100% { translate: 0 0; scale: 1 1; }
}
.tile.new .inner { animation: dropIn .25s ease; }
@keyframes dropIn { from { transform: translateY(-30%) scale(.8); } to { transform: none; } }
/* Level-start ice pour (approved mockup v4 + sound Mẫu A): tiles drop one by
   one like ice cubes into a glass, each with a splash ring + flash when it
   lands. --d staggers the fall (45ms per cube, reading order), --rot gives
   each cube its own tumble angle. Runs on .inner (and .tile pseudos) so it
   composes with the outer tile's grid-position transform; #board clips the
   fall at the frame edge, so cubes appear to pour into the frame. */
.tile.ice-drop .inner { animation: iceDropIn .45s backwards; animation-delay: var(--d, 0ms); }
.tile.ice-drop::after { content:""; position:absolute; inset:8%; border-radius:50%; border:3px solid rgba(255,255,255,.95); box-shadow:0 0 10px rgba(255,255,255,.9), inset 0 0 8px rgba(255,255,255,.6); opacity:0; pointer-events:none; z-index:3; animation: iceSplash .55s ease-out both; animation-delay: calc(var(--d, 0ms) + 300ms); }
.tile.ice-drop .inner::before { content:""; position:absolute; inset:20%; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%); opacity:0; pointer-events:none; z-index:2; animation: iceFlash .28s ease-out both; animation-delay: calc(var(--d, 0ms) + 300ms); }
@keyframes iceDropIn {
  0% { transform: translateY(-340px) rotate(var(--rot, 0deg)) scale(1); opacity: 0; animation-timing-function: cubic-bezier(.55,.06,.68,.19); }
  18% { opacity: 1; }
  72% { transform: translateY(0) rotate(0deg) scale(1.08); opacity: 1; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  80% { transform: translateY(5px) scale(1.12, 0.88); }
  90% { transform: translateY(-7px) scale(0.97, 1.03); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes iceSplash {
  0% { transform: scale(.3); opacity: .95; }
  100% { transform: scale(1.5); opacity: 0; }
}
@keyframes iceFlash {
  0% { transform: scale(.2); opacity: .8; }
  100% { transform: scale(1); opacity: 0; }
}

.tile.hint .inner { outline:3px solid #ffe45e; outline-offset:-1px; animation: hintPulse .7s ease-in-out infinite; z-index:4; }
@keyframes hintPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }

/* special overlays */
.tile .badge {
  position:absolute; right:1px; top:1px; font-size: clamp(11px, 3vw, 17px); line-height:1;
  text-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events:none; z-index:3;
}
.tile.striped-h .inner::after {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.striped-v .inner::after {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.wrapped .inner { box-shadow: inset 0 0 0 2px #ffd23f; animation: wrapPulse .8s ease-in-out infinite; }
@keyframes wrapPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.tile.rainbow .inner {
  box-shadow: inset 0 0 0 2px #fff;
  animation: rainbowSpin 2s linear infinite;
}
@keyframes rainbowSpin {
  0% { filter: hue-rotate(0deg) brightness(1.15); }
  100% { filter: hue-rotate(360deg) brightness(1.15); }
}
.float-score {
  position:absolute; z-index:20; font-weight:bold; font-size:20px; color:#ff5c8a;
  text-shadow: 1px 1px 0 #fff; pointer-events:none;
  animation: floatUp 0.9s ease-out forwards;
}
@keyframes floatUp { from { opacity:1; transform: translate(-50%,0); } to { opacity:0; transform: translate(-50%,-46px); } }

/* ---------- Explosion & lightning FX ---------- */
/* Screen shake animations removed: they gave An eye strain and headaches. */
/* ---------- Win celebration ---------- */
#celebrate { position:fixed; inset:0; z-index:60; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; overflow:hidden; }
#celebrate.hidden { display:none !important; }
.celeb-shark { width: min(260px, 58vw); height: auto; animation: sharkJump .55s ease-in-out infinite alternate; filter: drop-shadow(0 8px 16px rgba(0,0,0,.3)); }
@keyframes sharkJump { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-20px) rotate(4deg) scale(1.04); } }
.celeb-text { font-size: clamp(38px, 11vw, 64px); font-weight:900; color:#ffcf3f; text-shadow: 3px 3px 0 #fff, 0 0 24px #ff9d00, 0 6px 14px rgba(0,0,0,.35); animation: celebPop .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes celebPop { 0% { transform: scale(.2) rotate(-8deg); opacity:0; } 60% { transform: scale(1.15) rotate(2deg); opacity:1; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.celeb-stars { display:flex; gap:10px; }
.celeb-stars .star { font-size: clamp(40px, 12vw, 64px); color:#ffd23f; text-shadow: 0 0 16px #ff9d00, 2px 2px 0 #fff; animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes starPop { 0% { transform: scale(0) rotate(-30deg); opacity:0; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.confetti-piece { position:absolute; top:-14px; pointer-events:none; will-change: transform; }
.tile.dance .inner { animation: tileDance .5s ease-in-out infinite alternate; }
@keyframes tileDance { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-6px) rotate(4deg) scale(1.08); } }
#fxLayer { position:absolute; inset:0; z-index:25; pointer-events:none; border-radius:18px; }
/* #boardWrap now clips the effects to the board (overflow:hidden), so debris
   and the giant head can no longer push the page sideways; the layer itself
   stays unclipped so particles can still fly freely inside the frame */
.particle { position:absolute; border-radius:50%; pointer-events:none; will-change: transform, opacity; }
.particle.confetti { border-radius:2px; }
.particle.droplet { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
/* water-bubble burst: translucent shiny bubble + ripple ring over matched tiles */
.fx-bubble { position:absolute; width:12.5%; aspect-ratio:1/1; transform: translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:23;
  background: radial-gradient(circle at 32% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.28) 20%, rgba(165,220,255,0.18) 55%, rgba(125,211,252,0.4) 100%);
  border: 2px solid rgba(255,255,255,0.75);
  box-shadow: inset 0 0 8px rgba(255,255,255,0.6), 0 0 10px rgba(125,211,252,0.5); }
.fx-bubble::after { content:""; position:absolute; left:16%; top:10%; width:36%; height:24%; border-radius:50%; border-top:3px solid rgba(255,255,255,0.95); transform: rotate(-25deg); }
.fx-ripple { position:absolute; width:12.5%; aspect-ratio:1/1; transform: translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:23;
  border: 2px solid rgba(186,230,253,0.9); box-shadow: 0 0 8px rgba(125,211,252,0.6); }
.fx-flash-screen { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:45; will-change: opacity; } /* v31.91: will-change de chop chi composite, khong ve lai ca man hinh */
.boom-text {
  position:absolute; z-index:26; font-weight:900; font-size: clamp(48px, 12vw, 64px); color:#ffcf3f;
  text-shadow: 3px 3px 0 #fff, 0 0 26px #ff9d00, 0 6px 12px rgba(0,0,0,.35);
  pointer-events:none; white-space:nowrap; transform: translate(-50%,-50%);
}
.fx-flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; will-change: opacity; } /* v31.91: will-change de chop chi composite */
.fx-bolt { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #ffe45e); }
/* striped-candy beam: white-hot core with a warm gold glow, sweeping out from the candy.
   Thunder version: much stronger glow so the beam blazes across the row/column. */
.fx-beam { position:absolute; z-index:24; pointer-events:none; }
.fx-beam.h { left:0; width:100%; height:12.5%; background: linear-gradient(180deg, rgba(255,190,0,0) 0%, rgba(255,210,60,.8) 16%, #fffbe8 40%, #ffffff 50%, #fffbe8 60%, rgba(255,210,60,.8) 84%, rgba(255,190,0,0) 100%); box-shadow: 0 0 10px 2px rgba(255,200,40,.55); animation: beamSweepX .34s ease-out forwards; }
.fx-beam.v { top:0; height:100%; width:12.5%; background: linear-gradient(90deg, rgba(255,190,0,0) 0%, rgba(255,210,60,.8) 16%, #fffbe8 40%, #ffffff 50%, #fffbe8 60%, rgba(255,210,60,.8) 84%, rgba(255,190,0,0) 100%); box-shadow: 0 0 10px 2px rgba(255,200,40,.55); animation: beamSweepY .34s ease-out forwards; }
/* v31.53: 3 tia sang theo dung huong o trung nhau — moi tia mau cua ban
   thu trung (bien --c), mo dan roi tat dan (1 nhịp mem, khong nhap
   nhay). .fx-ray: tia DOC (cot sang doc tu tren dinh bang xuong toi o,
   rong 1 o). .fx-ray-h: tia NGANG (dai sang ngang doc theo hang, cao 1
   o, dai 3 o tam o). */
.fx-ray { position:absolute; top:0; width:12.5%; z-index:24; pointer-events:none;
  background: linear-gradient(90deg, transparent 0%, var(--c) 22%, #ffffff 50%, var(--c) 78%, transparent 100%);
  box-shadow: 0 0 14px 4px var(--c);
  transform-origin: 50% 0; animation: rayDown .6s ease-out forwards; }
.fx-ray-h { position:absolute; height:12.5%; width:37.5%; z-index:24; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, var(--c) 22%, #ffffff 50%, var(--c) 78%, transparent 100%);
  box-shadow: 0 0 14px 4px var(--c);
  transform-origin: 50% 50%; animation: rayAcross .6s ease-out forwards; }
@keyframes rayDown { 0% { transform: scaleY(0); opacity:0; } 30% { transform: scaleY(1); opacity:1; } 100% { transform: scaleY(1); opacity:0; } }
@keyframes rayAcross { 0% { transform: scaleX(0); opacity:0; } 30% { transform: scaleX(1); opacity:1; } 100% { transform: scaleX(1); opacity:0; } }
/* v31.54: ban do chon man kieu Candy Crush — duong uon luon (SVG) qua cac node man; node so man, sao 2-3, ten vung dat; khoa man chua mo. */
#mapScreen { position:fixed; inset:0; z-index:60; background:url("https://miatrann97-source.github.io/animal-crush/map-bg-candy-sides.jpg") center top/cover no-repeat, linear-gradient(180deg,#bfe8ff 0%,#ffe3f0 55%,#fff6e0 100%); /* v31.72: nen banh keo 2 ben, giua trong (An duyet 2026-11-14 — be ca giua da xoa) */ overflow:hidden; display:flex; flex-direction:column; }
/* v31.67: landscape (PC/desktop ngang) — cover cat tron anh doc nen be ca o giua bi cat mat: background-position 38% giua tam cua so hien thi vao be ca (mat ~31-45% chieu cao anh). Portrait giu center top. */
@media (orientation: landscape) { #mapScreen { background-position: center 38%; } }
#mapScreen.hidden { display:none; }
.map-wrap { flex:1; display:flex; flex-direction:column; max-width:560px; width:100%; margin:0 auto; padding:16px 12px 12px; overflow:hidden; }
.map-wrap h2 { text-align:center; font-size:1.5rem; color:#22405a; margin:4px 0 2px; text-shadow:0 1px 4px rgba(255,255,255,.95), 0 0 10px rgba(255,255,255,.85); }
.map-total, .map-sub { text-shadow:0 1px 3px rgba(255,255,255,.95), 0 0 8px rgba(255,255,255,.85); }
.map-total { text-align:center; font-weight:800; color:#b26a00; font-size:1rem; }
.map-sub { text-align:center; font-size:.85rem; opacity:.75; color:#22405a; margin:2px 0 6px; }
.map-scroll { flex:1; overflow-y:auto; scroll-behavior:smooth; position:relative; border-radius:18px; background:rgba(255,255,255,.08); padding:8px 0 96px; -webkit-overflow-scrolling:touch; } /* v31.96: dem duoi 16->96px de hang cuoi khong bi thanh nut duoi che; v31.95: overlay trang .15 -> .08 cho nut ro hon (An 2026-11-14: nut mo); v31.72: KHONG lam mo nua — nen moi giua trong */
#mapPath { position:relative; padding-top:84px; } /* v31.96: tang tu 72px de be ca dung cao hon van hien tron dau (nhay len khong bi cat); v31.60: room above node 1 so the party (standing above its node) is fully visible, not hidden behind the header */
#mapRoad { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; filter:drop-shadow(0 0 6px rgba(255, 200, 80, .8)) drop-shadow(0 0 16px rgba(255, 190, 60, .4)); } /* v31.73: duong cau vong phat sang RO hon (test v31.71: glow cu 5px/.55 qua mo, mat thuong khong thay) */
.map-row { height:110px; position:relative; z-index:1; } /* v31.68: row cao hon cho nut 72px + ten dat vua */
.map-tree { position:absolute; top:42px; transform:translate(-50%,-50%); width:26px; height:33px; line-height:0; pointer-events:none; filter:drop-shadow(0 2px 2px rgba(34,64,90,.25)); z-index:0; } .map-tree svg { display:block; width:26px; height:33px; } /* v31.74: cay ve tay doc 2 ben duong — ngay tam nut (42px), bam theo duong */
.map-node { position:absolute; top:6px; width:72px; height:72px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.35rem; color:#fff; cursor:pointer; background:linear-gradient(180deg,#ffd23f 0%,#ff9500 70%,#e07b00 100%); text-shadow:0 2px 3px rgba(0,0,0,.3); box-shadow:0 7px 0 rgba(0,0,0,.16), 0 12px 20px rgba(34,64,90,.35), inset 0 3px 0 rgba(255,255,255,.65), inset 0 -7px 0 rgba(0,0,0,.14); }
.map-node::before { content:""; position:absolute; top:6px; left:10px; width:32px; height:19px; border-radius:50%; background:rgba(255,255,255,.55); filter:blur(1px); transform:rotate(-18deg); pointer-events:none; }
.map-node:active, .map-node.pressed { transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.16), 0 3px 8px rgba(34,64,90,.3), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -5px 0 rgba(0,0,0,.12); } /* v31.71: lom xuong nhu phim ban phim (An 2026-11-14) — nut chim 5px, bong day gan nhu bien mat */
.map-node.done { background:linear-gradient(180deg,#5ee0a0 0%,#2ed573 70%,#1da85c 100%); }
.map-node.current { background:linear-gradient(180deg,#ffe066 0%,#ffb700 55%,#ff9500 100%); outline:3px solid #ffd23f; outline-offset:2px; animation:mapPulse 1.2s ease-in-out infinite; } /* v31.96: nut hien tai — vang chi con la VIEN vang (+ 👑 + nhip dap), khong con lop vang phu orb (An 2026-11-14: nut man 1 mo vi lop vang + be ca che) */
@keyframes mapPulse { 0%,100% { scale:1; } 50% { scale:1.12; } } /* v31.75: dung thuoc-tinh scale thay cho transform — animation mapPulse khong con chan transform:translateY(5px) cua :active/.pressed, nut man hien tai (do, dang nhap nhay) gio lom xuong duoc khi an (test v31.74: giu nut man 2 khong thay lom) */
/* v31.55: doan be ca + cac be khoi vuong buoc di tren ban do (anh AI, nen trong suot). */
/* v31.57: doan di — be ca map (mau cua game) dan dau, sau la 5 be
   dong vat KHOI VUONG (o tile cua game), vua di vua bouncy: moi be nay
   len lech nhau (stagger) nhu doan tau nay. */
#mapParty { position:absolute; z-index:3; width:52px; pointer-events:none; transform:translate(-50%,-100%); display:flex; align-items:flex-end; justify-content:center; } /* v31.96: be ca nho lai (64->52px) de khong che orb nut hien tai; v31.61: only the shark girl walks now, so the party is just her */
/* v31.69: anh sang vang theo be ca — vong sang tron mo o duoi chan be (tren duong, sau be), di den dau sang den do; nhip nhe, khong chop. */
#mapParty::before { content:""; position:absolute; left:50%; top:100%; width:104px; height:104px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle, rgba(255, 240, 150, .5) 0%, rgba(255, 210, 90, .25) 32%, rgba(255, 200, 100, 0) 60%); pointer-events:none; z-index:-1; animation:mapLightPulse 2.2s ease-in-out infinite alternate; } /* v31.96: vong sang nho + mo hon (150px/.85 -> 104px/.5) de khong rua trang orb nut hien tai */
@keyframes mapLightPulse { from { opacity:.72; } to { opacity:.95; } }
.map-candy { position:absolute; z-index:2; font-size:20px; line-height:1; pointer-events:none; transform:translate(-50%,-50%); filter:drop-shadow(0 2px 2px rgba(34,64,90,.3)); } /* v31.61: candies gliding on the road after the shark girl */
#mapParty .map-party-baby { display:block; flex:0 0 auto; margin-left:-3px; filter:drop-shadow(0 3px 4px rgba(34,64,90,.3)); animation:partyHop .5s ease-in-out infinite alternate; }
#mapParty .map-party-baby img { display:block; width:100%; height:auto; }
/* v31.67: be ca MAP DI BO — sprite wave 10 khung tu video An gui (tiles/shark-girl-walk.png 960x182, khung 96x182, hien 48x91px). Span trong chi doi khung wave (100ms/khung, steps(1) de khung dung yen khong truot); bounce (partyHop/partyBob) van o span ngoai .map-party-baby. */
#mapParty .map-walk-sprite { display:block; width:46px; height:87px; /* v31.96: nho lai (56x106 -> 46x87) de khong che orb; v31.68: to hon theo nut 72px */ background:url("https://miatrann97-source.github.io/animal-crush/tiles/shark-girl-walk.png") 0 0/1000% 100% no-repeat; animation:walkCycle 1s steps(1) infinite; }
@keyframes walkCycle { 0% { background-position:0% 0; } 10% { background-position:11.111% 0; } 20% { background-position:22.222% 0; } 30% { background-position:33.333% 0; } 40% { background-position:44.444% 0; } 50% { background-position:55.555% 0; } 60% { background-position:66.666% 0; } 70% { background-position:77.777% 0; } 80% { background-position:88.888% 0; } 90%,100% { background-position:100% 0; } }
#mapParty .map-party-baby.leader { width:46px; margin-left:0; z-index:2; }
#mapParty .map-party-baby.follower { width:28px; }
#mapParty .map-party-baby:nth-child(1) { animation-delay:0s; }
#mapParty .map-party-baby:nth-child(2) { animation-delay:.08s; }
#mapParty .map-party-baby:nth-child(3) { animation-delay:.16s; }
#mapParty .map-party-baby:nth-child(4) { animation-delay:.24s; }
#mapParty .map-party-baby:nth-child(5) { animation-delay:.32s; }
#mapParty .map-party-baby:nth-child(6) { animation-delay:.4s; }
#mapParty.walking .map-party-baby { animation-name:partyHop; animation-duration:.32s; }
#mapParty.idle .map-party-baby { animation-name:partyBob; animation-duration:1s; }
@keyframes partyHop { from { transform:translateY(0); } to { transform:translateY(-7px); } }

/* Preview-only safe storage: this file is shown inside a chat widget
   (preview mode), where the real __previewStore throws. Reads prefer the
   real __previewStore; writes go to both, so progress survives a reload
   here but never touches the live game's keys. */
var __memStore = {};
var __previewStore = {
  getItem: function(k) {
    try { var v = window["local" + "Storage"].getItem(k); if (v !== null) return v; } catch (e) {}
    return (k in __memStore) ? __memStore[k] : null;
  },
  setItem: function(k, v) {
    __memStore[k] = String(v);
    try { window["local" + "Storage"].setItem(k, v); } catch (e) {}
  },
  removeItem: function(k) {
    delete __memStore[k];
    try { window["local" + "Storage"].removeItem(k); } catch (e) {}
  }
};
/* v30: ?reset=1 — An asked to start over from Level 1 (preview). Clears
   Animal Crush progress on THIS browser only (level, best, story-seen
   flags, stars), then strips the param so reopening the page does not reset
   again. Runs here, before the game reads its saved level. Keeps
   language, music and visit-counter settings. */
(function () {
  try {
    if (new URLSearchParams(location.search).get("reset") !== "1") return;
    ["animalCrushLevel", "animalCrushBest", "animalCrushMaxLevel", "ac_story_seen", "ac_stars"].forEach(function (k) { __previewStore.removeItem(k); });

  /* v31.34: chạy khung hình sprite cá heo bằng CANVAS (30 khung, 6 cột x 5 hàng, nguồn 480x324/khung, hiển thị 240x162; 12fps, vòng 2.5s). Canvas drawImage mượt hơn background-position trên iPhone (không bị khựng/lag). */
  (function () {
    var cv = document.getElementById("swimSprite");
    if (!cv) return;
    var ctx = cv.getContext("2d");
    var img = new Image();
    var COLS = 6, SW = 480, SH = 324, DW = 200, DH = 135, FRAMES = 30, frame = 0, last = 0, acc = 0, ready = false;
    img.onload = function () { ready = true; };
    img.src = "https://miatrann97-source.github.io/animal-crush/tiles/dolphin-flow-sprite-pastel.png?v=359";
    if (img.complete && img.naturalWidth) ready = true;
    function tick(ts) {
      if (!last) last = ts;
      var dt = ts - last; last = ts;
      acc += dt;
      if (acc >= 83) {
        frame = (frame + Math.floor(acc / 83)) % FRAMES;
        acc = acc % 83;
        if (ready) {
          var col = frame % COLS, row = Math.floor(frame / COLS);
          ctx.clearRect(0, 0, DW, DH);
          ctx.drawImage(img, col * SW, row * SH, SW, SH, 0, 0, DW, DH);
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

    return {
      x: u*u*u*p0.x + 3*u*u*t*p0.x + 3*u*t*t*p1.x + t*t*t*p1.x,
      y: u*u*u*p0.y + 3*u*u*t*my + 3*u*t*t*my + t*t*t*p1.y
    };
  }
  function frame(ts) {
    if (!start) start = ts;
    var p = Math.min((ts - start) / total, 1);
    var segFloat = p * (pts.length - 1);
    var si = Math.min(Math.floor(segFloat), pts.length - 2);
    var st = segFloat - si;
    var pos = cubic(pts[si], pts[si + 1], st);
    var hop = Math.abs(Math.sin(st * Math.PI * 2)) * 5;
    placeParty(pos.x, pos.y - hop);
    /* Record where she just was, so the candies can glide after her. */
    candyTrail.push({ x: pos.x, y: pos.y });
    if (candyTrail.length > 60) candyTrail.shift();
    updateCandies();
    if (p < 1) requestAnimationFrame(frame);
    else {
      party.classList.remove("walking");
      party.classList.add("idle");
      placePartyAt(toLv);
    }
  }
  requestAnimationFrame(frame);
}

function drawMapRoad() {
  var svg = document.getElementById("mapRoad");
  var path = document.getElementById("mapPath");
  if (!svg || !path) return;
  var nodes = path.querySelectorAll(".map-node");
  if (!nodes.length) { svg.innerHTML = ""; return; }
  var pr = path.getBoundingClientRect();
  var pts = [];
  for (var i = 0; i < nodes.length; i++) {
    var r = nodes[i].getBoundingClientRect();
    pts.push({ x: r.left + r.width / 2 - pr.left, y: r.top + r.height / 2 - pr.top });
  }
  var stops = '<stop offset="0%" stop-color="#ff3b30"/><stop offset="16.7%" stop-color="#ff9500"/>' +
    '<stop offset="33.3%" stop-color="#ffd60a"/><stop offset="50%" stop-color="#34c759"/>' +
    '<stop offset="66.7%" stop-color="#0a84ff"/><stop offset="83.3%" stop-color="#5e5ce6"/>' +
    '<stop offset="100%" stop-color="#bf5af2"/>';
  /* v31.63: EVERY leg carries the full rainbow (An: "con duong tu man nay
     qua man kia mang day du sac cau vong") — one gradient per leg, from
     that leg's own start point to its end point. */
  var defs = "<defs>";
  var legs = "";
  var dAll = "M " + pts[0].x + " " + pts[0].y;
  for (var j = 1; j < pts.length; j++) {
    var my = (pts[j - 1].y + pts[j].y) / 2;
    var segD = "M " + pts[j - 1].x + " " + pts[j - 1].y +
      " C " + pts[j - 1].x + " " + my + ", " + pts[j].x + " " + my + ", " + pts[j].x + " " + pts[j].y;
    /* v31.64: anchor the gradient at the NODE EDGES, not the centres —
       the 29px node circles cover both ends of the leg, so a centre-to-
       centre gradient only ever shows its middle colours. */
    var dx = pts[j].x - pts[j - 1].x, dy = pts[j].y - pts[j - 1].y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var trim = len > 60 ? 36 : 0; /* v31.68: 36px = ban kinh nut 72px */
    var gx1 = pts[j - 1].x + ux * trim, gy1 = pts[j - 1].y + uy * trim;
    var gx2 = pts[j].x - ux * trim, gy2 = pts[j].y - uy * trim;
    defs += '<linearGradient id="mapRainbow' + j + '" gradientUnits="userSpaceOnUse" x1="' + gx1 + '" y1="' + gy1 + '" x2="' + gx2 + '" y2="' + gy2 + '">' + stops + "</linearGradient>";
    legs += '<path d="' + segD + '" fill="none" stroke="url(#mapRainbow' + j + ')" stroke-width="18" stroke-linecap="round" opacity="0.9"/>';
    dAll += " C " + pts[j - 1].x + " " + my + ", " + pts[j].x + " " + my + ", " + pts[j].x + " " + pts[j].y;
  }
  defs += "</defs>";
  var h = path.getBoundingClientRect().height;
  svg.setAttribute("viewBox", "0 0 " + pr.width + " " + h);
  svg.setAttribute("width", pr.width);
  svg.setAttribute("height", h);
  svg.innerHTML = defs + legs +
    '<path d="' + dAll + '" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.9"/>';
}

/* Level-start ice pour: tiles drop one by one like ice cubes into a glass
   (approved mockup v4 + sound Mẫu A). Input is blocked and the 7-minute timer
   starts only after the pour finishes, so the player gets the full 7 minutes. */
var ICE_DROP_STEP = 45; /* ms between cubes */
var ICE_DROP_FALL = 450; /* ms for one cube to fall */
var iceDropTimer = null;
function playIceDrop() {
  var idx = 0, r, c;
  for (r = 0; r < ROWS; r++) {
    for (c = 0; c < COLS; c++) {
      var tl = state.board[r][c];
      if (!tl) continue;
      var el = elsById[tl.id];
      if (!el) continue;
      el.classList.remove("new"); /* replace the small refill drop with the ice pour */
      el.style.setProperty("--d", (idx * ICE_DROP_STEP) + "ms");
      el.style.setProperty("--rot", (Math.floor(Math.random() * 37) - 18) + "deg");
      el.classList.add("ice-drop");
      idx++;
    }
  }
  var total = idx * ICE_DROP_STEP + ICE_DROP_FALL;
  state.busy = true;
  AudioEng.sfx("icePour");
  clearTimeout(iceDropTimer);
  iceDropTimer = setTimeout(function() {
    var ids = Object.keys(elsById);
    for (var i = 0; i < ids.length; i++) {
      var el2 = elsById[ids[i]];
      if (el2) el2.classList.remove("ice-drop");
    }
    state.busy = false;
    if (!state.over && !document.getElementById("gameScreen").classList.contains("hidden")) startTimer();
  }, total + 120);
}

/* v30.1: resume the 8-minute timer after reading the story mid-level.
   Unlike startTimer() (new level: resets to 8:00), this keeps the
   remaining time — reading the story must not cost play time. */
function resumeTimer() {
  stopTimer();
  updateTimerDisplay();
  timerId = setInterval(function() {
    if (state.over) return;
    if (document.getElementById("gameScreen").classList.contains("hidden")) return;
    if (state.timeLeft > 0) { state.timeLeft--; updateTimerDisplay(); }
    if (state.timeLeft <= 0 && !state.busy) endLevel(false);
  }, 1000);
}
function showStoryViewer() {
  var ov = document.getElementById("storyScreen");
  /* v30.1: opened mid-level (game screen visible) -> pause the timer
     while reading, resume it on close. From the start screen there is
     no running timer, so nothing to pause. */
  var inGame = !document.getElementById("gameScreen").classList.contains("hidden");
  if (inGame) stopTimer();
  var list = document.getElementById("storyList");
  var html = "";
  for (var i = 0; i < STORY_LEVELS.length; i++) {
    var ch = STORY[STORY_LEVELS[i]];
    html += '<div class="story-item"><img src="' + ch.img + '" alt=""><div><b>' + ch.title[LANG] + '</b><p>' + ch.body[LANG] + '</p></div></div>';
  }
  list.innerHTML = html;
  list.classList.remove("hidden");
  document.getElementById("storyImg").classList.add("hidden");
  var _st = document.getElementById("storyTitle");
  _st.textContent = t("storyBookTitle"); /* v31.84: Ca Con Phieu Luu Ky — the book title on top of the full story list */
  _st.classList.remove("hidden");
  document.getElementById("storyBody").classList.add("hidden");
  document.getElementById("storyPlayBtn").classList.add("hidden");
  var close = document.getElementById("storyCloseBtn");
  close.textContent = t("storyClose");
  close.classList.remove("hidden");
  ov.classList.remove("hidden");
  close.onclick = function() { ov.classList.add("hidden"); if (inGame) resumeTimer(); };
}

/* ================= v31.96: 4 tinh nang kieu Candy Crush (An 2026-11-14: lam het tru dua voi me) =================
   A. Combo keo dac biet (doi 2 keo dac biet voi nhau). B. Nhiem vu moi: tha qua

   D. So sticker theo chuong truyen. E. Vuong mien keo cho man boss (An gui

/* --- E. Man boss (10/20/30/40/50) — vuong mien keo tren dinh nut ban do --- */
var BOSS_LEVELS = [10, 20, 30, 40, 50];
var BOSS_CROWN_SVG = '<svg viewBox="0 0 24 22" xmlns="http://www.w3.org/2000/svg" aria-label="Man boss"><path d="M2 17 L2 9 L7 12 L12 5 L17 12 L22 9 L22 17 Z" fill="#ffc93c" stroke="#e8890c" stroke-width="1" stroke-linejoin="round"/><circle cx="12" cy="2.6" r="2.4" fill="#ff9ecf" stroke="#e75480" stroke-width=".8"/><line x1="12" y1="5" x2="12" y2="8" stroke="#ffffff" stroke-width="1.4"/><circle cx="2.4" cy="8.4" r="1.3" fill="#ffe066" stroke="#e8890c" stroke-width=".7"/><circle cx="21.6" cy="8.4" r="1.3" fill="#ffe066" stroke="#e8890c" stroke-width=".7"/><circle cx="7" cy="14" r="1.9" fill="#ff5c7a"/><circle cx="12" cy="14.5" r="1.9" fill="#2ed573"/><circle cx="17" cy="14" r="1.9" fill="#38bdf8"/></svg>';

/* --- B. Nguyen lieu: so hop qua moi man --- */
var INGREDIENT_LEVELS = { 12: 2, 18: 3, 24: 4 };
function ingDone() {
  if (!state.ingTotal) return true;
  return state.ingDropped >= state.ingTotal;
}
/* Thu hop qua dang o hang day (row 7). Tra true neu thu duoc it nhat 1 hop. */
async function collectGifts() {
  if (!state.ingTotal) return false;
  var got = [];
  for (var c = 0; c < COLS; c++) {
    var tl = state.board[ROWS - 1][c];
    if (tl && tl.type === "gift") got.push([ROWS - 1, c]);
  }
  if (!got.length) return false;
  AudioEng.sfx("candyPop", { cascade: 1 });
  got.forEach(function(cell) { var el = tileEl(cell[0], cell[1]); if (el) el.classList.add("pop"); });
  await sleep(150);
  got.forEach(function(cell) {
    var tl2 = state.board[cell[0]][cell[1]];
    if (tl2 && tl2.type === "gift") { removeTileEl(tl2.id); state.board[cell[0]][cell[1]] = null; }
  });
  state.ingDropped += got.length;
  updateHUD();
  dropAndRefill();
  renderBoard(false);
  return true;
}

/* --- A. Combo keo dac biet — tinh vung no (thuan, de test) ---
   cross: soc+soc = hang + cot. cross3: soc+goi = 3 hang + 3 cot.
   blast5: goi+goi = 5x5. */
function comboPlan(sa, sb, r, c) {
  var cells = {}, list = [];
  function add(rr, cc) {
    if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS) return;
    var k = rr + "," + cc;
    if (!cells[k]) { cells[k] = [rr, cc]; list.push([rr, cc]); }
  }
  var beams = [], kind = "";
  function striped(s) { return s === "h" || s === "v"; }
  if (striped(sa) && striped(sb)) {
    kind = "cross";
    for (var cc = 0; cc < COLS; cc++) add(r, cc);
    for (var rr = 0; rr < ROWS; rr++) add(rr, c);
    beams.push({ dir: "h", line: r, from: [r, c] });
    beams.push({ dir: "v", line: c, from: [r, c] });
  } else if ((striped(sa) && sb === "wrapped") || (sa === "wrapped" && striped(sb))) {
    kind = "cross3";
    for (var d = -1; d <= 1; d++) {
      for (var cc2 = 0; cc2 < COLS; cc2++) add(r + d, cc2);
      for (var rr2 = 0; rr2 < ROWS; rr2++) add(rr2, c + d);
    }
    for (var d2 = -1; d2 <= 1; d2++) {
      if (r + d2 >= 0 && r + d2 < ROWS) beams.push({ dir: "h", line: r + d2, from: [r + d2, c] });
      if (c + d2 >= 0 && c + d2 < COLS) beams.push({ dir: "v", line: c + d2, from: [r, c + d2] });
    }
  } else if (sa === "wrapped" && sb === "wrapped") {
    kind = "blast5";
    for (var dr = -2; dr <= 2; dr++) for (var dc = -2; dc <= 2; dc++) add(r + dr, c + dc);
  }
  return { kind: kind, cells: list, beams: beams };
}
async function doSpecialCombo(r1, c1, r2, c2) {
  var a = state.board[r1][c1], b = state.board[r2][c2];
  if (!a || !b) return;
  var plan = comboPlan(a.special, b.special, r2, c2);
  if (!plan.kind) return;
  /* hop qua trong vung no van song (chi thu khi roi xuong day) */
  var list = plan.cells.filter(function(cell) {
    var g = state.board[cell[0]] && state.board[cell[0]][cell[1]];
    return !g || g.type !== "gift";
  });
  var __keep = {};
  __keep[r1 + "," + c1] = true; __keep[r2 + "," + c2] = true;
  list = splitJellyCells(list.filter(function(cell) { return !__keep[cell[0] + "," + cell[1]]; })).clear.concat([[r1, c1], [r2, c2]]);
  if (state.level === 10) damageBoss(3);
  var pts = list.length * 60 * state.scoreMult;
  state.score += pts; updateHUD();
  showFloatScore(pts, list);
  if (plan.kind === "blast5") AudioEng.sfx("wrapped"); else AudioEng.sfx("striped");
  plan.beams.forEach(function(bm) { stripedBeam(bm, function() { return 60; }); });
  if (plan.kind !== "cross") explosionAt(list, "fox", { count: 25, max: 180, text: false });
  burstCells(list, 10, BURST_CAP);
  await bounceThenPop(list);
  list.forEach(function(cell) {
    var tl = state.board[cell[0]][cell[1]];
    if (tl) { countClearedCell(cell[0], cell[1], tl); removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
  });
  dropAndRefill();
  renderBoard(false);
  await sleep(240);
  await resolveBoard(null);
}
/* Cau vong + cau vong: ca ban no sach theo 8 dot (kieu dai bang nhung KHONG
   co dai bang bay qua, khong sam, khong chop man hinh). */
async function detonateRainbowPair() {
  clearHint();
  resetHintTimer();
  var cells = [];
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    var __t = state.board[r][c];
    if (__t && __t.type === "gift") continue;
    cells.push([r, c]);
  }
  for (var i = cells.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
  }
  var waves = [], perWave = 8;
  for (var k = 0; k < cells.length; k += perWave) waves.push(cells.slice(k, k + perWave));
  AudioEng.sfx("rainbow");
  if (state.level === 10) damageBoss(3);
  for (var w = 0; w < waves.length; w++) {
    var wave = waves[w];
    burstCells(wave, 4, 40);
    wave = splitJellyCells(wave).clear;
    var pts = wave.length * 60 * state.scoreMult;
    state.score += pts;
    updateHUD();
    showFloatScore(pts, wave);
    wave.forEach(function(cell) { var el = tileEl(cell[0], cell[1]); if (el) el.classList.add("pop"); });
    await sleep(120);
    wave.forEach(function(cell) {
      var tl = state.board[cell[0]][cell[1]];
      if (tl) { countClearedCell(cell[0], cell[1], tl); removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
    });
  }
  dropAndRefill();
  renderBoard(false);
  await sleep(260);
  await resolveBoard(null);
}

function __dateStr(d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function __todayStr() { return __dateStr(new Date()); }
function __yesterdayStr() { var d = new Date(); d.setDate(d.getDate() - 1); return __dateStr(d); }
function getDaily() {
  return {
    last: __previewStore.getItem("ac_daily_last") || "",

  };

  var dd = getDaily();
  if (dd.last === __todayStr()) return { can: false, day: dd.streak || 1 };
  var day = (dd.last === __yesterdayStr() && dd.streak >= 1) ? dd.streak + 1 : 1;
  if (day > 7) day = 1;
  return { can: true, day: day };
}

function claimDaily() {

  state.counts = { shark: 0, otter: 0, rabbit: 0, mouse: 0, jellyfish: 0, fox: 0, jelly: 0, bombs: 0, rainbows: 0 };

     (khong de 2 qua trung 1 o). L5+: 1 bom; L15+: 2 bom; L25+: 1 keo cau vong. */
  var __usedCells = {};
  function __placeSpecial(type, special) {
    var r2, c2;
    do { r2 = Math.floor(Math.random() * ROWS); c2 = Math.floor(Math.random() * COLS); } while (__usedCells[r2 + "," + c2]);
    __usedCells[r2 + "," + c2] = true;
    state.board[r2][c2] = makeTile(type, special);
  }
  /* v31.96: hop qua nguyen lieu (man 12/18/24) — dat o 3 hang tren cung de roi xuong */
  state.ingDropped = 0;
  state.ingTotal = 0;
  var __ingN = INGREDIENT_LEVELS[level] || 0;
  for (var __gi = 0; __gi < __ingN; __gi++) {
    var __gr, __gc, __gt = 0;
    do { __gr = Math.floor(Math.random() * 3); __gc = Math.floor(Math.random() * COLS); __gt++; } while (__usedCells[__gr + "," + __gc] && __gt < 40);
    if (__gt >= 40) break;
    __usedCells[__gr + "," + __gc] = true;

  var __inv = getDailyInv();
  var __invChanged = false;
  if (__inv.eagle > 0 && !eagleOnBoard()) { __placeSpecial("eagle"); __inv.eagle--; __invChanged = true; }
  while (__inv.bomb > 0 && bombsOnBoard() < 2) { __placeSpecial("bomb"); __inv.bomb--; __invChanged = true; }
  while (__inv.rainbow > 0 && rainbowsOnBoard() < 2) { __placeSpecial("rainbow", "rainbow"); __inv.rainbow--; __invChanged = true; }
  if (__inv.moves > 0) { state.moves += __inv.moves; __inv.moves = 0; __invChanged = true; }
  if (__invChanged) saveDailyInv(__inv);
  boardEl.innerHTML = "";

/* Win drop: when a level is cleared, EVERY tile falls all the way down
   and out of the board (to row ROWS+2, fully below the frame, clipped away
   by overflow:hidden), so the board ends up empty. Delay grows upward
   (bottom row first, top last) plus a tiny random jitter, so it drains
   like a wave. Ease-in (accelerating, like real gravity). One Minecraft
   glass break shatter as everything falls. The next level rebuilds the
   board, so nothing persists. */
function dropTilesAtWin() {
  AudioEng.sfx("glass"); /* one shatter as the tiles fall out */
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var el = tileEl(r, c);
      if (!el) continue;
      var dist = (ROWS + 2) - r; /* fall all the way out below the board */
      var dur = 0.4 + dist * 0.05;
      var delay = (ROWS - 1 - r) * 0.06 + Math.random() * 0.05;
      el.style.transition = "transform " + dur + "s cubic-bezier(.45,.05,.75,.4) " + delay + "s";
      positionEl(el, ROWS + 2, c);
    }
  }
}
function endLevel(won) {
  state.over = true;
  stopTimer();
  stopHintTimer();
  stopCandyRain(); /* v31.89: dung mua keo khi het man */
  var isBest = state.score > state.best;
  if (isBest) {
    state.best = state.score;
    __previewStore.setItem("animalCrushBest", String(state.best));
  }
  if (won) {
    dropTilesAtWin(); /* tiles fall all the way out + glass shatter */
    celebrateWin();
    AudioEng.sfx("applause"); /* clapping when a level is cleared */
    if (state.level >= state.maxLevel) {
      state.maxLevel = state.level + 1;
      __previewStore.setItem("animalCrushMaxLevel", String(state.maxLevel));
    }
    __previewStore.setItem("animalCrushLevel", String(state.level + 1));
    showToast(t("nice"));
    if (stickerUnlock(state.level)) showToast("📕 " + (LANG === "vi" ? "Sticker mới đã mở!" : "New sticker unlocked!"));
    awardStamp(); /* v31.96: thang 1 man/ngay duoc 1 tem; du 6 tem mo ruong */
  } else {
    AudioEng.sfx("lose");
  }
  updateHUD();
  if (won) {
    /* win: celebrate, then the bouncing train carries us to the next level, which opens by itself */
    setTimeout(function() { showTransition(state.level); }, 2700);
  } else {

  }
}

var FB_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/animal-crush.json";
var LS_BOARD = "animalCrushBoardV1";
var cachedBoard = null;
function normalizeBoard(data) {
  if (!data) return [];
  var arr = Array.isArray(data) ? data : Object.keys(data).sort(function(a,b){ return a-b; }).map(function(k){ return data[k]; });
  return arr.filter(function(x){ return x && typeof x.score === "number"; })
    .sort(function(a,b){ return b.score - a.score; }).slice(0, 10);
}
function getBoard() {
  if (cachedBoard) return Promise.resolve(cachedBoard.slice());
  return fetch(FB_URL).then(function(r){ return r.json(); }).then(function(data) {
    cachedBoard = normalizeBoard(data);
    return cachedBoard.slice();
  }).catch(function() {
    try { cachedBoard = normalizeBoard(JSON.parse(__previewStore.getItem(LS_BOARD) || "[]")); }
    catch (e) { cachedBoard = []; }
    return cachedBoard.slice();
  });
}
function saveToBoard(entry) {
  var list = (cachedBoard || []).slice();
  list.push(entry);
  list.sort(function(a,b){ return b.score - a.score; });
  list = list.slice(0, 10);
  cachedBoard = list;
  try { __previewStore.setItem(LS_BOARD, JSON.stringify(list)); } catch (e) {}
  return fetch(FB_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(list) })
    .catch(function() { /* offline: local copy already saved */ });
}
function lbHtml(list) {
  var html = "<h2 style=\"font-size:20px; margin-bottom:6px;\">🏆 " + t("leaderboard") + " - " + t("top10") + "</h2>";
  if (!list.length) return html + "<p>" + t("noScores") + "</p>";
  list.forEach(function(e, i) {
    var crown = i === 0 ? "<span class=\"lb-crown\">👑</span> " : "";
    var title = i === 0 ? "<div class=\"lb-title\">" + t("champion") + "</div>" : "";
    html += "<div class=\"lb-row\"><span class=\"rank\">" + (i + 1) + ".</span><span>" + crown + escapeHtml(e.name) + "</span><span><b>" + e.score + "</b></span></div>" + title;
  });
  return html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderHowto() {
  var raw = t("howto");

  out += '<div class="howto-rules">';
  parts.forEach(function(line, i) {
    var m = line.match(/^\s*(\d+)\.\s*([\s\S]*)$/);
    if (!m) { out += '<div class="rule"><span>' + line + "</span></div>"; return; }
    out += '<div class="rule"><span class="num" style="background:' + colors[i % colors.length] + ';">' + m[1] + "</span><span>" + m[2] + "</span></div>";

function syncMusicBtns() {

/* The speaker button should START the music when tapped on the start screen,
   not mute it: on a fresh page the first tap anywhere starts the music via the
   document pointerdown listener, so a plain toggle here would instantly mute
   the song An just started. Record whether music was already playing before
   this tap (the button's pointerdown fires before the document one). */
var musicWasStartedBeforeTap = false;
function recordMusicStateBeforeTap() { musicWasStartedBeforeTap = musicStarted; }
function speakerClick() {
  AudioEng.unlock();
  if (!musicWasStartedBeforeTap) {
    /* This tap just started the music: keep it ON. */
    if (!AudioEng.isMusicOn()) AudioEng.toggleMusic();
  } else {
    AudioEng.toggleMusic();
  }
  syncMusicBtns();
}
document.getElementById("musicBtnStart").addEventListener("pointerdown", recordMusicStateBeforeTap);
document.getElementById("musicBtnStart").addEventListener("click", speakerClick);
/* v31.97e: homeBtn removed — settings buttons gone from the HUD; use hubBtn (←) to exit to the hub. */

/* Music starts on the very first tap anywhere (browsers block audio until the
   user interacts), so the start screen has music too and it plays through the
   whole game: start screen, gameplay, win celebration, transition, end screen. */
var musicStarted = false;
function startMusicOnFirstTap() {
  if (musicStarted) return;
  musicStarted = true;
  AudioEng.unlock();
  AudioEng.startMusic();
}
document.addEventListener("pointerdown", startMusicOnFirstTap);

/* PREVIEW ONLY — ?level=N debug jump (strip on ship) */
(function previewLevelJump() {
  /* An (2026-11-14 23:15): she does not want to play through to L10 just to
     see the L10 fix — open ?level=N (1-50) to jump straight to that level.
     Goes through the NORMAL flow: story card first if the chapter is unseen
     (she taps "Choi ngay" once), then startLevel(N). Invalid N (out of
     range / not a plain integer) = load normally. */
  var m = /[?&]level=(\d+)(?:&|$)/.exec(location.search);
  if (!m) return;
  var n = parseInt(m[1], 10);
  if (isNaN(n) || n < 1 || n > 50) return;
  if (n > state.maxLevel) {
    state.maxLevel = n;
    __previewStore.setItem("animalCrushMaxLevel", String(n));
  }
  maybeShowStory(n, function() { startLevel(n); });
})();
/* END PREVIEW ONLY — ?level=N debug jump */
