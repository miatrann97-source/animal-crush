<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Crush</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #ff2d78, #ff9500, #ffe600, #2ed573, #00d2ff, #7c4dff, #ff2d78, #ff6b9d);
  background-size: 400% 400%;
  animation: bgShift 8s ease infinite;
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center;
  color:#3a2b1f; overflow-x:hidden;
  user-select:none; -webkit-user-select:none;
}
@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
/* ---------- Lively background decor (behind everything, never blocks taps) ---------- */
#bgDecor { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.screen { position:relative; z-index:1; }
.bg-float {
  position:absolute; bottom:-12vh; display:block; pointer-events:none;
  will-change: transform, opacity;
  animation: floatUp var(--rise, 18s) linear infinite;
}
.bg-float.twinkle { animation: floatUp var(--rise, 18s) linear infinite, twinkle 1.6s ease-in-out infinite alternate; }
@keyframes floatUp {
  0% { transform: translateY(0) rotate(0deg); opacity:0; }
  8% { opacity:.9; }
  85% { opacity:.9; }
  100% { transform: translateY(-125vh) rotate(300deg); opacity:0; }
}
@keyframes twinkle { from { opacity:.35; } to { opacity:1; } }
h1 { font-size: clamp(30px, 8vw, 46px); color:#ff6b9d; text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,.12); letter-spacing:1px; }
h2 { font-size: clamp(20px, 5.5vw, 28px); color:#7c4dff; }
button {
  font-family: inherit; cursor:pointer; border:none; border-radius: 999px;
  padding: 12px 26px; font-size: 18px; font-weight: bold; color:#fff;
  background: linear-gradient(180deg, #ff8fb3, #ff5c8a);
  box-shadow: 0 4px 0 #d63d68, 0 6px 12px rgba(0,0,0,.18);
  transition: transform .08s ease, box-shadow .08s ease;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d63d68; }
button.small { padding: 8px 16px; font-size: 15px; }
button.green { background: linear-gradient(180deg, #7ee081, #43b581); box-shadow: 0 4px 0 #2e8b57, 0 6px 12px rgba(0,0,0,.18); }
button.green:active { box-shadow: 0 1px 0 #2e8b57; }
button.blue { background: linear-gradient(180deg, #7cc4ff, #3f8cff); box-shadow: 0 4px 0 #2b62b8, 0 6px 12px rgba(0,0,0,.18); }
button.blue:active { box-shadow: 0 1px 0 #2b62b8; }
button.ghost { background:#fff; color:#7c4dff; box-shadow: 0 4px 0 #d9d2ff; }
button:disabled { opacity:.55; cursor:default; }
.screen { width:100%; max-width:520px; padding: 14px 12px 28px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.hidden { display:none !important; }

/* ---------- Start screen ---------- */
#startScreen { text-align:center; }
.logo-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin: 6px 0; }
.logo-row img { width:56px; height:56px; border-radius:16px; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.tagline { font-size:17px; color:#5a4632; }
.card {
  background: rgba(255,255,255,.92); border-radius: 20px; padding: 16px 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,.12); width:100%;
}
.howto { text-align:left; font-size:16px; line-height:1.75; }
.howto b { color:#ff5c8a; }
.visit-count { font-size:15px; color:#6b5a4a; }
.best-line { font-size:16px; font-weight:bold; color:#7c4dff; }
.level-info { font-size:16px; font-weight:bold; color:#ff5c8a; }

/* ---------- HUD ---------- */
#hud {
  width:100%; background: rgba(255,255,255,.92); border-radius: 18px;
  padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  display:flex; flex-direction:column; gap:8px;
}
.hud-row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.hud-stat { font-size:15px; line-height:1.35; }
.hud-stat b { font-size:19px; color:#ff5c8a; }
.hud-stat .target { color:#7c4dff; }
.hud-btns { display:flex; gap:6px; }
.icon-btn {
  padding:6px 10px; font-size:15px; border-radius:12px; min-width:40px;
  background:#fff; color:#5a4632; box-shadow: 0 3px 0 #e0d8d0;
}
.progress { height:12px; background:#f0e6da; border-radius:999px; overflow:hidden; }
#progressFill { height:100%; width:0%; background: linear-gradient(90deg, #ffb347, #ff5c8a); border-radius:999px; transition: width .3s ease; }

/* ---------- Board ---------- */
#boardWrap { width:100%; max-width:480px; position:relative; }
#board {
  position:relative; width:100%; aspect-ratio: 1 / 1;
  background: linear-gradient(135deg, rgba(255,107,157,.85), rgba(255,165,2,.85), rgba(46,213,115,.85), rgba(30,144,255,.85));
  border-radius:18px;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), 0 8px 20px rgba(0,0,0,.25);
  overflow:hidden; touch-action:none;
}
.tile {
  position:absolute; left:0; top:0; width:12.5%; height:12.5%; padding:2px;
  transition: transform .22s ease;
  will-change: transform;
}
.tile .inner {
  width:100%; height:100%; border-radius:14%; overflow:hidden; position:relative;
  box-shadow: 0 2px 5px rgba(0,0,0,.22);
  transition: transform .15s ease, opacity .18s ease;
}
.tile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.tile.selected .inner { outline:3px solid #ffcf3f; outline-offset:-1px; transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 14px #ffcf3f; z-index:5; }
.tile.pop .inner { transform: scale(.1); opacity:0; }
/* match bounce: matched tiles hop up and down happily before they pop.
   Runs on the outer .tile via the `translate`/`scale` properties, so it
   composes with the inline grid-position transform (no layout shift). */
.tile.match-bounce { animation: matchBounce .21s ease-out; }
@keyframes matchBounce {
  0% { translate: 0 0; scale: 1 1; }
  30% { translate: 0 -32%; scale: .94 1.08; }
  55% { translate: 0 0; scale: 1.09 .85; }
  75% { translate: 0 -12%; scale: .97 1.04; }
  100% { translate: 0 0; scale: 1 1; }
}
.tile.new .inner { animation: dropIn .25s ease; }
@keyframes dropIn { from { transform: translateY(-30%) scale(.8); } to { transform: none; } }
/* hint: pulsing yellow outline on the two swappable tiles */
.tile.hint .inner { outline:3px solid #ffe45e; outline-offset:-1px; box-shadow: 0 0 0 3px #fff, 0 0 18px #ffe45e; animation: hintPulse .7s ease-in-out infinite; z-index:4; }
@keyframes hintPulse { 0%,100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.12); filter: brightness(1.3); } }
/* water ripple on tile touch (about 2s) */
.tile .ripple { position:absolute; inset:0; pointer-events:none; z-index:4; overflow:hidden; border-radius:14%; }
.tile .ripple::before { content:""; position:absolute; left:50%; top:50%; width:18%; height:18%; border:3px solid rgba(140,210,255,.95); border-radius:50%; transform: translate(-50%,-50%); animation: rippleRing 2s ease-out forwards; }
.tile .ripple::after { content:""; position:absolute; inset:0; background: radial-gradient(circle at 50% 50%, rgba(120,200,255,.45), rgba(120,200,255,0) 65%); animation: rippleWash 2s ease-out forwards; }
@keyframes rippleRing { 0% { width:18%; height:18%; opacity:.95; } 100% { width:150%; height:150%; opacity:0; } }
@keyframes rippleWash { 0% { opacity:1; } 100% { opacity:0; } }
/* bomb tile: clearly a bomb, not an animal */
.tile.bomb .inner { background: radial-gradient(circle at 35% 30%, #555, #161616 70%); box-shadow: 0 0 0 2px #ffe45e, 0 0 16px #ff9500, 0 2px 5px rgba(0,0,0,.22); animation: bombPulse 1s ease-in-out infinite; }
@keyframes bombPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
.bomb-emoji { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: clamp(26px, 8vw, 42px); pointer-events:none; }
.bomb-spark { position:absolute; right:4px; top:0; font-size: clamp(12px, 3.5vw, 18px); color:#ffe45e; text-shadow: 0 0 8px #ff9500; animation: sparkBlink .3s ease-in-out infinite alternate; pointer-events:none; }
@keyframes sparkBlink { from { opacity:.4; transform: scale(.8) rotate(-10deg); } to { opacity:1; transform: scale(1.2) rotate(10deg); } }
#bombDragEl { position:fixed; z-index:100; pointer-events:none; font-size:52px; transform: translate(-50%,-50%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
.tile.bomb-target .inner { outline:3px solid #ff5c5c; outline-offset:-1px; box-shadow: 0 0 0 3px #fff, 0 0 18px #ff5c5c; }
/* low time warning */
.hud-stat.low b { color:#ff2d55; animation: timeBlink 1s ease-in-out infinite; }
@keyframes timeBlink { 0%,100% { opacity:1; } 50% { opacity:.45; } }
/* level transition screen with the bouncing animal train over a doodle sky.
   The 6 heads travel left to right like a train (6s loop) while each head hops
   high like a ball (0.9s per head, neighbours offset 0.15s so the wave rolls
   across the train). Each hop squashes on landing, stretches on takeoff, and
   leaves a glowing light trail in its own color under it. --ths is the head
   size, sized to the 440px card so the train fits on desktop and phone. */
#transitionScreen { position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, rgba(255,45,120,.88), rgba(255,149,0,.88), rgba(0,210,255,.88)); padding:16px; --ths: clamp(40px, 12.5vw, 64px); }
#transitionScreen.hidden { display:none !important; }
.trans-card { background: rgba(255,255,255,.94); border-radius:24px; padding:22px 18px; width:100%; max-width:440px; text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.trans-card h2 { font-size: clamp(22px, 6vw, 30px); }
.trans-card p { font-size:17px; }
.trans-track { width:100%; height:calc(var(--ths) * 2.15 + 48px); position:relative; overflow:hidden; border-radius:16px; background: linear-gradient(180deg, #bfe9ff, #e8f9ff 60%, #cdeed9); }
.trans-doodles { position:absolute; inset:0; z-index:1; opacity:.55; pointer-events:none; }
.trans-doodles svg { width:100%; height:100%; display:block; }
.trans-ground { position:absolute; left:0; right:0; bottom:0; height:26px; background: linear-gradient(180deg, #9ed69e, #7cc47c); border-top:3px solid #ffffff; z-index:0; }
.trans-row { position:absolute; left:0; right:0; bottom:26px; z-index:2; display:flex; justify-content:space-evenly; align-items:flex-end; padding:0 6px; animation: transTrain 6s linear infinite; }
@keyframes transTrain { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.trans-spot { position:relative; width:var(--ths); height:calc(var(--ths) * 2.15); flex:0 1 auto; }
.trans-shadow { position:absolute; left:12%; bottom:0; width:76%; height:10px; background:rgba(46,90,40,.28); border-radius:50%; animation: transShadow 0.9s linear infinite; animation-delay: var(--d); }
.trans-trail { position:absolute; left:30%; bottom:0; width:40%; height:calc(var(--ths) * 1.05); border-radius:999px 999px 0 0; background: linear-gradient(180deg, var(--c2) 0%, var(--c) 45%, transparent 100%); box-shadow: 0 0 18px 4px var(--c); filter: blur(2px); opacity:0; transform: scaleY(0.04); transform-origin:50% 100%; animation: transTrail 0.9s linear infinite; animation-delay: var(--d); }
.trans-head { position:absolute; left:0; bottom:0; width:100%; height:var(--ths); font-size:var(--ths); transform-origin:50% 100%; animation: transHop 0.9s linear infinite; animation-delay: var(--d); }
.trans-head img { width:100%; height:100%; display:block; }

  94% { transform: scaleY(0.04); opacity: 0; }
  96% { transform: scaleY(0.04); opacity: 0; }
  98% { transform: scaleY(0.04); opacity: 0; }

/* special overlays */
.tile .badge {

}
.tile.striped-h .inner::after {

  background: repeating-linear-gradient(0deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.striped-v .inner::after {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.wrapped .inner { box-shadow: 0 0 0 2px #ffd23f, 0 0 14px #ffd23f, 0 2px 5px rgba(0,0,0,.22); animation: wrapPulse .8s ease-in-out infinite; }
@keyframes wrapPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.tile.rainbow .inner {
  box-shadow: 0 0 0 2px #fff, 0 0 16px #b06bff, 0 2px 5px rgba(0,0,0,.22);

.float-score {

/* ---------- Explosion & lightning FX ---------- */
#board.shake { animation: boardShake .55s ease; }
@keyframes boardShake {
  0%, 100% { transform: translate(0,0); }
  20% { transform: translate(-24px, 14px); }
  40% { transform: translate(24px, -14px); }
  60% { transform: translate(-19px, -12px); }
  80% { transform: translate(17px, 12px); }
}
/* ---------- Whole-screen shake (scaled by match size) ---------- */
#gameScreen.shake-sm { animation: shakeSm .5s ease; }
#gameScreen.shake-md { animation: shakeMd .6s ease; }
#gameScreen.shake-lg { animation: shakeLg .75s ease; }
#gameScreen.shake-xl { animation: shakeXl .85s ease; }
@keyframes shakeSm { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-10px,5px); } 50% { transform: translate(10px,-5px); } 75% { transform: translate(-7px,-5px); } }
@keyframes shakeMd { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-18px,10px); } 40% { transform: translate(18px,-10px); } 60% { transform: translate(-15px,-10px); } 80% { transform: translate(15px,10px); } }
@keyframes shakeLg { 0%,100% { transform: translate(0,0); } 15% { transform: translate(-28px,16px) rotate(-2deg); } 30% { transform: translate(28px,-16px) rotate(2deg); } 45% { transform: translate(-23px,-14px) rotate(-1.5deg); } 60% { transform: translate(23px,14px) rotate(1.5deg); } 75% { transform: translate(-16px,10px); } 90% { transform: translate(14px,-10px); } }
@keyframes shakeXl { 0%,100% { transform: translate(0,0); } 12% { transform: translate(-36px,20px) rotate(-2.5deg); } 24% { transform: translate(36px,-20px) rotate(2.5deg); } 36% { transform: translate(-30px,-18px) rotate(-2deg); } 48% { transform: translate(30px,18px) rotate(2deg); } 60% { transform: translate(-24px,14px) rotate(-1.5deg); } 72% { transform: translate(22px,-12px) rotate(1.5deg); } 84% { transform: translate(-14px,8px); } }
/* ---------- Win celebration ---------- */
#celebrate { position:fixed; inset:0; z-index:60; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; overflow:hidden; }
#celebrate.hidden { display:none !important; }
.celeb-shark { width: min(260px, 58vw); height: auto; animation: sharkJump .55s ease-in-out infinite alternate; filter: drop-shadow(0 8px 16px rgba(0,0,0,.3)); }
@keyframes sharkJump { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-20px) rotate(4deg) scale(1.04); } }
.celeb-text { font-size: clamp(38px, 11vw, 64px); font-weight:900; color:#ffcf3f; text-shadow: 3px 3px 0 #fff, 0 0 24px #ff9d00, 0 6px 14px rgba(0,0,0,.35); animation: celebPop .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes celebPop { 0% { transform: scale(.2) rotate(-8deg); opacity:0; } 60% { transform: scale(1.15) rotate(2deg); opacity:1; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.celeb-stars { display:flex; gap:10px; }
.celeb-stars .star { font-size: clamp(40px, 12vw, 64px); color:#ffd23f; text-shadow: 0 0 16px #ff9d00, 2px 2px 0 #fff; animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes starPop { 0% { transform: scale(0) rotate(-30deg); opacity:0; } 100% { transform: scale(1) rotate(0); opacity:1; } }
.confetti-piece { position:absolute; top:-14px; pointer-events:none; will-change: transform; }
.tile.dance .inner { animation: tileDance .5s ease-in-out infinite alternate; }
@keyframes tileDance { from { transform: translateY(0) rotate(-4deg) scale(1); } to { transform: translateY(-6px) rotate(4deg) scale(1.08); } }
#fxLayer { position:absolute; inset:0; z-index:25; pointer-events:none; border-radius:18px; }
/* no overflow:hidden here on purpose: explosion debris must fly out across the whole screen */
.particle { position:absolute; border-radius:50%; pointer-events:none; will-change: transform, opacity; }
.particle.confetti { border-radius:2px; }
.particle.droplet { border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
.fx-flash-screen { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:45; }
.boom-text {
  position:absolute; z-index:26; font-weight:900; font-size:120px; color:#ffcf3f;
  text-shadow: 3px 3px 0 #fff, 0 0 26px #ff9d00, 0 6px 12px rgba(0,0,0,.35);
  pointer-events:none; white-space:nowrap; transform: translate(-50%,-50%);
}
.fx-flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
.fx-bolt { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #ffe45e); }
/* striped-candy beam: white-hot core with a warm gold glow, sweeping out from the candy */
.fx-beam { position:absolute; z-index:24; pointer-events:none; }
.fx-beam.h { left:0; width:100%; height:12.5%; background: linear-gradient(180deg, rgba(255,190,0,0) 0%, rgba(255,210,60,.8) 16%, #fffbe8 40%, #ffffff 50%, #fffbe8 60%, rgba(255,210,60,.8) 84%, rgba(255,190,0,0) 100%); box-shadow: 0 0 16px 5px rgba(255,200,40,.8), 0 0 42px 12px rgba(255,170,0,.4); animation: beamSweepX .34s ease-out forwards; }
.fx-beam.v { top:0; height:100%; width:12.5%; background: linear-gradient(90deg, rgba(255,190,0,0) 0%, rgba(255,210,60,.8) 16%, #fffbe8 40%, #ffffff 50%, #fffbe8 60%, rgba(255,210,60,.8) 84%, rgba(255,190,0,0) 100%); box-shadow: 0 0 16px 5px rgba(255,200,40,.8), 0 0 42px 12px rgba(255,170,0,.4); animation: beamSweepY .34s ease-out forwards; }
@keyframes beamSweepX { 0% { transform: scaleX(0); opacity:.55; } 45% { transform: scaleX(1); opacity:1; } 100% { transform: scaleX(1); opacity:0; } }
@keyframes beamSweepY { 0% { transform: scaleY(0); opacity:.55; } 45% { transform: scaleY(1); opacity:1; } 100% { transform: scaleY(1); opacity:0; } }
/* rainbow lightning: blue-white electric bolts, clearly different from the warm gold beam */
.fx-bolt-blue { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; filter: drop-shadow(0 0 6px #7dd3fc) drop-shadow(0 0 14px #38bdf8); }
/* tiles caught in a beam or a lightning zap flash bright white before they pop */
.tile.beam-flash .inner { animation: tileFlash .3s ease-out both; }
@keyframes tileFlash { 0% { filter: brightness(1); } 30% { filter: brightness(2.6) saturate(.3); } 100% { filter: brightness(2.2) saturate(.4); } }
/* bold gold per-tile score numbers, like the "60" in Candy Crush */
.fx-tile-score { position:absolute; z-index:27; font-weight:900; font-size: clamp(15px, 4.5vw, 24px); color:#ffb400; text-shadow: 0 0 4px #fff, 0 0 10px #ffd23f, 1px 2px 0 rgba(120,60,0,.55); pointer-events:none; transform: translate(-50%,-50%); animation: tileScorePop .7s ease-out forwards; }
@keyframes tileScorePop { 0% { opacity:0; transform: translate(-50%,-50%) scale(.5); } 25% { opacity:1; transform: translate(-50%,-60%) scale(1.2); } 100% { opacity:0; transform: translate(-50%,-160%) scale(1); } }
#toast {
  position:absolute; left:50%; top:38%; transform: translateX(-50%);
  background: rgba(60,30,60,.88); color:#fff; font-size:18px; font-weight:bold;
  padding: 10px 18px; border-radius: 999px; z-index:30; pointer-events:none;
  opacity:0; transition: opacity .25s ease; white-space:nowrap;
}
#toast.show { opacity:1; }

/* ---------- Leaderboard ---------- */
#boardPanel { width:100%; }
.lb-row { display:flex; justify-content:space-between; font-size:16px; padding:5px 4px; border-bottom:1px dashed #e8dccf; }
.lb-row.me { background:#fff3d6; border-radius:8px; font-weight:bold; }

input[type=text] {

  border:2px solid #ffd3e2; width: 150px; outline:none; text-align:center;
}
input[type=text]:focus { border-color:#ff5c8a; }

/* ---------- End screen ---------- */
#endScreen {
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background: rgba(40,20,50,.55); padding: 16px;

.end-card {

  .hud-stat { font-size:13px; } .hud-stat b { font-size:17px; }
  button { font-size:16px; padding: 11px 20px; }
}

/* Hop the given cells happily, then pop them. Total ~230ms, barely longer than
   the old 210ms pop window: the bounce gets an 80ms head start at full size,
   then the pop shrinks the tile while it lands. */
async function bounceThenPop(cells) {
  cells.forEach(function(cell) {
    var el = tileEl(cell[0], cell[1]);
    if (el) el.classList.add("match-bounce");
  });
  await sleep(80);
  cells.forEach(function(cell) {
    var el = tileEl(cell[0], cell[1]);
    if (el) el.classList.add("pop");
  });
  await sleep(150);
}

/* Resolve all matches until the board settles. Returns total points earned. */
async function resolveBoard(swapPos) {
  var total = 0, cascade = 0;
  while (true) {
    var found = findMatches(state.board);
    if (found.runs.length === 0) break;
    cascade++;
    var mult = cascade;
    var clearCells = [];
    var specialsToMake = [];
    var wrappedKeys = {};
    found.wrapped.forEach(function(w) { wrappedKeys[w[0] + "," + w[1]] = true; });
    var runCells = {};
    found.runs.forEach(function(run) {
      run.cells.forEach(function(cell) { runCells[cell[0] + "," + cell[1]] = run; });
    });
    /* Decide specials: wrapped at intersections, rainbow for 5, striped for 4 */
    found.runs.forEach(function(run) {
      var spot = null;
      if (swapPos) {
        run.cells.forEach(function(cell) { if (cell[0] === swapPos[0] && cell[1] === swapPos[1]) spot = cell; });
      }
      if (!spot) spot = run.cells[Math.floor(run.cells.length / 2)];
      if (wrappedKeys[spot[0] + "," + spot[1]]) {
        specialsToMake.push({ cell: spot, kind: "wrapped" });
      } else if (run.len >= 5) {
        specialsToMake.push({ cell: spot, kind: "rainbow" });
      } else if (run.len === 4) {
        specialsToMake.push({ cell: spot, kind: run.horiz ? "h" : "v" });
      }
    });
    /* Wrapped specials take priority over striped/rainbow at the same cell */
    var specialAt = {};
    specialsToMake.forEach(function(s) { specialAt[s.cell[0] + "," + s.cell[1]] = s.kind; });
    found.runs.forEach(function(run) {
      run.cells.forEach(function(cell) {
        var key = cell[0] + "," + cell[1];
        if (specialAt[key]) return; /* keep this cell for the special */
        clearCells.push(cell);
      });
    });
    /* Score the matched runs (full run length, including the special cell) */
    var stepScore = 0;
    found.runs.forEach(function(run) { stepScore += run.len * rateFor(run.len); });
    /* Expand with special effects */
    var expanded = expandClear(clearCells);
    var extraCells = Object.keys(expanded.cells).filter(function(k) { return !clearCells.some(function(cc){ return cc[0] + "," + cc[1] === k; }); });
    stepScore += extraCells.length * 60;
    stepScore *= mult;
    total += stepScore;
    state.score += stepScore;
    updateHUD();
    showFloatScore(stepScore, clearCells);
    /* Play effects: every match gets a crisp crack sound, plus visuals scaled by size */
    AudioEng.sfx("crack");
    if (expanded.effects.indexOf("rainbow") >= 0) AudioEng.sfx("rainbow");
    else if (expanded.effects.indexOf("wrapped") >= 0) AudioEng.sfx("wrapped");
    else if (expanded.effects.indexOf("striped") >= 0) AudioEng.sfx("striped");
    /* Every match gets visuals: 3-match sparkles + lightning, 4+ big boom, 5+ big lightning */
    var biggest = 0;
    found.runs.forEach(function(run) {
      if (run.len > biggest) biggest = run.len;
      var cell0 = run.cells[0];
      var tl0 = state.board[cell0[0]] && state.board[cell0[0]][cell0[1]];
      var type = tl0 ? tl0.type : "fox";
      if (run.len >= 4) {
        explosionAt(run.cells, type);
        if (run.len >= 5) {
          lightningTo([run.cells[0], run.cells[Math.floor(run.cells.length / 2)], run.cells[run.cells.length - 1]]);
        } else {
          lightningTo([run.cells[0], run.cells[run.cells.length - 1]]);
        }
      } else {
        smallMatchFx(run.cells, type);
      }
    });
    /* Water chime: matched tiles ring like a glass harp the moment they find each other.
       Pitch rises with match size; each cascade round climbs one step higher. */
    AudioEng.sfx("chime", { biggest: biggest, wrapped: found.wrapped.length > 0, cascade: cascade });
    /* Cells cleared by special effects burst in their own tile colors too */
    if (extraCells.length) burstCells(extraCells.map(function(k){ return k.split(",").map(Number); }), 10, 200);
    /* Striped beams sweep their row/column; rainbow lightning arcs to its targets.
       Per-tile numbers use the real points for that tile (its run rate, else 60). */
    var tilePts = {};
    found.runs.forEach(function(run) { run.cells.forEach(function(cell) { tilePts[cell[0] + "," + cell[1]] = rateFor(run.len); }); });
    extraCells.forEach(function(k) { if (!tilePts[k]) tilePts[k] = 60; });
    var ptsFor = function(cell) { return tilePts[cell[0] + "," + cell[1]] || 60; };
    expanded.beams.forEach(function(bm) { stripedBeam(bm, ptsFor); });
    expanded.rainbows.forEach(function(rb) { rainbowLightning(rb.from, rb.cells, ptsFor); });
    /* Whole-screen shake scaled by the biggest match this step */
    if (biggest >= 5 || expanded.effects.length) shakeScreen("lg");
    else if (biggest === 4) shakeScreen("md");
    else shakeScreen("sm");
    /* Special activations strike lightning at the special tiles (at least 2 bolts) */
    if (expanded.strikes && expanded.strikes.length) {
      var boltCells = expanded.strikes.slice();
      if (boltCells.length < 2 && clearCells.length) {
        boltCells.push(clearCells[Math.floor(Math.random() * clearCells.length)]);
      }
      lightningTo(boltCells);
    }
    /* Bounce the matched tiles happily, then pop them */
    var keys = Object.keys(expanded.cells);
    await bounceThenPop(keys.map(function(k) { return expanded.cells[k]; }));
    keys.forEach(function(k) {
      var cell = expanded.cells[k];
      var tl = state.board[cell[0]][cell[1]];
      if (tl) { removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
    });
    /* Place the new specials */
    specialsToMake.forEach(function(s) {
      var cell = s.cell;
      var tl = state.board[cell[0]][cell[1]];
      if (tl) {
        tl.special = s.kind;
        if (s.kind === "rainbow") tl.type = "rainbow";
        refreshTileEl(tl, cell[0], cell[1]);
      }
    });
    /* Drop + refill */
    dropAndRefill();
    renderBoard(false);
    await sleep(240);
    /* Wrapped second explosion at the same spots */
    if (expanded.wrappedHits.length) {
      var second = [];
      expanded.wrappedHits.forEach(function(w) {
        for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
          var nr = w[0] + dr, nc = w[1] + dc;
          if (inBoard(nr, nc) && state.board[nr][nc]) second.push([nr, nc]);
        }
      });
      if (second.length) {
        var s2 = second.length * 60 * mult;
        total += s2; state.score += s2; updateHUD();
        showFloatScore(s2, second);
        AudioEng.sfx("wrapped");
        explosionAt(expanded.wrappedHits, "fox", { text: false, count: 10, color: "#ffd23f" });
        await bounceThenPop(second);
        second.forEach(function(cell) {
          var tl = state.board[cell[0]][cell[1]];
          if (tl) { removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
        });
        dropAndRefill();
        renderBoard(false);
        await sleep(240);
      }
    }
    swapPos = null;
    if (state.over) break;
  }
  return total;
}

/* Would placing `type` at (r,c) instantly complete a 3-match? (spawn must never do that) */
function makesInstantMatch(r, c, type) {
  var b = state.board;
  function isT(rr, cc) { return inBoard(rr, cc) && b[rr][cc] && b[rr][cc].type === type; }
  if (isT(r, c-1) && isT(r, c-2)) return true;
  if (isT(r, c+1) && isT(r, c+2)) return true;
  if (isT(r, c-1) && isT(r, c+1)) return true;
  if (isT(r-1, c) && isT(r-2, c)) return true;
  if (isT(r+1, c) && isT(r+2, c)) return true;
  if (isT(r-1, c) && isT(r+1, c)) return true;
  return false;
}
/* Pick a refill type biased toward matching an already-placed orthogonal neighbour,
   so new tiles often land next to a friend and matches keep forming. Never an instant match. */
function pickRefillType(r, c) {
  var b = state.board;
  if (Math.random() < 0.5) {
    var opts = [];
    [[r+1,c],[r+2,c],[r,c-1],[r,c-2]].forEach(function(p) {
      var tl = inBoard(p[0], p[1]) && b[p[0]][p[1]];
      if (tl && tl.type !== "rainbow" && tl.type !== "bomb") opts.push(tl.type);
    });
    for (var i = opts.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
    }
    for (var k = 0; k < opts.length; k++) {
      if (!makesInstantMatch(r, c, opts[k])) return opts[k];
    }
  }
  var type;
  do { type = randType(); } while (makesInstantMatch(r, c, type));
  return type;
}
/* Bomb spawning: at most one bomb on the board, at least 25s after the last one,
   and about a 12% chance per new tile that drops in. */
var lastBombTime = 0;
function bombOnBoard() {
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    var tl = state.board[r] && state.board[r][c];
    if (tl && tl.type === "bomb") return true;
  }
  return false;
}
function maybeBombTile(r, c) {
  if (!bombOnBoard() && Date.now() - lastBombTime > 25000 && Math.random() < 0.12) {
    lastBombTime = Date.now();
    return makeTile("bomb");
  }
  return makeTile(pickRefillType(r, c));
}

function dropAndRefill() {
  for (var c = 0; c < COLS; c++) {
    var write = ROWS - 1;
    for (var r = ROWS - 1; r >= 0; r--) {
      if (state.board[r][c]) {
        if (write !== r) { state.board[write][c] = state.board[r][c]; state.board[r][c] = null; }
        write--;
      }
    }
    for (var r2 = write; r2 >= 0; r2--) {
      state.board[r2][c] = maybeBombTile(r2, c);
    }
  }
}

/* Rainbow swap: clear all tiles of the swapped type */
async function doRainbowSwap(r1, c1, r2, c2) {
  var rb = state.board[r1][c1] && state.board[r1][c1].special === "rainbow" ? [r1, c1] : [r2, c2];
  var other = (rb[0] === r1 && rb[1] === c1) ? [r2, c2] : [r1, c1];
  var otherTile = state.board[other[0]][other[1]];
  var targetType = otherTile ? otherTile.type : null;
  var clearCells = [rb, other];
  if (targetType && targetType !== "rainbow") {
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var tl = state.board[r][c];
      if (tl && tl.type === targetType) clearCells.push([r, c]);
    }
  }
  var chainedBeams = [];
  if (otherTile && otherTile.special && otherTile.special !== "rainbow") {
    /* rainbow + special: also trigger that special's effect */
    var exp = expandClear([other]);
    Object.keys(exp.cells).forEach(function(k) { clearCells.push(exp.cells[k]); });
    chainedBeams = exp.beams;
  }
  var uniq = {}, list = [];
  clearCells.forEach(function(cell) { var k = cell[0] + "," + cell[1]; if (!uniq[k]) { uniq[k] = true; list.push(cell); } });
  var pts = list.length * 60;
  state.score += pts; updateHUD();
  showFloatScore(pts, list);
  AudioEng.sfx("rainbow");
  lightningTo([rb, other]);
  rainbowLightning(rb, list, function() { return 60; });
  chainedBeams.forEach(function(bm) { stripedBeam(bm, function() { return 60; }); });
  burstCells(list, 10, 250); /* rainbow clear bursts in each tile's own color */
  list.forEach(function(cell) { var el = tileEl(cell[0], cell[1]); if (el) el.classList.add("pop"); });
  await sleep(210);
  list.forEach(function(cell) {
    var tl = state.board[cell[0]][cell[1]];
    if (tl) { removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
  });
  dropAndRefill();
  renderBoard(false);
  await sleep(240);
  await resolveBoard(null);
}

/* Player swap attempt */
async function trySwap(r1, c1, r2, c2) {
  if (state.busy || state.over) return;
  if (!inBoard(r2, c2)) return;
  var a = state.board[r1][c1], b = state.board[r2][c2];
  if (!a || !b) return;
  if (a.type === "bomb" || b.type === "bomb") return; /* bombs are dragged to detonate, never swapped */
  state.busy = true;
  state.selected = null; renderSelection();
  /* animate the swap */
  state.board[r1][c1] = b; state.board[r2][c2] = a;
  renderBoard(false);
  AudioEng.sfx("click");
  await sleep(230);
  /* rainbow activation */
  if (a.special === "rainbow" || b.special === "rainbow") {
    state.moves--;
    updateHUD();
    await doRainbowSwap(r1, c1, r2, c2);
    afterTurn();
    state.busy = false;
    return;
  }
  var found = findMatches(state.board);
  if (found.runs.length === 0) {
    state.board[r1][c1] = a; state.board[r2][c2] = b;
    renderBoard(false);
    AudioEng.sfx("invalid");
    await sleep(230);
    state.busy = false;
    return;
  }
  state.moves--;
  updateHUD();
  await resolveBoard([r2, c2]);
  afterTurn();
  state.busy = false;
}

function afterTurn() {
  updateHUD();
  if (state.score >= state.target) { endLevel(true); return; }
  if (state.timeLeft <= 0) { endLevel(false); return; }
  if (state.moves <= 0) { endLevel(false); return; }
  resetHintTimer();
  if (!hasValidMove(state.board)) {
    showToast(t("shuffle"));
    setTimeout(function() { if (!state.over) shuffleBoard(); }, 900);
  }
}

/* ---------- Bomb power-up: drag the bomb onto any tile to detonate a 5x5 blast ---------- */
var bombDrag = null;
function startBombDrag(e, pos) {
  if (state.busy || state.over) return;
  clearHint();
  bombDrag = { from: pos };
  var el = document.createElement("div");
  el.id = "bombDragEl";
  el.textContent = "💣";
  document.body.appendChild(el);
  moveBombDragEl(e);
  window.addEventListener("pointermove", onBombDragMove);
  window.addEventListener("pointerup", onBombDragEnd, { once: true });
  window.addEventListener("pointercancel", onBombDragEnd, { once: true });
}
function moveBombDragEl(e) {
  var el = document.getElementById("bombDragEl");
  if (el) { el.style.left = e.clientX + "px"; el.style.top = e.clientY + "px"; }
}
function onBombDragMove(e) {
  if (!bombDrag) return;
  moveBombDragEl(e);
  var cell = tileFromEvent(e);
  var prev = document.querySelectorAll(".tile.bomb-target");
  for (var i = 0; i < prev.length; i++) prev[i].classList.remove("bomb-target");
  if (cell) {
    var el = tileEl(cell[0], cell[1]);
    if (el) el.classList.add("bomb-target");
  }
}
function onBombDragEnd(e) {
  window.removeEventListener("pointermove", onBombDragMove);
  var dragEl = document.getElementById("bombDragEl");
  if (dragEl && dragEl.parentNode) dragEl.parentNode.removeChild(dragEl);
  var prev = document.querySelectorAll(".tile.bomb-target");
  for (var i = 0; i < prev.length; i++) prev[i].classList.remove("bomb-target");
  if (!bombDrag) return;
  var from = bombDrag.from;
  bombDrag = null;
  if (state.busy || state.over) return;
  var cell = tileFromEvent(e);
  if (!cell) return; /* released outside the board: the bomb stays where it was */
  if (cell[0] === from[0] && cell[1] === from[1]) return; /* dropped on itself: cancel */
  detonateBomb(cell, from);
}
async function detonateBomb(target, from) {
  if (state.busy || state.over) return;
  state.busy = true;
  clearHint();
  resetHintTimer();
  var cells = {}, list = [];
  function addCell(r, c) {
    if (!inBoard(r, c)) return;
    var k = r + "," + c;
    if (!cells[k]) { cells[k] = [r, c]; list.push([r, c]); }
  }
  for (var dr = -2; dr <= 2; dr++) for (var dc = -2; dc <= 2; dc++) addCell(target[0] + dr, target[1] + dc);
  addCell(from[0], from[1]); /* the bomb itself is consumed */
  var pts = list.length * 60 + 500; /* 60 per cleared tile + 500 bomb bonus */
  state.score += pts;
  updateHUD();
  showFloatScore(pts, list);
  explosionAt(list, "fox", { count: 80, max: 650, text: true });
  shakeScreen("xl");
  flashBoard();
  flashScreen();
  list.forEach(function(cell) { var el = tileEl(cell[0], cell[1]); if (el) el.classList.add("pop"); });
  await sleep(280);
  list.forEach(function(cell) {
    var tl = state.board[cell[0]][cell[1]];
    if (tl) { removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
  });
  lastBombTime = Date.now(); /* next bomb at least 25s after this one */
  dropAndRefill();
  renderBoard(false);
  await sleep(260);
  await resolveBoard(null);
  afterTurn();
  state.busy = false;
}
</script>
<script>
"use strict";
/* ================= Rendering ================= */
var boardEl = document.getElementById("board");
var elsById = {};
function tileEl(r, c) {
  var tl = state.board[r] && state.board[r][c];
  return tl ? elsById[tl.id] : null;
}
function removeTileEl(id) {
  var el = elsById[id];
  if (el && el.parentNode) el.parentNode.removeChild(el);
  delete elsById[id];
}
function specialClass(tl) {
  if (!tl.special) return "";
  if (tl.special === "h") return " striped-h";
  if (tl.special === "v") return " striped-v";
  if (tl.special === "wrapped") return " wrapped";
  if (tl.special === "rainbow") return " rainbow";
  return "";
}
function badgeFor(tl) {
  if (tl.special === "h") return "↔";
  if (tl.special === "v") return "↕";
  if (tl.special === "wrapped") return "🎀";
  if (tl.special === "rainbow") return "🌈";
  return "";
}
function makeTileEl(tl) {
  var div = document.createElement("div");
  div.className = "tile" + specialClass(tl);
  div.dataset.id = tl.id;
  var inner = document.createElement("div");
  inner.className = "inner";
  if (tl.type === "bomb") {
    /* bomb: cartoon black bomb with a sparking fuse, clearly not an animal */
    div.classList.add("bomb");
    var em = document.createElement("span");
    em.className = "bomb-emoji";
    em.textContent = "💣";
    inner.appendChild(em);
    var sp = document.createElement("span");
    sp.className = "bomb-spark";
    sp.textContent = "✦";
    inner.appendChild(sp);
  } else {
    var img = document.createElement("img");
    img.src = tl.type === "rainbow" ? IMG.fox : IMG[tl.type];
    img.alt = tl.type;
    img.draggable = false;
    inner.appendChild(img);
  }
  var badge = badgeFor(tl);
  if (badge) {
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = badge;
    inner.appendChild(b);
  }
  if (tl.type === "rainbow") {
    inner.style.background = "linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1,#84fab0,#8fd3f4)";
  }
  div.appendChild(inner);
  div.addEventListener("pointerdown", function(e) { onTilePointerDown(e, tl); });
  elsById[tl.id] = div;
  return div;
}
function refreshTileEl(tl, r, c) {
  var el = elsById[tl.id];
  if (!el) return;
  el.className = "tile" + specialClass(tl);
  var inner = el.querySelector(".inner");
  var oldBadge = inner.querySelector(".badge");
  if (oldBadge) oldBadge.remove();
  var badge = badgeFor(tl);
  if (badge) {
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = badge;
    inner.appendChild(b);
  }
  var img = inner.querySelector("img");
  if (img) img.src = tl.type === "rainbow" ? IMG.fox : IMG[tl.type];
  inner.style.background = tl.type === "rainbow" ? "linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1,#84fab0,#8fd3f4)" : "";
}
function positionEl(el, r, c) {
  el.style.transform = "translate(" + (c * 100) + "%, " + (r * 100) + "%)";
}
function renderBoard(full) {
  /* sync DOM to model */
  var seen = {};
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var tl = state.board[r][c];
      if (!tl) continue;
      seen[tl.id] = true;
      var el = elsById[tl.id];
      if (!el) {
        el = makeTileEl(tl);
        boardEl.appendChild(el);
        /* new tiles drop in from above */
        var startRow = r - (ROWS - r);
        positionEl(el, startRow, c);
        void el.offsetWidth;
        el.classList.add("new");
      }
      positionEl(el, r, c);
      refreshTileEl(tl, r, c);
    }
  }
  Object.keys(elsById).forEach(function(id) {
    if (!seen[id]) removeTileEl(id);
  });
  if (full) {
    /* snap without transition on a full rebuild */
    Object.keys(elsById).forEach(function(id) {
      var el = elsById[id];
      el.style.transition = "none";
      void el.offsetWidth;
      el.style.transition = "";
    });
  }
}
function renderSelection() {
  Object.keys(elsById).forEach(function(id) { elsById[id].classList.remove("selected"); });
  if (state.selected) {
    var el = tileEl(state.selected[0], state.selected[1]);
    if (el) el.classList.add("selected");
  }
}
/* Water ripple on tile touch: soft expanding ring, about 2s, never blocks taps */
var rippleCount = 0;
function spawnRipple(r, c) {
  if (rippleCount >= 12) return;
  var el = tileEl(r, c);
  if (!el) return;
  var inner = el.querySelector(".inner");
  if (!inner) return;
  var d = document.createElement("div");
  d.className = "ripple";
  inner.appendChild(d);
  rippleCount++;
  setTimeout(function() {
    if (d.parentNode) d.parentNode.removeChild(d);
    rippleCount = Math.max(0, rippleCount - 1);
  }, 2000);
}
function showFloatScore(points, cells) {
  if (!cells || !cells.length) return;
  var sr = 0, sc = 0;
  cells.forEach(function(cell) { sr += cell[0]; sc += cell[1]; });
  sr /= cells.length; sc /= cells.length;
  var div = document.createElement("div");
  div.className = "float-score";
  div.textContent = "+" + points;
  div.style.left = ((sc + 0.5) * 12.5) + "%";
  div.style.top = ((sr + 0.5) * 12.5) + "%";
  boardEl.appendChild(div);
  setTimeout(function() { if (div.parentNode) div.parentNode.removeChild(div); }, 950);
}
/* ================= Explosion & lightning FX ================= */
/* Explosion particle colors: each tile bursts in its own color. Rabbit is soft white/cream

  var total = 0, limit = cap || 200;
  /* spread the cap evenly so every cleared cell bursts */
  var per = Math.min(perCell, Math.max(1, Math.floor(limit / cells.length)));
  cells.forEach(function(cell) {

    var cx = (cell[1] + 0.5) * 12.5, cy = (cell[0] + 0.5) * 12.5;
    for (var i = 0; i < per && total < limit; i++, total++) {

function lightningTo(cells) {

function addBoltPath(svg, d, stroke, width, opacity) {
  var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", d); p.setAttribute("fill", "none");

}
/* Rainbow-candy lightning: bright blue-white jagged bolts arcing from the rainbow
   candy to every candy it clears, with short branch offshoots and a flicker.
   Clearly different from the warm gold striped beam. */
function rainbowLightning(fromCell, cells, ptsFor) {
  var layer = fxLayer(); if (!layer || !cells || !cells.length) return;
  var targets = cells.filter(function(cell) { return !(cell[0] === fromCell[0] && cell[1] === fromCell[1]); });
  if (!targets.length) return;
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("class", "fx-bolt-blue");
  svg.setAttribute("viewBox", "0 0 100 100");
  svg.setAttribute("preserveAspectRatio", "none");
  var fx = (fromCell[1] + 0.5) * 12.5, fy = (fromCell[0] + 0.5) * 12.5;
  targets.forEach(function(cell) {
    var tx = (cell[1] + 0.5) * 12.5, ty = (cell[0] + 0.5) * 12.5;
    var dx = tx - fx, dy = ty - fy;
    var len = Math.sqrt(dx * dx + dy * dy); if (len < 1) return;
    var nx = dx / len, ny = dy / len;
    var px = -ny, py = nx; /* perpendicular, for the zigzag jitter */
    var segs = 5 + Math.floor(Math.random() * 3);
    var numPts = [];
    for (var i = 0; i <= segs; i++) {
      var t = i / segs;
      var off = (i === 0 || i === segs) ? 0 : (Math.random() * 5 - 2.5);
      numPts.push([fx + dx * t + px * off, fy + dy * t + py * off]);
    }
    var d = "M" + numPts.map(function(p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" L");
    addBoltPath(svg, d, "#38bdf8", 1.7, 0.85);
    addBoltPath(svg, d, "#bae6fd", 0.9, 0.95);
    addBoltPath(svg, d, "#ffffff", 0.45, 1);
    /* branch: a short jagged offshoot from the middle of the bolt */
    if (Math.random() < 0.45) {
      var mid = numPts[Math.floor(segs / 2)];
      var ang = Math.random() * Math.PI * 2;
      var bl = 4 + Math.random() * 5;
      var ex = mid[0] + Math.cos(ang) * bl, ey = mid[1] + Math.sin(ang) * bl;
      var mx = (mid[0] + ex) / 2 + (Math.random() * 3 - 1.5), my = (mid[1] + ey) / 2 + (Math.random() * 3 - 1.5);
      var bd = "M" + mid[0].toFixed(1) + "," + mid[1].toFixed(1) + " L" + mx.toFixed(1) + "," + my.toFixed(1) + " L" + ex.toFixed(1) + "," + ey.toFixed(1);
      addBoltPath(svg, bd, "#7dd3fc", 0.7, 0.7);
      addBoltPath(svg, bd, "#ffffff", 0.3, 0.8);
    }
  });
  layer.appendChild(svg);
  var anim = svg.animate([
    { opacity: 1 }, { opacity: 0.35, offset: 0.3 }, { opacity: 1, offset: 0.55 }, { opacity: 0 }
  ], { duration: 340, easing: "ease-out" });
  anim.onfinish = function() { if (svg.parentNode) svg.parentNode.removeChild(svg); };
  setTimeout(function() { if (svg.parentNode) svg.parentNode.removeChild(svg); }, 500);
  flashTiles(targets);
  showTileScores(targets, ptsFor);
}

    } else {
      el.className = "bg-float" + (Math.random() < 0.5 ? " twinkle" : "");
      el.textContent = BG_ITEMS[Math.floor(Math.random() * BG_ITEMS.length)];
      el.style.fontSize = (16 + Math.random() * 26) + "px";
      el.style.color = BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)];
      el.style.textShadow = "0 0 10px rgba(255,255,255,.8)";
    }
    el.style.left = (Math.random() * 96) + "vw";
    el.style.setProperty("--rise", (12 + Math.random() * 16) + "s");
    el.style.animationDelay = (-Math.random() * 28) + "s";
    decor.appendChild(el);
  }
  /* tiny twinkling confetti dots */
  for (i = 0; i < 18; i++) {
    el = document.createElement("span");
    el.className = "bg-float twinkle";
    var d = 5 + Math.random() * 6;
    el.style.width = d + "px"; el.style.height = d + "px";
    el.style.borderRadius = "50%";
    el.style.background = BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)];
    el.style.boxShadow = "0 0 8px " + el.style.background;
    el.style.left = (Math.random() * 96) + "vw";
    el.style.setProperty("--rise", (10 + Math.random() * 14) + "s");
    el.style.animationDelay = (-Math.random() * 24) + "s";
    decor.appendChild(el);
  }
}
var toastTimer = null;
function showToast(msg) {
  var toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toast.classList.remove("show"); }, 1600);
}
function updateHUD() {
  document.getElementById("levelNum").textContent = state.level;
  document.getElementById("scoreNum").textContent = state.score;
  document.getElementById("bestNum").textContent = Math.max(state.best, state.score);
  document.getElementById("targetNum").textContent = state.target;
  document.getElementById("movesNum").textContent = Math.max(0, state.moves);
  var pct = Math.min(100, Math.round(state.score / state.target * 100));
  document.getElementById("progressFill").style.width = pct + "%";
}

/* ================= Input: click + drag ================= */
var dragStart = null;
function tileFromEvent(e) {
  var rect = boardEl.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  var c = Math.floor(x / rect.width * COLS);
  var r = Math.floor(y / rect.height * ROWS);
  if (!inBoard(r, c)) return null;
  return [r, c];
}
function onTilePointerDown(e, tl) {
  if (state.busy || state.over) return;
  e.preventDefault();
  var pos = null;
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    if (state.board[r][c] === tl) pos = [r, c];
  }
  if (!pos) return;
  AudioEng.sfx("water");
  spawnRipple(pos[0], pos[1]);
  resetHintTimer();
  if (tl.type === "bomb") { startBombDrag(e, pos); return; } /* bomb: drag to detonate, never swap */
  dragStart = { pos: pos, x: e.clientX, y: e.clientY, moved: false };
  if (state.selected && state.selected[0] === pos[0] && state.selected[1] === pos[1]) {
    state.selected = null; renderSelection(); dragStart = null; return;
  }
  if (state.selected) {
    var s = state.selected;
    if (Math.abs(s[0] - pos[0]) + Math.abs(s[1] - pos[1]) === 1) {
      state.selected = null; renderSelection();
      trySwap(s[0], s[1], pos[0], pos[1]);
      dragStart = null; return;
    }
  }
  state.selected = pos; renderSelection();
}
boardEl.addEventListener("pointermove", function(e) {
  if (!dragStart || dragStart.moved) return;
  var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  dragStart.moved = true;
  var r = dragStart.pos[0], c = dragStart.pos[1];
  var r2 = r, c2 = c;
  if (Math.abs(dx) > Math.abs(dy)) c2 = c + (dx > 0 ? 1 : -1);
  else r2 = r + (dy > 0 ? 1 : -1);
  if (!inBoard(r2, c2)) { dragStart = null; return; }
  state.selected = null; renderSelection();
  trySwap(r, c, r2, c2);
  dragStart = null;
});
boardEl.addEventListener("pointerup", function() { dragStart = null; });
boardEl.addEventListener("pointercancel", function() { dragStart = null; });
boardEl.addEventListener("contextmenu", function(e) { e.preventDefault(); });
</script>
<script>
"use strict";
/* ================= 5-minute timer (always 5:00 per level) ================= */
var timerId = null;
function updateTimerDisplay() {
  var el = document.getElementById("timeNum");
  if (!el) return;
  var s = Math.max(0, state.timeLeft);
  var m = Math.floor(s / 60), ss = s % 60;
  el.textContent = m + ":" + (ss < 10 ? "0" : "") + ss;
  var stat = el.parentNode;
  if (stat) stat.classList.toggle("low", s <= 30 && s > 0);
}
function startTimer() {
  stopTimer();
  state.timeLeft = 300;
  updateTimerDisplay();
  timerId = setInterval(function() {
    if (state.over) return;
    if (document.getElementById("gameScreen").classList.contains("hidden")) return;
    if (state.timeLeft > 0) { state.timeLeft--; updateTimerDisplay(); }
    if (state.timeLeft <= 0 && !state.busy) endLevel(false);
  }, 1000);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

/* ================= Levels & end screens ================= */
var transTimer = null;
var boingTimer = null;
/* Happy pentatonic notes for the bouncing train: C5 D5 E5 G5 A5 C6. One soft boing
   per hop beat, staggered 150ms with the wave, so it sounds like a playful
   plip-plip-plip rolling across the train. */
var BOING_NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
function startBoings() {
  stopBoings();
  var i = 0;
  boingTimer = setInterval(function() {
    AudioEng.sfx("boing", BOING_NOTES[i % BOING_NOTES.length]);
    i++;
  }, 150);
}
function stopBoings() { if (boingTimer) { clearInterval(boingTimer); boingTimer = null; } }
/* Chipmunk voice on the transition screen: a cheerful "Let's go!" in a high,
   fast chipmunk voice (Web Speech API). Plays once per transition, respects the
   mute toggle, and fails silently if speech synthesis is unavailable. */
function speakLetsGo() {
  try {
    if (!AudioEng.isMusicOn()) return; /* muted: no voice */
    if (!("speechSynthesis" in window) || !window.speechSynthesis) return;
    if (typeof SpeechSynthesisUtterance === "undefined") return;
    var u = new SpeechSynthesisUtterance("Let's go!");
    u.lang = "en-US";
    u.pitch = 2;   /* max pitch: chipmunk-high */
    u.rate = 1.3;  /* fast and cheerful */
    u.volume = 1;
    var voices = window.speechSynthesis.getVoices() || [];
    var en = null;
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.indexOf("en") === 0) { en = voices[i]; break; }
    }
    if (en) u.voice = en; /* otherwise the default voice is used */
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech unavailable: fail silently, train + boings + music keep working */ }
}
function showTransition(fromLevel) {
  var next = fromLevel + 1;
  var ov = document.getElementById("transitionScreen");
  document.getElementById("transTitle").textContent = t("transDone").replace("{n}", fromLevel);
  document.getElementById("transMsg").textContent = t("transWalk").replace("{n}", next);
  document.getElementById("transNext").textContent = t("transNext").replace("{n}", next);
  ov.classList.remove("hidden");
  var row = ov.querySelector(".trans-row");
  if (row) { row.style.animation = "none"; void row.offsetWidth; row.style.animation = ""; }
  startBoings();
  speakLetsGo(); /* chipmunk "Let's go!" once per transition */
  clearTimeout(transTimer);
  transTimer = setTimeout(function() {
    stopBoings();
    ov.classList.add("hidden");
    startLevel(next);
  }, 3900);
}
function startLevel(level) {
  stopBoings();
  state.level = level;
  var cfg = levelConfig(level);
  state.target = cfg.target;
  state.moves = cfg.moves;
  state.score = 0;
  state.over = false;
  state.busy = false;
  state.selected = null;
  state.board = createBoard();
  boardEl.innerHTML = "";
  elsById = {};
  renderBoard(true);
  updateHUD();
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  stopBoings();
  document.getElementById("transitionScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  renderGameLb();
  lastBombTime = Date.now();
  resetHintTimer();
  AudioEng.unlock();
  AudioEng.startMusic();
  startTimer();
}
function endLevel(won) {
  state.over = true;
  stopTimer();
  stopHintTimer();
  var isBest = state.score > state.best;
  if (isBest) {
    state.best = state.score;
    localStorage.setItem("animalCrushBest", String(state.best));
  }
  if (won) {
    celebrateWin();
    if (state.level >= state.maxLevel) {
      state.maxLevel = state.level + 1;
      localStorage.setItem("animalCrushMaxLevel", String(state.maxLevel));
    }
    localStorage.setItem("animalCrushLevel", String(state.level + 1));
    showToast(t("nice"));
  } else {
    AudioEng.sfx("lose");
  }
  updateHUD();
  if (won) {
    /* win: celebrate, then the bouncing train carries us to the next level, which opens by itself */
    setTimeout(function() { showTransition(state.level); }, 2700);
  } else {
    setTimeout(function() { showEnd(won, isBest); }, 700);
  }
}
function showEnd(won, isBest) {
  var end = document.getElementById("endScreen");
  document.getElementById("endTitle").textContent = won ? t("win") : t("lose");
  document.getElementById("endMsg").textContent = won ? t("winMsg") : t("loseMsg");
  document.getElementById("endScore").textContent = state.score;
  document.getElementById("endBest").textContent = t("best") + ": " + state.best + (isBest ? " - " + t("newBest") : "");
  document.getElementById("nextBtn").classList.toggle("hidden", !won);
  document.getElementById("retryBtn").classList.toggle("hidden", won);
  document.getElementById("saveMsg").textContent = "";
  document.getElementById("saveScoreBtn").disabled = false;
  var nameRow = document.getElementById("nameRow");
  /* show name entry only if the score can make the top 10 */
  getBoard().then(function(list) {
    var qualifies = list.length < 10 || state.score > list[list.length - 1].score;
    nameRow.classList.toggle("hidden", !qualifies);
    if (qualifies) document.getElementById("nameInput").focus();
  });
  renderEndLb();
  end.classList.remove("hidden");
}

/* ================= Leaderboard ================= */
var FB_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/animal-crush.json";
var LS_BOARD = "animalCrushBoardV1";
var cachedBoard = null;
function normalizeBoard(data) {
  if (!data) return [];
  var arr = Array.isArray(data) ? data : Object.keys(data).sort(function(a,b){ return a-b; }).map(function(k){ return data[k]; });
  return arr.filter(function(x){ return x && typeof x.score === "number"; })
    .sort(function(a,b){ return b.score - a.score; }).slice(0, 10);
}
function getBoard() {
  if (cachedBoard) return Promise.resolve(cachedBoard.slice());
  return fetch(FB_URL).then(function(r){ return r.json(); }).then(function(data) {
    cachedBoard = normalizeBoard(data);
    return cachedBoard.slice();
  }).catch(function() {
    try { cachedBoard = normalizeBoard(JSON.parse(localStorage.getItem(LS_BOARD) || "[]")); }
    catch (e) { cachedBoard = []; }
    return cachedBoard.slice();
  });
}
function saveToBoard(entry) {
  var list = (cachedBoard || []).slice();
  list.push(entry);
  list.sort(function(a,b){ return b.score - a.score; });
  list = list.slice(0, 10);
  cachedBoard = list;
  try { localStorage.setItem(LS_BOARD, JSON.stringify(list)); } catch (e) {}
  return fetch(FB_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(list) })
    .catch(function() { /* offline: local copy already saved */ });
}
function lbHtml(list) {
  var html = "<h2 style=\"font-size:20px; margin-bottom:6px;\">🏆 " + t("leaderboard") + " - " + t("top10") + "</h2>";
  if (!list.length) return html + "<p>" + t("noScores") + "</p>";
  list.forEach(function(e, i) {
    var crown = i === 0 ? "<span class=\"lb-crown\">👑</span> " : "";
    var title = i === 0 ? "<div class=\"lb-title\">" + t("champion") + "</div>" : "";
    html += "<div class=\"lb-row\"><span class=\"rank\">" + (i + 1) + ".</span><span>" + crown + escapeHtml(e.name) + "</span><span><b>" + e.score + "</b></span></div>" + title;
  });
  return html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderGameLb() {
  getBoard().then(function(list) {
    document.getElementById("gameLb").innerHTML = lbHtml(list);
    document.getElementById("startLb").innerHTML = lbHtml(list);
  });
}
function renderEndLb() {
  getBoard().then(function(list) {
    document.getElementById("endLb").innerHTML = lbHtml(list);
  });
}
document.getElementById("saveScoreBtn").addEventListener("click", function() {
  var name = document.getElementById("nameInput").value.trim() || "Bé Cá";
  var btn = document.getElementById("saveScoreBtn");
  btn.disabled = true;
  saveToBoard({ name: name, score: state.score, date: new Date().toISOString().slice(0, 10) }).then(function() {
    document.getElementById("saveMsg").textContent = t("saved");
    renderEndLb(); renderGameLb();
  }).catch(function() {
    document.getElementById("saveMsg").textContent = t("savedFail");
    btn.disabled = false;
  });
});

/* ================= Visit counter ================= */
var VISITS_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/visits/animal-crush.json";
function updateVisits() {
  var el = document.getElementById("visitCount");
  var today = new Date().toISOString().slice(0, 10);
  var lastDay = localStorage.getItem("animalCrushVisitDay");
  var show = function(n) { el.textContent = "🐠 " + t("visits").replace("{n}", n); };
  var known = parseInt(localStorage.getItem("animalCrushVisits") || "0", 10);
  if (known) show(known);
  if (lastDay === today) {
    /* already counted today: just read the latest number */
    fetch(VISITS_URL).then(function(r){ return r.json(); }).then(function(v) {
      var n = parseInt(v, 10); if (!isNaN(n) && n > 0) { localStorage.setItem("animalCrushVisits", String(n)); show(n); }
    }).catch(function(){});
    return;
  }
  fetch(VISITS_URL).then(function(r){ return r.json(); }).then(function(v) {
    var n = parseInt(v, 10); if (isNaN(n)) n = 0;
    var next = n + 1;
    return fetch(VISITS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next) }).then(function() {
      localStorage.setItem("animalCrushVisitDay", today);
      localStorage.setItem("animalCrushVisits", String(next));
      show(next);
    });
  }).catch(function(){});
}

/* ================= Language & UI wiring ================= */
function applyLang() {
  document.documentElement.lang = LANG;
  document.getElementById("tagline").textContent = t("tagline");
  document.getElementById("howto").innerHTML = t("howto");
  document.getElementById("playBtn").textContent = t("play");
  document.getElementById("lblLevel").textContent = t("level") + ":";
  document.getElementById("lblScore").textContent = t("score") + ":";
  document.getElementById("lblBest").textContent = t("best") + ":";
  document.getElementById("lblTarget").textContent = t("target") + ":";
  document.getElementById("lblMoves").textContent = t("moves") + ":";
  document.getElementById("lblTime").textContent = t("time") + ":";
  var lc = levelConfig(state.level);
  document.getElementById("levelInfo").textContent = t("level") + " " + state.level + " · " + t("target") + ": " + lc.target + " · " + lc.moves + " " + t("movesLeft") + " · ⏱ 5:00";
  document.getElementById("saveScoreBtn").textContent = t("save");
  document.getElementById("nextBtn").textContent = t("next");
  document.getElementById("retryBtn").textContent = t("retry");
  document.getElementById("endHomeBtn").textContent = t("home");
  document.getElementById("bestLine").textContent = t("best") + ": " + state.best;
  document.getElementById("nameInput").placeholder = t("yourName");
  var known = parseInt(localStorage.getItem("animalCrushVisits") || "0", 10);
  if (known) document.getElementById("visitCount").textContent = "🐠 " + t("visits").replace("{n}", known);
  renderGameLb();
}
function setLang(l) {
  LANG = l;
  localStorage.setItem("animalCrushLang", l);
  applyLang();
}
document.getElementById("langBtn").addEventListener("click", function() { setLang(LANG === "vi" ? "en" : "vi"); });
document.getElementById("langBtnStart").addEventListener("click", function() { setLang(LANG === "vi" ? "en" : "vi"); });
function syncMusicBtns() {
  var icon = AudioEng.isMusicOn() ? "🔊" : "🔇";
  document.getElementById("musicBtn").textContent = icon;
  document.getElementById("musicBtnStart").textContent = icon;
}
document.getElementById("musicBtn").addEventListener("click", function() { AudioEng.unlock(); AudioEng.toggleMusic(); syncMusicBtns(); });
document.getElementById("musicBtnStart").addEventListener("click", function() { AudioEng.unlock(); AudioEng.toggleMusic(); syncMusicBtns(); });
document.getElementById("homeBtn").addEventListener("click", function() {
  state.over = true;
  stopTimer();
  stopHintTimer();
  /* music keeps playing on the start screen: it is the game's background music */
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  stopBoings();
  document.getElementById("transitionScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  applyLang();
});
document.getElementById("playBtn").addEventListener("click", function() {
  AudioEng.unlock();
  startLevel(state.level);
});
document.getElementById("nextBtn").addEventListener("click", function() {
  showToast(t("levelUp"));
  startLevel(state.level + 1);
});
document.getElementById("retryBtn").addEventListener("click", function() { startLevel(state.level); });
document.getElementById("endHomeBtn").addEventListener("click", function() {
  stopTimer();
  stopHintTimer();
  /* music keeps playing on the start screen: it is the game's background music */
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.add("hidden");
  stopBoings();
  document.getElementById("transitionScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  applyLang();
});

/* Music starts on the very first tap anywhere (browsers block audio until the
   user interacts), so the start screen has music too and it plays through the
   whole game: start screen, gameplay, win celebration, transition, end screen. */
var musicStarted = false;
function startMusicOnFirstTap() {
  if (musicStarted) return;
  musicStarted = true;
  AudioEng.unlock();
  AudioEng.startMusic();
}
document.addEventListener("pointerdown", startMusicOnFirstTap);

/* ================= Init ================= */
(function init() {
  buildBgDecor();
  var row = document.getElementById("logoRow");
  ANIMALS.forEach(function(a) {
    var img = document.createElement("img");
    img.src = IMG[a]; img.alt = a;
    row.appendChild(img);
  });
  applyLang();
  syncMusicBtns();
  updateVisits();
  renderGameLb();
})();
</script>
