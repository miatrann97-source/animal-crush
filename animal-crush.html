<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animal Crush</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #aee7ff 0%, #d9f7c4 45%, #fff3b0 100%);
  min-height: 100vh; min-height: 100dvh;
  display:flex; flex-direction:column; align-items:center;
  color:#3a2b1f; overflow-x:hidden;
  user-select:none; -webkit-user-select:none;
}
h1 { font-size: clamp(30px, 8vw, 46px); color:#ff6b9d; text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,.12); letter-spacing:1px; }
h2 { font-size: clamp(20px, 5.5vw, 28px); color:#7c4dff; }
button {
  font-family: inherit; cursor:pointer; border:none; border-radius: 999px;
  padding: 12px 26px; font-size: 18px; font-weight: bold; color:#fff;
  background: linear-gradient(180deg, #ff8fb3, #ff5c8a);
  box-shadow: 0 4px 0 #d63d68, 0 6px 12px rgba(0,0,0,.18);
  transition: transform .08s ease, box-shadow .08s ease;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #d63d68; }
button.small { padding: 8px 16px; font-size: 15px; }
button.green { background: linear-gradient(180deg, #7ee081, #43b581); box-shadow: 0 4px 0 #2e8b57, 0 6px 12px rgba(0,0,0,.18); }
button.green:active { box-shadow: 0 1px 0 #2e8b57; }
button.blue { background: linear-gradient(180deg, #7cc4ff, #3f8cff); box-shadow: 0 4px 0 #2b62b8, 0 6px 12px rgba(0,0,0,.18); }
button.blue:active { box-shadow: 0 1px 0 #2b62b8; }
button.ghost { background:#fff; color:#7c4dff; box-shadow: 0 4px 0 #d9d2ff; }
button:disabled { opacity:.55; cursor:default; }
.screen { width:100%; max-width:520px; padding: 14px 12px 28px; display:flex; flex-direction:column; align-items:center; gap:12px; }
.hidden { display:none !important; }

/* ---------- Start screen ---------- */
#startScreen { text-align:center; }
.logo-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin: 6px 0; }
.logo-row img { width:56px; height:56px; border-radius:16px; box-shadow: 0 4px 10px rgba(0,0,0,.2); }
.tagline { font-size:17px; color:#5a4632; }
.card {
  background: rgba(255,255,255,.92); border-radius: 20px; padding: 16px 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,.12); width:100%;
}
.howto { text-align:left; font-size:16px; line-height:1.75; }
.howto b { color:#ff5c8a; }
.visit-count { font-size:15px; color:#6b5a4a; }
.best-line { font-size:16px; font-weight:bold; color:#7c4dff; }

/* ---------- HUD ---------- */
#hud {
  width:100%; background: rgba(255,255,255,.92); border-radius: 18px;
  padding: 10px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  display:flex; flex-direction:column; gap:8px;
}
.hud-row { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.hud-stat { font-size:15px; line-height:1.35; }
.hud-stat b { font-size:19px; color:#ff5c8a; }
.hud-stat .target { color:#7c4dff; }
.hud-btns { display:flex; gap:6px; }
.icon-btn {
  padding:6px 10px; font-size:15px; border-radius:12px; min-width:40px;
  background:#fff; color:#5a4632; box-shadow: 0 3px 0 #e0d8d0;
}
.progress { height:12px; background:#f0e6da; border-radius:999px; overflow:hidden; }
#progressFill { height:100%; width:0%; background: linear-gradient(90deg, #ffb347, #ff5c8a); border-radius:999px; transition: width .3s ease; }

/* ---------- Board ---------- */
#boardWrap { width:100%; max-width:480px; position:relative; }
#board {
  position:relative; width:100%; aspect-ratio: 1 / 1;
  background: rgba(255,255,255,.55); border-radius:18px;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.8), 0 8px 20px rgba(0,0,0,.14);
  overflow:hidden; touch-action:none;
}
.tile {
  position:absolute; left:0; top:0; width:12.5%; height:12.5%; padding:2px;
  transition: transform .22s ease;
  will-change: transform;
}
.tile .inner {
  width:100%; height:100%; border-radius:14%; overflow:hidden; position:relative;
  box-shadow: 0 2px 5px rgba(0,0,0,.22);
  transition: transform .15s ease, opacity .18s ease;
}
.tile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.tile.selected .inner { outline:3px solid #ffcf3f; outline-offset:-1px; transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 14px #ffcf3f; z-index:5; }
.tile.pop .inner { transform: scale(.1); opacity:0; }
.tile.new .inner { animation: dropIn .25s ease; }
@keyframes dropIn { from { transform: translateY(-30%) scale(.8); } to { transform: none; } }
/* special overlays */
.tile .badge {
  position:absolute; right:1px; top:1px; font-size: clamp(11px, 3vw, 17px); line-height:1;
  text-shadow: 0 1px 2px rgba(0,0,0,.5); pointer-events:none; z-index:3;
}
.tile.striped-h .inner::after {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.striped-v .inner::after {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 3px, transparent 3px 8px);
}
.tile.wrapped .inner { box-shadow: 0 0 0 2px #ffd23f, 0 0 14px #ffd23f, 0 2px 5px rgba(0,0,0,.22); animation: wrapPulse .8s ease-in-out infinite; }
@keyframes wrapPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
.tile.rainbow .inner {
  box-shadow: 0 0 0 2px #fff, 0 0 16px #b06bff, 0 2px 5px rgba(0,0,0,.22);
  animation: rainbowSpin 2s linear infinite;
}
@keyframes rainbowSpin {
  0% { filter: hue-rotate(0deg) brightness(1.15); }
  100% { filter: hue-rotate(360deg) brightness(1.15); }
}
.float-score {
  position:absolute; z-index:20; font-weight:bold; font-size:20px; color:#ff5c8a;
  text-shadow: 1px 1px 0 #fff; pointer-events:none;
  animation: floatUp 0.9s ease-out forwards;
}
@keyframes floatUp { from { opacity:1; transform: translate(-50%,0); } to { opacity:0; transform: translate(-50%,-46px); } }
#toast {
  position:absolute; left:50%; top:38%; transform: translateX(-50%);
  background: rgba(60,30,60,.88); color:#fff; font-size:18px; font-weight:bold;
  padding: 10px 18px; border-radius: 999px; z-index:30; pointer-events:none;
  opacity:0; transition: opacity .25s ease; white-space:nowrap;
}
#toast.show { opacity:1; }

/* ---------- Leaderboard ---------- */
#boardPanel { width:100%; }
.lb-row { display:flex; justify-content:space-between; font-size:16px; padding:5px 4px; border-bottom:1px dashed #e8dccf; }
.lb-row.me { background:#fff3d6; border-radius:8px; font-weight:bold; }
.lb-row .rank { width:34px; }
.lb-crown { font-size:18px; }
.lb-title { font-size:15px; color:#b8860b; font-weight:bold; }
input[type=text] {
  font-family:inherit; font-size:17px; padding:9px 12px; border-radius:12px;
  border:2px solid #ffd3e2; width: 150px; outline:none; text-align:center;
}
input[type=text]:focus { border-color:#ff5c8a; }

/* ---------- End screen ---------- */
#endScreen {
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background: rgba(40,20,50,.55); padding: 16px;
}
.end-card {
  background:#fff; border-radius:24px; padding: 22px 20px; width:100%; max-width:440px;
  text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center;
  box-shadow: 0 12px 40px rgba(0,0,0,.3); max-height: 92vh; max-height: 92dvh; overflow-y:auto;
}
.end-card .big-score { font-size:40px; font-weight:bold; color:#ff5c8a; }
.end-btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
@media (max-width: 380px) {
  .hud-stat { font-size:13px; } .hud-stat b { font-size:17px; }
  button { font-size:16px; padding: 11px 20px; }
}
</style>
</head>
<body>
<div class="screen" id="startScreen">
  <h1>Animal Crush</h1>
  <div class="logo-row" id="logoRow"></div>
  <p class="tagline" id="tagline"></p>
  <div class="card howto" id="howto"></div>
  <p class="visit-count" id="visitCount"></p>
  <p class="best-line" id="bestLine"></p>
  <button id="playBtn" class="green"></button>
  <div class="card" id="startLb"></div>
  <div class="hud-btns">
    <button class="icon-btn" id="langBtnStart">VI | EN</button>
    <button class="icon-btn" id="musicBtnStart">🔊</button>
  </div>
</div>

<div class="screen hidden" id="gameScreen">
  <div id="hud">
    <div class="hud-row">
      <div class="hud-stat"><span id="lblLevel"></span> <b id="levelNum">1</b></div>
      <div class="hud-stat"><span id="lblScore"></span> <b id="scoreNum">0</b></div>
      <div class="hud-stat"><span id="lblBest"></span> <b id="bestNum">0</b></div>
      <div class="hud-btns">
        <button class="icon-btn" id="langBtn">VI | EN</button>
        <button class="icon-btn" id="musicBtn">🔊</button>
        <button class="icon-btn" id="homeBtn">🏠</button>
      </div>
    </div>
    <div class="hud-row">
      <div class="hud-stat"><span id="lblTarget"></span> <b class="target" id="targetNum">1000</b></div>
      <div class="hud-stat"><span id="lblMoves"></span> <b id="movesNum">30</b></div>
    </div>
    <div class="progress"><div id="progressFill"></div></div>
  </div>
  <div id="boardWrap">
    <div id="board"></div>
    <div id="toast"></div>
  </div>
  <div class="card" id="gameLb"></div>
</div>

<div id="endScreen" class="hidden">
  <div class="end-card">
    <h2 id="endTitle"></h2>
    <p id="endMsg"></p>
    <div class="big-score" id="endScore"></div>
    <p id="endBest"></p>
    <div id="nameRow" class="hidden" style="display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap;">
      <input type="text" id="nameInput" maxlength="12" value="Bé Cá">
      <button id="saveScoreBtn" class="small blue"></button>
    </div>
    <p id="saveMsg" style="font-size:14px; color:#43b581; min-height:18px;"></p>
    <div class="card" id="endLb" style="width:100%;"></div>
    <div class="end-btns">
      <button id="nextBtn" class="green hidden"></button>
      <button id="retryBtn" class="hidden"></button>
      <button id="endHomeBtn" class="ghost"></button>
    </div>
  </div>
</div>

    c = 0;

      len = 1;
      while (c + len < COLS && b[r][c+len] && b[r][c+len].type === t0.type) len++;

      }
      c += len;
    }
  }
  for (c = 0; c < COLS; c++) {
    r = 0;
    while (r < ROWS) {
      var t1 = b[r][c];
      if (!t1 || t1.type === "rainbow") { r++; continue; }
      len = 1;
      while (r + len < ROWS && b[r+len][c] && b[r+len][c].type === t1.type) len++;

"use strict";
/* ================= Matching, specials, scoring ================= */
function rateFor(len) { return len === 3 ? 60 : len === 4 ? 120 : 200; }

/* Expand a clear set with special effects. Returns {cells:Set(keys), wrappedHits:[[r,c]], effects:[names]} */
function expandClear(initialCells) {
  var cells = {}, queue = [], wrappedHits = [], effects = [];
  initialCells.forEach(function(cell) { cells[cell[0] + "," + cell[1]] = cell; queue.push(cell); });
  var processed = {};
  while (queue.length) {
    var cell = queue.shift();
    var r = cell[0], c = cell[1];
    var tl = state.board[r] && state.board[r][c];
    if (!tl || !tl.special || processed[tl.id]) continue;
    processed[tl.id] = true;
    if (tl.special === "h") {
      effects.push("striped");
      for (var cc = 0; cc < COLS; cc++) { var k = r + "," + cc; if (!cells[k]) { cells[k] = [r, cc]; queue.push([r, cc]); } }
    } else if (tl.special === "v") {
      effects.push("striped");
      for (var rr = 0; rr < ROWS; rr++) { var k2 = rr + "," + c; if (!cells[k2]) { cells[k2] = [rr, c]; queue.push([rr, c]); } }

      effects.push("wrapped");
      wrappedHits.push([r, c]);

        var nr = r + dr, nc = c + dc;
        if (inBoard(nr, nc)) { var k3 = nr + "," + nc; if (!cells[k3]) { cells[k3] = [nr, nc]; queue.push([nr, nc]); } }
      }

      effects.push("rainbow");
      var counts = {};
      state.board.forEach(function(row) { row.forEach(function(t2) { if (t2 && t2.type !== "rainbow") counts[t2.type] = (counts[t2.type] || 0) + 1; }); });
      var bestType = null, bestN = 0;
      Object.keys(counts).forEach(function(ty) { if (counts[ty] > bestN) { bestN = counts[ty]; bestType = ty; } });
      if (bestType) {
        for (var r2 = 0; r2 < ROWS; r2++) for (var c2 = 0; c2 < COLS; c2++) {
          var t3 = state.board[r2][c2];

  list.forEach(function(cell) {
    var tl = state.board[cell[0]][cell[1]];
    if (tl) { removeTileEl(tl.id); state.board[cell[0]][cell[1]] = null; }
  });
  dropAndRefill();
  renderBoard(false);
  await sleep(240);
  await resolveBoard(null);
}

/* Player swap attempt */
async function trySwap(r1, c1, r2, c2) {
  if (state.busy || state.over) return;
  if (!inBoard(r2, c2)) return;
  var a = state.board[r1][c1], b = state.board[r2][c2];
  if (!a || !b) return;
  state.busy = true;
  state.selected = null; renderSelection();
  /* animate the swap */
  state.board[r1][c1] = b; state.board[r2][c2] = a;
  renderBoard(false);
  AudioEng.sfx("swap");
  await sleep(230);
  /* rainbow activation */
  if (a.special === "rainbow" || b.special === "rainbow") {
    state.moves--;
    updateHUD();
    await doRainbowSwap(r1, c1, r2, c2);
    afterTurn();
    state.busy = false;
    return;
  }
  var found = findMatches(state.board);
  if (found.runs.length === 0) {
    state.board[r1][c1] = a; state.board[r2][c2] = b;
    renderBoard(false);
    AudioEng.sfx("invalid");
    await sleep(230);
    state.busy = false;
    return;
  }
  state.moves--;
  updateHUD();
  await resolveBoard([r2, c2]);
  afterTurn();
  state.busy = false;
}

function afterTurn() {
  updateHUD();
  if (state.score >= state.target) { endLevel(true); return; }
  if (state.moves <= 0) { endLevel(false); return; }
  if (!hasValidMove(state.board)) {
    showToast(t("shuffle"));
    setTimeout(function() { if (!state.over) shuffleBoard(); }, 900);
  }
}
</script>
<script>
"use strict";
/* ================= Rendering ================= */
var boardEl = document.getElementById("board");
var elsById = {};
function tileEl(r, c) {
  var tl = state.board[r] && state.board[r][c];
  return tl ? elsById[tl.id] : null;
}
function removeTileEl(id) {
  var el = elsById[id];
  if (el && el.parentNode) el.parentNode.removeChild(el);
  delete elsById[id];
}
function specialClass(tl) {
  if (!tl.special) return "";
  if (tl.special === "h") return " striped-h";
  if (tl.special === "v") return " striped-v";
  if (tl.special === "wrapped") return " wrapped";
  if (tl.special === "rainbow") return " rainbow";
  return "";
}
function badgeFor(tl) {
  if (tl.special === "h") return "↔";
  if (tl.special === "v") return "↕";
  if (tl.special === "wrapped") return "🎀";
  if (tl.special === "rainbow") return "🌈";
  return "";
}
function makeTileEl(tl) {
  var div = document.createElement("div");
  div.className = "tile" + specialClass(tl);
  div.dataset.id = tl.id;
  var inner = document.createElement("div");
  inner.className = "inner";
  var img = document.createElement("img");
  img.src = tl.type === "rainbow" ? IMG.fox : IMG[tl.type];
  img.alt = tl.type;
  img.draggable = false;
  inner.appendChild(img);
  var badge = badgeFor(tl);
  if (badge) {
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = badge;
    inner.appendChild(b);
  }
  if (tl.type === "rainbow") {
    inner.style.background = "linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1,#84fab0,#8fd3f4)";
  }
  div.appendChild(inner);
  div.addEventListener("pointerdown", function(e) { onTilePointerDown(e, tl); });
  elsById[tl.id] = div;
  return div;
}
function refreshTileEl(tl, r, c) {
  var el = elsById[tl.id];
  if (!el) return;
  el.className = "tile" + specialClass(tl);
  var inner = el.querySelector(".inner");
  var oldBadge = inner.querySelector(".badge");
  if (oldBadge) oldBadge.remove();
  var badge = badgeFor(tl);
  if (badge) {
    var b = document.createElement("span");
    b.className = "badge";
    b.textContent = badge;
    inner.appendChild(b);
  }
  var img = inner.querySelector("img");
  if (img) img.src = tl.type === "rainbow" ? IMG.fox : IMG[tl.type];
  inner.style.background = tl.type === "rainbow" ? "linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1,#84fab0,#8fd3f4)" : "";
}
function positionEl(el, r, c) {
  el.style.transform = "translate(" + (c * 100) + "%, " + (r * 100) + "%)";
}
function renderBoard(full) {
  /* sync DOM to model */
  var seen = {};
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      var tl = state.board[r][c];
      if (!tl) continue;
      seen[tl.id] = true;
      var el = elsById[tl.id];
      if (!el) {
        el = makeTileEl(tl);
        boardEl.appendChild(el);
        /* new tiles drop in from above */
        var startRow = r - (ROWS - r);
        positionEl(el, startRow, c);
        void el.offsetWidth;
        el.classList.add("new");
      }
      positionEl(el, r, c);
      refreshTileEl(tl, r, c);
    }
  }
  Object.keys(elsById).forEach(function(id) {
    if (!seen[id]) removeTileEl(id);
  });
  if (full) {
    /* snap without transition on a full rebuild */
    Object.keys(elsById).forEach(function(id) {
      var el = elsById[id];
      el.style.transition = "none";
      void el.offsetWidth;
      el.style.transition = "";
    });
  }
}
function renderSelection() {
  Object.keys(elsById).forEach(function(id) { elsById[id].classList.remove("selected"); });
  if (state.selected) {
    var el = tileEl(state.selected[0], state.selected[1]);
    if (el) el.classList.add("selected");
  }
}
function showFloatScore(points, cells) {
  if (!cells || !cells.length) return;
  var sr = 0, sc = 0;
  cells.forEach(function(cell) { sr += cell[0]; sc += cell[1]; });
  sr /= cells.length; sc /= cells.length;
  var div = document.createElement("div");
  div.className = "float-score";
  div.textContent = "+" + points;
  div.style.left = ((sc + 0.5) * 12.5) + "%";
  div.style.top = ((sr + 0.5) * 12.5) + "%";
  boardEl.appendChild(div);
  setTimeout(function() { if (div.parentNode) div.parentNode.removeChild(div); }, 950);
}
var toastTimer = null;
function showToast(msg) {
  var toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toast.classList.remove("show"); }, 1600);
}
function updateHUD() {
  document.getElementById("levelNum").textContent = state.level;
  document.getElementById("scoreNum").textContent = state.score;
  document.getElementById("bestNum").textContent = Math.max(state.best, state.score);
  document.getElementById("targetNum").textContent = state.target;
  document.getElementById("movesNum").textContent = Math.max(0, state.moves);
  var pct = Math.min(100, Math.round(state.score / state.target * 100));
  document.getElementById("progressFill").style.width = pct + "%";
}

/* ================= Input: click + drag ================= */
var dragStart = null;
function tileFromEvent(e) {
  var rect = boardEl.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  var c = Math.floor(x / rect.width * COLS);
  var r = Math.floor(y / rect.height * ROWS);
  if (!inBoard(r, c)) return null;
  return [r, c];
}
function onTilePointerDown(e, tl) {
  if (state.busy || state.over) return;
  e.preventDefault();
  var pos = null;
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    if (state.board[r][c] === tl) pos = [r, c];
  }
  if (!pos) return;
  dragStart = { pos: pos, x: e.clientX, y: e.clientY, moved: false };
  AudioEng.sfx("select");
  if (state.selected && state.selected[0] === pos[0] && state.selected[1] === pos[1]) {
    state.selected = null; renderSelection(); dragStart = null; return;
  }
  if (state.selected) {
    var s = state.selected;
    if (Math.abs(s[0] - pos[0]) + Math.abs(s[1] - pos[1]) === 1) {
      state.selected = null; renderSelection();
      trySwap(s[0], s[1], pos[0], pos[1]);
      dragStart = null; return;
    }
  }
  state.selected = pos; renderSelection();
}
boardEl.addEventListener("pointermove", function(e) {
  if (!dragStart || dragStart.moved) return;
  var dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  dragStart.moved = true;
  var r = dragStart.pos[0], c = dragStart.pos[1];
  var r2 = r, c2 = c;
  if (Math.abs(dx) > Math.abs(dy)) c2 = c + (dx > 0 ? 1 : -1);
  else r2 = r + (dy > 0 ? 1 : -1);
  if (!inBoard(r2, c2)) { dragStart = null; return; }
  state.selected = null; renderSelection();
  trySwap(r, c, r2, c2);
  dragStart = null;
});
boardEl.addEventListener("pointerup", function() { dragStart = null; });
boardEl.addEventListener("pointercancel", function() { dragStart = null; });
boardEl.addEventListener("contextmenu", function(e) { e.preventDefault(); });
</script>
<script>
"use strict";
/* ================= Levels & end screens ================= */
function startLevel(level) {
  state.level = level;
  var cfg = levelConfig(level);
  state.target = cfg.target;
  state.moves = cfg.moves;
  state.score = 0;
  state.over = false;
  state.busy = false;
  state.selected = null;
  state.board = createBoard();
  boardEl.innerHTML = "";
  elsById = {};
  renderBoard(true);
  updateHUD();
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  renderGameLb();
  AudioEng.unlock();
  AudioEng.startMusic();
}
function endLevel(won) {
  state.over = true;
  var isBest = state.score > state.best;
  if (isBest) {
    state.best = state.score;
    localStorage.setItem("animalCrushBest", String(state.best));
  }
  if (won) {
    AudioEng.sfx("win");
    if (state.level >= state.maxLevel) {
      state.maxLevel = state.level + 1;
      localStorage.setItem("animalCrushMaxLevel", String(state.maxLevel));
    }
    localStorage.setItem("animalCrushLevel", String(state.level + 1));
    showToast(t("nice"));
  } else {
    AudioEng.sfx("lose");
  }
  updateHUD();
  setTimeout(function() { showEnd(won, isBest); }, 700);
}
function showEnd(won, isBest) {
  var end = document.getElementById("endScreen");
  document.getElementById("endTitle").textContent = won ? t("win") : t("lose");
  document.getElementById("endMsg").textContent = won ? t("winMsg") : t("loseMsg");
  document.getElementById("endScore").textContent = state.score;
  document.getElementById("endBest").textContent = t("best") + ": " + state.best + (isBest ? " - " + t("newBest") : "");
  document.getElementById("nextBtn").classList.toggle("hidden", !won);
  document.getElementById("retryBtn").classList.toggle("hidden", won);
  document.getElementById("saveMsg").textContent = "";
  document.getElementById("saveScoreBtn").disabled = false;
  var nameRow = document.getElementById("nameRow");
  /* show name entry only if the score can make the top 10 */
  getBoard().then(function(list) {
    var qualifies = list.length < 10 || state.score > list[list.length - 1].score;
    nameRow.classList.toggle("hidden", !qualifies);
    if (qualifies) document.getElementById("nameInput").focus();
  });
  renderEndLb();
  end.classList.remove("hidden");
}

/* ================= Leaderboard ================= */
var FB_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/animal-crush.json";
var LS_BOARD = "animalCrushBoardV1";
var cachedBoard = null;
function normalizeBoard(data) {
  if (!data) return [];
  var arr = Array.isArray(data) ? data : Object.keys(data).sort(function(a,b){ return a-b; }).map(function(k){ return data[k]; });
  return arr.filter(function(x){ return x && typeof x.score === "number"; })
    .sort(function(a,b){ return b.score - a.score; }).slice(0, 10);
}
function getBoard() {
  if (cachedBoard) return Promise.resolve(cachedBoard.slice());
  return fetch(FB_URL).then(function(r){ return r.json(); }).then(function(data) {
    cachedBoard = normalizeBoard(data);
    return cachedBoard.slice();
  }).catch(function() {
    try { cachedBoard = normalizeBoard(JSON.parse(localStorage.getItem(LS_BOARD) || "[]")); }
    catch (e) { cachedBoard = []; }
    return cachedBoard.slice();
  });
}
function saveToBoard(entry) {
  var list = (cachedBoard || []).slice();
  list.push(entry);
  list.sort(function(a,b){ return b.score - a.score; });
  list = list.slice(0, 10);
  cachedBoard = list;
  try { localStorage.setItem(LS_BOARD, JSON.stringify(list)); } catch (e) {}
  return fetch(FB_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(list) })
    .catch(function() { /* offline: local copy already saved */ });
}
function lbHtml(list) {
  var html = "<h2 style=\"font-size:20px; margin-bottom:6px;\">🏆 " + t("leaderboard") + " - " + t("top10") + "</h2>";
  if (!list.length) return html + "<p>" + t("noScores") + "</p>";
  list.forEach(function(e, i) {
    var crown = i === 0 ? "<span class=\"lb-crown\">👑</span> " : "";
    var title = i === 0 ? "<div class=\"lb-title\">" + t("champion") + "</div>" : "";
    html += "<div class=\"lb-row\"><span class=\"rank\">" + (i + 1) + ".</span><span>" + crown + escapeHtml(e.name) + "</span><span><b>" + e.score + "</b></span></div>" + title;
  });
  return html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function renderGameLb() {
  getBoard().then(function(list) {
    document.getElementById("gameLb").innerHTML = lbHtml(list);
    document.getElementById("startLb").innerHTML = lbHtml(list);
  });
}
function renderEndLb() {
  getBoard().then(function(list) {
    document.getElementById("endLb").innerHTML = lbHtml(list);
  });
}
document.getElementById("saveScoreBtn").addEventListener("click", function() {
  var name = document.getElementById("nameInput").value.trim() || "Bé Cá";
  var btn = document.getElementById("saveScoreBtn");
  btn.disabled = true;
  saveToBoard({ name: name, score: state.score, date: new Date().toISOString().slice(0, 10) }).then(function() {
    document.getElementById("saveMsg").textContent = t("saved");
    renderEndLb(); renderGameLb();
  }).catch(function() {
    document.getElementById("saveMsg").textContent = t("savedFail");
    btn.disabled = false;
  });
});

/* ================= Visit counter ================= */
var VISITS_URL = "https://flappy-fish-leaderboard-default-rtdb.firebaseio.com/board/visits/animal-crush.json";
function updateVisits() {
  var el = document.getElementById("visitCount");
  var today = new Date().toISOString().slice(0, 10);
  var lastDay = localStorage.getItem("animalCrushVisitDay");
  var show = function(n) { el.textContent = "🐠 " + t("visits").replace("{n}", n); };
  var known = parseInt(localStorage.getItem("animalCrushVisits") || "0", 10);
  if (known) show(known);
  if (lastDay === today) {
    /* already counted today: just read the latest number */
    fetch(VISITS_URL).then(function(r){ return r.json(); }).then(function(v) {
      var n = parseInt(v, 10); if (!isNaN(n) && n > 0) { localStorage.setItem("animalCrushVisits", String(n)); show(n); }
    }).catch(function(){});
    return;
  }
  fetch(VISITS_URL).then(function(r){ return r.json(); }).then(function(v) {
    var n = parseInt(v, 10); if (isNaN(n)) n = 0;
    var next = n + 1;
    return fetch(VISITS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next) }).then(function() {
      localStorage.setItem("animalCrushVisitDay", today);
      localStorage.setItem("animalCrushVisits", String(next));
      show(next);
    });
  }).catch(function(){});
}

/* ================= Language & UI wiring ================= */
function applyLang() {
  document.documentElement.lang = LANG;
  document.getElementById("tagline").textContent = t("tagline");
  document.getElementById("howto").innerHTML = t("howto");
  document.getElementById("playBtn").textContent = t("play");
  document.getElementById("lblLevel").textContent = t("level") + ":";
  document.getElementById("lblScore").textContent = t("score") + ":";
  document.getElementById("lblBest").textContent = t("best") + ":";
  document.getElementById("lblTarget").textContent = t("target") + ":";
  document.getElementById("lblMoves").textContent = t("moves") + ":";
  document.getElementById("saveScoreBtn").textContent = t("save");
  document.getElementById("nextBtn").textContent = t("next");
  document.getElementById("retryBtn").textContent = t("retry");
  document.getElementById("endHomeBtn").textContent = t("home");
  document.getElementById("bestLine").textContent = t("best") + ": " + state.best;
  document.getElementById("nameInput").placeholder = t("yourName");
  var known = parseInt(localStorage.getItem("animalCrushVisits") || "0", 10);
  if (known) document.getElementById("visitCount").textContent = "🐠 " + t("visits").replace("{n}", known);
  renderGameLb();
}
function setLang(l) {
  LANG = l;
  localStorage.setItem("animalCrushLang", l);
  applyLang();
}
document.getElementById("langBtn").addEventListener("click", function() { setLang(LANG === "vi" ? "en" : "vi"); });
document.getElementById("langBtnStart").addEventListener("click", function() { setLang(LANG === "vi" ? "en" : "vi"); });
function syncMusicBtns() {
  var icon = AudioEng.isMusicOn() ? "🔊" : "🔇";
  document.getElementById("musicBtn").textContent = icon;
  document.getElementById("musicBtnStart").textContent = icon;
}
document.getElementById("musicBtn").addEventListener("click", function() { AudioEng.unlock(); AudioEng.toggleMusic(); syncMusicBtns(); });
document.getElementById("musicBtnStart").addEventListener("click", function() { AudioEng.unlock(); AudioEng.toggleMusic(); syncMusicBtns(); });
document.getElementById("homeBtn").addEventListener("click", function() {
  state.over = true;
  AudioEng.stopMusic();
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  applyLang();
});
document.getElementById("playBtn").addEventListener("click", function() {
  AudioEng.unlock();
  startLevel(state.level);
});
document.getElementById("nextBtn").addEventListener("click", function() {
  showToast(t("levelUp"));
  startLevel(state.level + 1);
});
document.getElementById("retryBtn").addEventListener("click", function() { startLevel(state.level); });
document.getElementById("endHomeBtn").addEventListener("click", function() {
  AudioEng.stopMusic();
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");
  applyLang();
});

/* ================= Init ================= */
(function init() {
  var row = document.getElementById("logoRow");
  ANIMALS.forEach(function(a) {
    var img = document.createElement("img");
    img.src = IMG[a]; img.alt = a;
    row.appendChild(img);
  });
  applyLang();
  syncMusicBtns();
  updateVisits();
  renderGameLb();
})();
</script>
